<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The people shapes, at the sizes they are used (queue 435)</title></head>
<body style="margin:0;background:#0b1218;color:#cfe;font:12px ui-monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<div id="stage" style="padding:14px"></div>
<script>
/* Queue 435: "The people shapes look awful… make sure they actually have arms". They DO have arms in
   the code (queue 160), so the first job is to look at what actually RENDERS, at the sizes they are
   really seen at: the add-menu icon (~24-51px) and the canvas. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.traceShapePath)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), stage=document.getElementById('stage');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  await sleep(400);
  var sizes=[24,32,51,96,220];
  ['person','woman'].forEach(function(kind){
    var row=document.createElement('div'); row.style.cssText='display:flex;gap:16px;align-items:flex-end;margin-bottom:18px';
    var lab=document.createElement('div'); lab.textContent=kind; lab.style.cssText='width:60px;color:#8fb';
    row.appendChild(lab);
    sizes.forEach(function(px){
      var wrap=document.createElement('div'); wrap.style.cssText='text-align:center';
      var c=document.createElement('canvas'); c.width=px*2; c.height=px*2;
      c.style.cssText='width:'+px+'px;height:'+px+'px;background:#101a22;border:1px solid #223';
      var g=c.getContext('2d'); g.scale(2,2);
      g.save();
      FM.traceShapePath(g, { shape: kind }, 0, 0, px, px);
      g.fillStyle='#8fd7ff'; g.fill('nonzero');
      g.restore();
      var t=document.createElement('div'); t.textContent=px+'px'; t.style.cssText='color:#678;font-size:10px;margin-top:3px';
      wrap.appendChild(c); wrap.appendChild(t); row.appendChild(wrap);
    });
    // …and an OUTLINE version, which is how the add-menu icon draws it
    var wrap2=document.createElement('div'); wrap2.style.cssText='text-align:center';
    var c2=document.createElement('canvas'); c2.width=96; c2.height=96;
    c2.style.cssText='width:48px;height:48px;background:#101a22;border:1px solid #223';
    var g2=c2.getContext('2d'); g2.scale(2,2);
    g2.beginPath(); FM.traceShapePath(g2,{ shape: kind },0,0,48,48);
    g2.strokeStyle='#8fd7ff'; g2.lineWidth=2; g2.stroke();
    var t2=document.createElement('div'); t2.textContent='outline 48'; t2.style.cssText='color:#678;font-size:10px;margin-top:3px';
    wrap2.appendChild(c2); wrap2.appendChild(t2); row.appendChild(wrap2);
    stage.appendChild(row);
  });
  document.title='ready';
 }).catch(function(e){stage.textContent='ERR '+e.message;document.title='ERR';});
});
</script></body></html>
