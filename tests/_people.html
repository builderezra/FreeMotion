<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#160 — the two people shapes, for judging</title>
<style>
  html,body{margin:0;background:#ffffff;color:#111;font:13px/1.4 system-ui,sans-serif}
  /* WRAP, and enough room for all six. The first cut was one non-wrapping row on a 900px shot, which
     silently CLIPPED the last column — so the 24px woman was never rendered, and she is the figure that
     fails first. A judging sheet that quietly drops a case is worse than no sheet. */
  .row{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-end;padding:22px 26px;max-width:860px}
  figure{margin:0;text-align:center}
  figcaption{margin-top:6px;font-size:12px;color:#444}
  canvas{background:#fff;image-rendering:auto}
</style></head><body>
<div class="row" id="row"></div>
<script src="js/settings.js"></script><script src="js/scene.js"></script>
<script src="js/eases.js"></script><script src="js/masks.js"></script>
<script src="js/behaviors.js"></script><script src="js/media.js"></script>
<script src="js/blend-modes.js"></script><script src="js/compositor.js"></script>
<script>
/* Ezra (#160): "The two people shapes are good but need arms, make sure when adding arms you get other
   agents to verify if it's any good or not."
   This renders both figures black-on-white at the sizes that matter — big enough to judge the drawing,
   and 24px because that is the add-menu icon where every earlier figure change has actually failed.
   White ground on purpose: these are judged as SILHOUETTES, and a dark UI ground flatters them. */
(function () {
  const row = document.getElementById('row');
  const draw = (kind, n) => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = n;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, n, n);
    const layer = FM.makeLayer('shape', { shape: kind, x: n / 2, y: n / 2, shapeW: n, shapeH: n, fill: '#111', start: 0, duration: 2 });
    const sc = { layers: [layer], project: { width: n, height: n, fps: 30, duration: 2, background: null, markers: [] } };
    FM.renderScene(ctx, sc, 0);
    const f = document.createElement('figure');
    f.appendChild(cv);
    const c = document.createElement('figcaption'); c.textContent = kind + ' — ' + n + 'px';
    f.appendChild(c);
    return f;
  };
  [['person', 256], ['woman', 256], ['person', 96], ['woman', 96], ['person', 24], ['woman', 24]]
    .forEach(([k, n]) => row.appendChild(draw(k, n)));
  window.__done = true;
})();
</script></body></html>
