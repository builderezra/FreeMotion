<!doctype html><html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#111">
<pre id="o" style="color:#cfd;font:11px ui-monospace;padding:10px;white-space:pre-wrap">running…</pre>
<iframe id="a" src="../index.html" style="width:900px;height:120px;border:0"></iframe>
<script>
/* THE WHOLE QUESTION AT ONCE, instead of one hole at a time.
   Every kernel in BOUNDED_FX, against the box the RENDERER computes, across every way the box has been
   found wrong so far — and every way a plate can be dirty. Three holes were found one at a time today
   (a stride, a clean fixture, an alpha threshold) and each was patched separately; this asks the whole
   matrix so what is left is known rather than hoped. */
var out=[]; function say(s){ out.push(s); document.getElementById('o').textContent = out.join('\n'); }
document.getElementById('a').addEventListener('load', function () {
  var w=document.getElementById('a').contentWindow, n=0;
  (function wait(){ if(!(w.FM&&w.FM._fxBounds&&w.FM._pixelFx)){ if(n++>600) return say('FM never came up'); return setTimeout(wait,50);} setTimeout(function(){run(w);},700); })();
});
function run(w){
 try{
  var FM=w.FM, T=FM._FX_TABLES, W=420, H=320;
  var PARAMS={boxblur:{radius:10},dropshadow:{distance:12,softness:8},lensblur:{radius:10},
              hextiles:{size:20},tiltshift:{center:0.5,softness:0.5},mattechoker:{choke:-4,feather:4},radialshadow:{reach:40,x:50,y:35},edgeglow:{amount:1.5,radius:12,source:1},zoomstreaks:{amount:0.5,centerx:50,centery:50,threshold:0},spinstreaks:{amount:0.5,centerx:50,centery:50,decay:0.6},innerblur:{radius:8}};
  function base(dirty){
    var d=new Uint8ClampedArray(W*H*4);
    if(dirty) for(var q=0;q<W*H;q++){ var j=q*4; d[j]=(q*3)&255; d[j+1]=(q*11)&255; d[j+2]=(q*29)&255; d[j+3]=0; }
    return d;
  }
  function body(d){ for(var y=120;y<200;y++){ var r=y*W; for(var x=170;x<250;x++){ var i=(r+x)*4; d[i]=232;d[i+1]=163;d[i+2]=61;d[i+3]=255; } } }
  var SHAPES={
    'plain body':        function(d){ body(d); },
    'odd-col hairline':  function(d){ body(d); for(var y=200;y<300;y++){ var i=(y*W+205)*4; d[i]=232;d[i+1]=163;d[i+2]=61;d[i+3]=255; } },
    'odd-row hairline':  function(d){ body(d); for(var x=60;x<300;x++){ var i=(41*W+x)*4; d[i]=232;d[i+1]=163;d[i+2]=61;d[i+3]=255; } },
    'faint block a=3':   function(d){ body(d); for(var y=250;y<290;y++){ var r=y*W; for(var x=60;x<110;x++){ var i=(r+x)*4; d[i]=232;d[i+1]=163;d[i+2]=61;d[i+3]=3; } } },
    'feathered edge':    function(d){ for(var y=110;y<210;y++){ var r=y*W; for(var x=160;x<260;x++){
                            var dx=(x-210)/50, dy=(y-160)/50, rr=Math.sqrt(dx*dx+dy*dy);
                            var a=rr>=1?0:Math.round(255*(1-rr)*(1-rr)); var i=(r+x)*4;
                            /* RGB stays 0 where alpha is 0 — a canvas stores premultiplied, so a real
                               feathered layer CANNOT carry colour there. Writing it made this fixture
                               permanently "dirty" and the clean column meaningless. */
                            if(a){ d[i]=232;d[i+1]=163;d[i+2]=61; } d[i+3]=a; } } },
    'edge-touching':     function(d){ for(var y=0;y<80;y++){ var r=y*W; for(var x=0;x<90;x++){ var i=(r+x)*4; d[i]=232;d[i+1]=163;d[i+2]=61;d[i+3]=255; } } }
  };
  var kernels=Object.keys(T.BOUNDED_FX).filter(function(k){ return k!=='letterbox'&&k!=='border'&&FM._pixelFx[k]&&PARAMS[k]; });
  say('kernels under test: '+kernels.join(', '));
  say('(letterbox and border excluded — their bbox is semantic, not a skip)');
  say('');
  say('shape              plate   ' + kernels.map(function(k){return k.slice(0,9).padEnd(10);}).join(''));
  var fails=0, cells=0;
  Object.keys(SHAPES).forEach(function(sn){
    [false,true].forEach(function(dirty){
      var row='  '+sn.padEnd(19)+(dirty?'dirty ':'clean ')+'  ';
      kernels.forEach(function(k){
        var mk=function(){ var d=base(dirty); SHAPES[sn](d); return d; };
        var probe=mk(), box=FM._fxBounds(probe,W,H);
        if(!box){ row+='(no box) '; return; }
        var A=mk(), B=mk(), K=FM._pixelFx[k];
        try{ K(A,W,H,PARAMS[k],0.3,1); K(B,W,H,PARAMS[k],0.3,1,box); }catch(e){ row+='THREW     '; fails++; return; }
        var diff=0,mx=0; for(var i=0;i<A.length;i++) if(A[i]!==B[i]){ diff++; var dd=Math.abs(A[i]-B[i]); if(dd>mx)mx=dd; }
        cells++;
        if(diff){ fails++; row+=('x'+(mx>=100?'!':'')+diff).slice(0,9).padEnd(10); }
        else row+='ok'.padEnd(10);
      });
      say(row);
    });
  });
  say('');
  var BW=1080,BH=1920;
  var bp=new Uint8ClampedArray(BW*BH*4);
  for(var yy=120;yy<270;yy++){ var rr2=yy*BW; for(var xx=90;xx<270;xx++){ var ii=(rr2+xx)*4; bp[ii]=232;bp[ii+1]=163;bp[ii+2]=61;bp[ii+3]=255; } }
  var bt=1e9; for(var t=0;t<7;t++){ var t0=performance.now(); FM._fxBounds(bp,BW,BH); var ms=performance.now()-t0; if(ms<bt)bt=ms; }
  say('');
  say('cost of the scan on a 180x150 layer in a 1080x1920 plate: '+bt.toFixed(2)+'ms (once per effect per frame)');
  /* ⚠️ RADIAL SHADOW'S BOUND IS GEOMETRY, so one light position proves nothing about it. Sweep the
     light across the frame, outside it, and to the corners, at every reach. */
  say('');
  var rbad=0, rn=0;
  var LIGHTS=[[50,35],[0,0],[100,100],[50,-40],[-30,50],[140,20],[50,120],[99.9,0.1],[0.1,99.9]];
  var REACH=[1,10,40,80,100];
  Object.keys(SHAPES).forEach(function(sn){
    LIGHTS.forEach(function(L){ REACH.forEach(function(R){
      var mk=function(){ var d=base(false); SHAPES[sn](d); return d; };
      var box=FM._fxBounds(mk(),W,H); if(!box) return;
      var q={reach:R,x:L[0],y:L[1]};
      var A=mk(), B=mk();
      try{ FM._pixelFx.radialshadow(A,W,H,q,0.3,1); FM._pixelFx.radialshadow(B,W,H,q,0.3,1,box); }
      catch(e){ rbad++; say('  ❌ threw '+sn+' light '+L+' reach '+R); return; }
      var diff=0,mx=0; for(var i=0;i<A.length;i++) if(A[i]!==B[i]){ diff++; var dd=Math.abs(A[i]-B[i]); if(dd>mx)mx=dd; }
      rn++;
      if(diff){ rbad++; if(rbad<6) say('  ❌ '+sn+'  light '+JSON.stringify(L)+'  reach '+R+' -> '+diff+' bytes, max '+mx); }
    }); });
  });
  /* Edge Glow's pad is derived from its RADIUS and its field from its SOURCE mode, so the defaults
     prove neither. */
  var ebad=0, en=0;
  [1,3,12,30,60].forEach(function(R){ [0,1,2].forEach(function(SRC){ [0,1].forEach(function(BL){
    Object.keys(SHAPES).forEach(function(sn){
      var mk=function(){ var d=base(false); SHAPES[sn](d); return d; };
      var box=FM._fxBounds(mk(),W,H); if(!box) return;
      var q={amount:1.5,radius:R,source:SRC,bloom:BL};
      var A=mk(), B=mk();
      try{ FM._pixelFx.edgeglow(A,W,H,q,0.3,1); FM._pixelFx.edgeglow(B,W,H,q,0.3,1,box); }
      catch(e){ ebad++; return; }
      var diff=0,mx=0; for(var i=0;i<A.length;i++) if(A[i]!==B[i]){ diff++; var dd=Math.abs(A[i]-B[i]); if(dd>mx)mx=dd; }
      en++;
      if(diff){ ebad++; if(ebad<6) say('  ❌ edgeglow '+sn+' r='+R+' src='+SRC+' bloom='+BL+' -> '+diff+'B max '+mx); }
    });
  }); }); });
  say('Edge Glow radius/source/bloom sweep: '+en+' combinations, '+(ebad? ('❌ '+ebad+' diverge'):'✅ all identical'));
  fails+=ebad;
  var zbad=0, zn=0;
  [[50,50],[0,0],[100,100],[20,80],[130,-20],[50,0]].forEach(function(C){ [0,0.25,0.5,0.75,1].forEach(function(A){ [0,40,90].forEach(function(TH){
    Object.keys(SHAPES).forEach(function(sn){
      var mk=function(){ var d=base(false); SHAPES[sn](d); return d; };
      var box=FM._fxBounds(mk(),W,H); if(!box) return;
      var q={amount:A,centerx:C[0],centery:C[1],threshold:TH};
      var A2=mk(), B2=mk();
      try{ FM._pixelFx.zoomstreaks(A2,W,H,q,0.3,1); FM._pixelFx.zoomstreaks(B2,W,H,q,0.3,1,box); }catch(e){ zbad++; return; }
      var diff=0,mx=0; for(var i=0;i<A2.length;i++) if(A2[i]!==B2[i]){ diff++; var dd=Math.abs(A2[i]-B2[i]); if(dd>mx)mx=dd; }
      zn++;
      if(diff){ zbad++; if(zbad<6) say('  ❌ zoomstreaks '+sn+' c='+JSON.stringify(C)+' amt='+A+' thr='+TH+' -> '+diff+'B max '+mx); }
    });
  }); }); });
  var sbad=0, sn2=0;
  [[50,50],[0,0],[100,100],[20,80],[130,-20]].forEach(function(C){ [0.05,0.25,0.5,0.75,1].forEach(function(A){ [0,0.6,2].forEach(function(DC){
    Object.keys(SHAPES).forEach(function(shn){
      var mk=function(){ var d=base(false); SHAPES[shn](d); return d; };
      var box=FM._fxBounds(mk(),W,H); if(!box) return;
      var q={amount:A,centerx:C[0],centery:C[1],decay:DC};
      var A3=mk(), B3=mk();
      try{ FM._pixelFx.spinstreaks(A3,W,H,q,0.3,1); FM._pixelFx.spinstreaks(B3,W,H,q,0.3,1,box); }catch(e){ sbad++; return; }
      var diff=0,mx=0; for(var i=0;i<A3.length;i++) if(A3[i]!==B3[i]){ diff++; var dd=Math.abs(A3[i]-B3[i]); if(dd>mx)mx=dd; }
      sn2++;
      if(diff){ sbad++; if(sbad<6) say('  ❌ spinstreaks '+shn+' c='+JSON.stringify(C)+' amt='+A+' dec='+DC+' -> '+diff+'B max '+mx); }
    });
  }); }); });
  say('Spin Streaks centre/amount/decay sweep: '+sn2+' combinations, '+(sbad? ('❌ '+sbad+' diverge'):'✅ all identical'));
  fails+=sbad;
  say('Zoom Streaks centre/amount/threshold sweep: '+zn+' combinations, '+(zbad? ('❌ '+zbad+' diverge'):'✅ all identical'));
  fails+=zbad;
  say('Radial Shadow light/reach sweep: '+rn+' combinations, '+(rbad? ('❌ '+rbad+' diverge') : '✅ all identical'));
  fails+=rbad;
  say(fails? ('❌ '+fails+' of '+(cells+fails)+' cells diverge  (x<n> = n bytes differ; ! = max delta >= 100)')
           : ('✅ all '+cells+' cells byte-identical'));
  window.__done=1;
 }catch(e){ say('threw: '+(e&&e.message)); window.__done=1; }
}
</script></body></html>
