<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preset probe 4</title></head>
<body>
<pre id="out">booting…</pre>
<iframe id="f" src="../index.html" style="width:380px;height:700px;border:0"></iframe>
<script>
var out = document.getElementById('out'); var L = [];
function log(){ L.push(Array.prototype.slice.call(arguments).join(' ')); out.textContent = L.join('\n'); }
function J(v){ try { return JSON.stringify(v); } catch(e){ return '<<'+e.message+'>>'; } }

document.getElementById('f').addEventListener('load', function(){
  var w = this.contentWindow, d = this.contentDocument, tries = 0;
  (function wait(){
    tries++;
    if (!(w.FM && w.FM.scene && w.FM.fxRegistry && w.FM.effectPresets && w.FM.inspector && w.FM.home)) {
      if (tries > 200) { log('TIMEOUT'); document.title='DONE'; return; }
      return setTimeout(wait, 50);
    }
    setTimeout(function(){ run(w, d); }, 400);
  })();
});

function run(w, d){
  var FM = w.FM, LS = w.localStorage;
  try {
    ['fm.fx.userpresets','fm.fxpresets','fm.layerpresets'].forEach(function(k){ LS.removeItem(k); });
    FM.home.close();
    function newShape(){ FM.addShapeLayer('rect'); return FM.scene.layers[0]; }

    // ===== A. registry census =====
    var all = FM.fxRegistry.all().filter(Boolean);
    var layerRef = all.filter(function(r){ return (r.params||[]).some(function(p){ return p.type==='layer'; }); });
    var textOnly = all.filter(function(r){ return r.appliesTo==='text'; });
    var mediaOnly = all.filter(function(r){ return r.appliesTo==='media'; });
    log('=== A. registry census ===');
    log('effects total: ' + all.length);
    log('with a layer-REF param (cannot travel between projects): ' + layerRef.length + ' → ' + layerRef.map(function(r){return r.type;}).join(','));
    log('appliesTo=text: ' + textOnly.length + ' → ' + textOnly.slice(0,8).map(function(r){return r.type;}).join(','));
    log('appliesTo=media: ' + mediaOnly.length + ' → ' + mediaOnly.slice(0,8).map(function(r){return r.type;}).join(','));
    log('param TYPES in use: ' + Object.keys(all.reduce(function(a,r){ (r.params||[]).forEach(function(p){ a[p.type]=1; }); return a; },{})).join(','));

    // ===== B. cross-layer ref: does each system carry a dangling source id? =====
    log('\n=== B. cross-layer source ref ===');
    var matteSrc = newShape(); matteSrc.name = 'Matte src';
    var target = newShape(); target.start = 0; target.duration = 5;
    var lm = FM.fxRegistry.makeInstance('lumamatte');
    lm.params.source = matteSrc.id;
    target.effects = [lm];
    log('live instance: ' + J(lm));
    log('effectPresets.capture → ' + J(FM.effectPresets.capture(lm, 'Matte preset')));
    FM.fxPresets.save('Matte stack', target.effects);
    log('fxPresets stored → ' + LS.getItem('fm.fxpresets'));
    FM.layerPresets.save('Matte layer', target);
    log('layerPresets stored effects → ' + J(FM.layerPresets.list()[0].data.effects));
    log('  → the stack systems keep params.source="' + matteSrc.id + '"; in another project that id does not exist.');

    // ===== C. supportsLayer is NOT consulted by either stack path =====
    log('\n=== C. type gating on apply ===');
    var tOnly = textOnly[0];
    if (tOnly) {
      var vic = newShape();
      var tfx = FM.fxRegistry.makeInstance(tOnly.type);
      FM.fxPresets.save('Text-only look', [tfx]);
      var row = FM.fxPresets.get('Text-only look');
      vic.effects = row.effects.map(function(e){ return JSON.parse(JSON.stringify(e)); });   // the card's handler, verbatim
      log('applied "' + tOnly.type + '" (appliesTo=text) to a SHAPE layer via the Presets card → layer.effects=' + J(vic.effects.map(function(e){return e.type;})));
      log('  fxRegistry.supportsLayer("' + tOnly.type + '", shape) = ' + FM.fxRegistry.supportsLayer(tOnly.type, vic) + '  (the fx-browser add path checks this; the preset paths do not)');
    }

    // ===== D. what a look depends on that no preset carries =====
    log('\n=== D. layer state NOT carried by any preset ===');
    var m = newShape();
    m.masks = [{ mode:'add', feather:4, path:{ pts:[[0,0],[1,0],[1,1]] } }];
    m.behaviors = [{ type:'wiggle', params:{ amp: 40 } }];
    m.motionBlur = { enabled: true, shutter: 180 };
    m.wiggle = { enabled: true };
    m.textAnim = null; m.speed = 2; m.volume = 0.4; m.fadeIn = 0.3;
    m.transform.anchorX = 0.25; m.transform.anchorY = 0.75;
    FM.layerPresets.save('Deep look', m);
    var keys = Object.keys(FM.layerPresets.list()[0].data);
    log('layerPreset payload keys: ' + keys.join(','));
    ['masks','behaviors','motionBlur','wiggle','speed','volume','fadeIn','fadeOut','textAnim','frameBlend','parent','clipColor'].forEach(function(k){
      log('   ' + k + ' carried? ' + (keys.indexOf(k) >= 0));
    });
    log('transform sub-keys carried: ' + Object.keys(FM.layerPresets.list()[0].data.transform).join(',') + '   (layer.transform really has: ' + Object.keys(m.transform).join(',') + ')');

    // ===== E. Presets card with an EMPTY store =====
    log('\n=== E. Presets card, empty store ===');
    ['fm.fx.userpresets','fm.fxpresets','fm.layerpresets'].forEach(function(k){ LS.removeItem(k); });
    var e0 = newShape(); FM.selectLayer(e0.id);
    FM.inspector.openCategory('presets');
    log(d.getElementById('inspector').innerHTML.replace(/></g,'>\n<'));

    // ===== F. realistic multi-effect "cinematic" stack cost =====
    log('\n=== F. size of a realistic multi-effect look ===');
    var stack = ['glow','blur','rgbsplit','chromaticaberration','vignette'].map(function(t){ return FM.fxRegistry.makeInstance(t); }).filter(Boolean);
    stack[0].params.radius = { kf:[{t:0,v:4,e:'easeInOut'},{t:1,v:40,e:'easeInOut'},{t:2,v:8,e:'linear'}] };
    FM.fxPresets.save('CC_Advanced Cinematic', stack);
    log('5-effect stack row bytes: ' + LS.getItem('fm.fxpresets').length);
    log('  as JSON: ' + LS.getItem('fm.fxpresets').slice(0, 700));
  } catch (e) { log('!! THREW: ' + e.message + '\n' + e.stack); }
  document.title = 'DONE';
}
</script>
</body>
</html>
