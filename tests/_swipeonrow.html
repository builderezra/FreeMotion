<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Swiping with the finger ON the add row (queue 429)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:390px;top:0;width:940px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.timeline)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), o=[];
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var W=f.contentWindow, d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  FM.scene.layers.length=0;
  for(var i=0;i<3;i++){ var L=FM.makeLayer('shape',{name:'Clip '+(i+1),shape:'rect',x:540,y:700+i*250,shapeW:300,shapeH:220,fill:'#3a7bd5'});
    L.start=0; L.duration=8; FM.scene.layers.push(L); }
  FM.scene.project.duration=20; FM.refreshAll(); FM.timeline.rebuild(); await sleep(500);
  var tl=d.getElementById('timeline');

  async function swipe(startEl, label, offX){
    tl.scrollLeft = 120; await sleep(80);
    var r=startEl.getBoundingClientRect();
    var x=Math.round(r.left + (offX==null? r.width*0.55 : offX)), y=Math.round(r.top + r.height/2);
    var plus=d.querySelector('.tl-addrow-plus');
    var p0=plus?plus.getBoundingClientRect().left:null;
    var s0=tl.scrollLeft, a0=FM.addAt, t0=FM.time;
    var id=41;
    function ev(type,cx,cy,target){ (target||W).dispatchEvent(new W.PointerEvent(type,{clientX:cx,clientY:cy,pointerId:id,isPrimary:true,bubbles:true,cancelable:true,buttons:1})); }
    ev('pointerdown',x,y,startEl); await sleep(40);
    for(var k=1;k<=6;k++){ ev('pointermove',x-k*22,y); await sleep(24); }
    var plus2=d.querySelector('.tl-addrow-plus');
    var pMid=plus2?plus2.getBoundingClientRect().left:null;
    ev('pointerup',x-6*22,y); await sleep(260);
    var plus3=d.querySelector('.tl-addrow-plus');
    var p1=plus3?plus3.getBoundingClientRect().left:null;
    o.push(label);
    o.push('   scrollLeft '+s0+' → '+Math.round(tl.scrollLeft)+'   FM.time '+t0.toFixed(2)+' → '+FM.time.toFixed(2)+'   addAt '+a0+' → '+FM.addAt);
    o.push('   + x '+(p0==null?'?':p0.toFixed(1))+'  mid-swipe '+(pMid==null?'?':pMid.toFixed(1))+'  after '+(p1==null?'?':p1.toFixed(1))
      +'   → moved MID-SWIPE by '+((pMid!=null&&p0!=null)?Math.abs(pMid-p0).toFixed(1):'?')+'px');
    o.push('');
  }

  var row=d.querySelector('.tl-addrow');
  var lane=d.getElementById('tl-inner');
  await swipe(row,  'A) finger STARTS ON THE ADD ROW:');
  await swipe(lane, 'B) finger starts on the lane, away from the row:');
  var grip=d.querySelector('.tl-addrow-grip');
  if(grip) await swipe(grip, 'C) finger starts on the row GRIP (drag is meant to arm here):');
  document.getElementById('out').textContent=o.join('\n');
  document.title='ready';
 }).catch(function(e){document.getElementById('out').textContent='ERR '+e.message+'\n'+o.join('\n');document.title='ERR';});
});
</script></body></html>
