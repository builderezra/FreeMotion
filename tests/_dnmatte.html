<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>denoise x luma matte source (bug hunt)</title></head>
<body style="margin:0;background:#0b1218;color:#cfe;font:12px/1.6 ui-monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:12px;white-space:pre-wrap">measuring…</pre>
<script>
/* The ACTUAL claimed scenario, not a stand-in: a layer carrying Temporal Denoise is ALSO used as a Luma
   Matte source, so it renders twice inside one frame. The denoiser advances only when t is strictly
   greater than the last time it saw, so the second render is claimed to skip denoising and overwrite the
   history with a raw frame.
   A denoiser's whole job is to reduce FRAME-TO-FRAME change, so that is the measurement. The same scene
   is rendered with and without the matte consumer, and only the half of the canvas where the denoised
   layer sits alone is measured, so the consumer's own pixels cannot pollute the reading. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.renderScene&&w.FM.fxRegistry&&w.FM.makeLayer)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.onload=function(){waitFM(f.contentWindow).then(run).catch(function(e){out.textContent='ERR '+e.message+'\n'+e.stack;});};
function run(FM){
  var doc=f.contentDocument, W=160,H=90, L=[];
  function build(withMatte){
    FM.scene.layers.length=0;
    FM.scene.project.width=W; FM.scene.project.height=H;
    var S=FM.makeLayer('shape',{name:'src',shape:'rect',x:40,y:45,shapeW:70,shapeH:80,fill:'#808080'});
    S.start=0; S.duration=10;
    var grain=FM.fxRegistry.makeInstance('filmgrain')||FM.fxRegistry.makeInstance('grain');
    var dn=FM.fxRegistry.makeInstance('temporaldenoise');
    if(!dn||!grain) return null;
    S.effects=[grain,dn];
    FM.scene.layers.push(S);
    var M=FM.makeLayer('shape',{name:'consumer',shape:'rect',x:120,y:45,shapeW:70,shapeH:80,fill:'#ffffff'});
    M.start=0; M.duration=10;
    var lm=FM.fxRegistry.makeInstance('lumamatte');
    if(lm){ lm.params.source = withMatte ? S.id : ''; M.effects=[lm]; }
    FM.scene.layers.push(M);
    return {S:S,M:M,haveLm:!!lm};
  }
  function frame(t){
    var c=doc.createElement('canvas'); c.width=W; c.height=H;
    var ctx=c.getContext('2d',{willReadFrequently:true});
    FM.renderScene(ctx,FM.scene,t);
    return ctx.getImageData(0,0,W,H).data;
  }
  // only the LEFT half, where the denoised layer sits on its own
  function diffLeft(a,b){ var s=0,n=0; for(var y=0;y<H;y++) for(var x=0;x<W/2;x++){ var i=(y*W+x)*4; s+=Math.abs(a[i]-b[i]); n++; } return s/n; }
  function churn(withMatte){
    var r=build(withMatte); if(!r) return null;
    frame(1.00);
    var f2=frame(1.04), f3=frame(1.08);
    return {v:diffLeft(f2,f3), haveLm:r.haveLm};
  }
  var noMatte=churn(false);
  if(!noMatte){ out.textContent='CONTROL FAILED: temporaldenoise or a grain effect is missing from the registry.'; document.title='DONE'; return; }
  if(!noMatte.haveLm){ out.textContent='CONTROL FAILED: no lumamatte effect in the registry — the scenario cannot be built.'; document.title='DONE'; return; }
  var withMatte=churn(true);
  L.push('frame-to-frame change in the denoised layer:');
  L.push('   with NO matte consumer:      '+noMatte.v.toFixed(3));
  L.push('   used as a Luma Matte source: '+withMatte.v.toFixed(3));
  if(!(noMatte.v>0.2)){ out.textContent=L.join('\n')+'\n\nCONTROL FAILED: the denoised layer barely changes between frames even on its own, so there is nothing to compare.'; document.title='DONE'; return; }
  var ratio=withMatte.v/noMatte.v;
  L.push('   ratio: '+ratio.toFixed(2)+'x');
  L.push('');
  L.push(ratio>1.25
    ? '❌ being used as a matte source defeats the denoiser — '+ratio.toFixed(2)+'x more frame-to-frame noise'
    : '✅ the denoiser works the same whether or not the layer feeds a matte');
  out.textContent=L.join('\n');
  document.title='DONE';
}
</script></body></html>
