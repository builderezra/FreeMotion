<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>split x bounce (bug hunt)</title></head>
<body style="margin:0;background:#0b1218;color:#cfe;font:12px/1.6 ui-monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:12px;white-space:pre-wrap">measuring…</pre>
<script>
/* LEAD from the 21 Aug fan-out: a Bounce behavior rings off the JUMP between consecutive keyframes and
   returns 0 when there is no prior keyframe. A split inserts a synthetic boundary keyframe at the cut,
   which becomes kf[0] of the tail half — so the ring is silenced between the cut and the next real
   keyframe, and shrunk afterwards because the "previous" value is now the interpolated boundary one. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.splitLayer&&w.FM.behaviorValue&&w.FM.makeLayer)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.onload=function(){waitFM(f.contentWindow).then(run).catch(function(e){out.textContent='ERR '+e.message+'\n'+e.stack;});};
async function run(FM){
  var L=[];
  FM.scene.layers.length=0;
  var S=FM.makeLayer('shape',{name:'ball',shape:'rect',x:0,y:50,shapeW:20,shapeH:20,fill:'#fff'});
  S.start=0; S.duration=10;
  // a HOLD then a JUMP then a hold: the bounce rings after the jump at t=4
  S.transform.x={kf:[{t:2,v:0,e:'linear'},{t:4,v:100,e:'linear'},{t:9,v:100,e:'linear'}]};
  S.behaviors=[{type:'bounce',enabled:true,prop:'x',params:{elastic:0.5,freq:3,decay:1}}];
  FM.scene.layers.push(S);
  var times=[4.1,4.3,4.6,5.2,5.5,6.0,6.5,7.0,8.0];
  function ring(){ return times.map(function(t){ return +(FM.behaviorValue(S,'x',FM.evalProp(S.transform.x,t),t)-FM.evalProp(S.transform.x,t)).toFixed(3); }); }
  var before=ring();
  L.push('bounce before split: '+before.join(' '));
  var live=before.filter(function(v){return Math.abs(v)>0.5;}).length;
  if(live<4){ out.textContent=L.join('\n')+'\n\nCONTROL FAILED: the bounce was barely ringing to begin with ('+live+'/'+times.length+') — nothing can be judged.'; document.title='DONE'; return; }
  L.push('control: '+live+'/'+times.length+' samples ringing before the split  ✔');
  FM.time=5;
  await FM.splitLayer(S.id);
  var tail=FM.scene.layers[FM.scene.layers.length-1];
  L.push('');
  L.push('halves: '+FM.scene.layers.map(function(l){return l.start.toFixed(1)+'..'+(l.start+l.duration).toFixed(1)+' kf@['+(l.transform.x.kf||[]).map(function(k){return k.t;}).join(',')+']';}).join('   '));
  var after=times.map(function(t){
    var lay=FM.scene.layers.filter(function(l){return t>=l.start-1e-9 && t<=l.start+l.duration+1e-9;})[0]||FM.scene.layers[0];
    var base=FM.evalProp(lay.transform.x,t);
    return +(FM.behaviorValue(lay,'x',base,t)-base).toFixed(3);
  });
  L.push('bounce after  split: '+after.join(' '));
  var worst=0,worstT=null;
  times.forEach(function(t,i){ var d=Math.abs(after[i]-before[i]); if(d>worst){worst=d;worstT=t;} });
  L.push('');
  L.push(worst>1
    ? '❌ the split changed the bounce: worst '+worst.toFixed(2)+'px at t='+worstT
    : '✅ the bounce rings the same either side of the cut');
  out.textContent=L.join('\n');
  document.title='DONE';
}
</script></body></html>
