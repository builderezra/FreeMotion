<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>split x parenting (bug hunt)</title></head>
<body style="margin:0;background:#0b1218;color:#cfe;font:12px/1.6 ui-monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:12px;white-space:pre-wrap">measuring…</pre>
<script>
/* LEAD from the 21 Aug fan-out: splitting an animated PARENT clip is claimed to freeze every layer
   parented to it, because the head half keeps only the keyframes up to the cut and evalProp then clamps
   to the last one forever, while nothing relinks the children to the tail half.
   Measured, not argued. The CHILD is rendered alone (the parent is transparent) so its centroid IS the
   measurement, and a CONTROL demands the child actually moved before the split — a "nothing changed"
   verdict is worthless if parenting never applied in the first place. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.splitLayer&&w.FM.makeLayer&&w.FM.renderScene)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.onload=function(){waitFM(f.contentWindow).then(run).catch(function(e){out.textContent='ERR '+e.message+'\n'+e.stack;});};
function centroid(FM,doc,t,W,H){
  var c=doc.createElement('canvas'); c.width=W; c.height=H;
  var ctx=c.getContext('2d',{willReadFrequently:true});
  FM.renderScene(ctx,FM.scene,t);
  var d=ctx.getImageData(0,0,W,H).data, n=0, sx=0;
  for(var i=0;i<d.length;i+=4){ if(d[i]>120&&d[i+1]>120&&d[i+2]>120){ var p=i/4; n++; sx+=p%W; } }
  return n?sx/n:null;
}
async function run(FM){
  var doc=f.contentDocument, W=320,H=180, L=[];
  FM.scene.layers.length=0;
  FM.scene.project.width=W; FM.scene.project.height=H;
  // PARENT: animated left->right, drawn in near-black so it does not pollute the white-ink centroid
  var P=FM.makeLayer('shape',{name:'parent',shape:'rect',x:0,y:0,shapeW:6,shapeH:6,fill:'#050505'});
  P.start=0; P.duration=10;
  P.transform.x={kf:[{t:0,v:0,e:'linear'},{t:10,v:200,e:'linear'}]};
  FM.scene.layers.push(P);
  var C=FM.makeLayer('shape',{name:'child',shape:'rect',x:40,y:H/2-10,shapeW:20,shapeH:20,fill:'#ffffff'});
  C.start=0; C.duration=10; C.parent=P.id;
  FM.scene.layers.push(C);

  var times=[1,3,4.5,5,5.5,6,7,8,9];
  var before=times.map(function(t){return centroid(FM,doc,t,W,H);});
  L.push('child centroid.x before split: '+before.map(function(v){return v===null?'-':v.toFixed(1);}).join('  '));
  var spread=Math.max.apply(null,before.filter(function(v){return v!==null;})) - Math.min.apply(null,before.filter(function(v){return v!==null;}));
  if(!(spread>5)){ out.textContent='CONTROL FAILED: the child never moved with its parent (spread '+spread.toFixed(2)+'px) — parenting did not apply, so this probe cannot judge anything.\n'+L.join('\n'); document.title='DONE'; return; }
  L.push('control: the child travels '+spread.toFixed(1)+'px with its parent  ✔');
  L.push('');
  FM.time=5;
  await FM.splitLayer(P.id);
  var after=times.map(function(t){return centroid(FM,doc,t,W,H);});
  L.push('layers now: '+FM.scene.layers.map(function(l){return l.name;}).join(', '));
  L.push('child centroid.x after  split: '+after.map(function(v){return v===null?'-':v.toFixed(1);}).join('  '));
  L.push('');
  L.push('  t      before   after');
  var worst=0,worstT=null;
  times.forEach(function(t,i){
    var b=before[i],a=after[i];
    var d=(b===null||a===null)?0:Math.abs(a-b);
    if(d>worst){worst=d;worstT=t;}
    L.push('  '+String(t).padEnd(7)+String(b===null?'-':b.toFixed(1)).padEnd(9)+String(a===null?'-':a.toFixed(1))+((d>2)?'   <-- MOVED '+d.toFixed(1)+'px':''));
  });
  L.push('');
  L.push(worst>2?'❌ splitting the PARENT moved the child: worst '+worst.toFixed(1)+'px at t='+worstT
                :'✅ the child is unaffected by splitting its parent');
  out.textContent=L.join('\n');
  document.title='DONE';
}
</script></body></html>
