<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#130 — does the quality tier drop when the comp is genuinely expensive?</title>
<style>html,body{margin:0;background:#05070b;color:#cfd6e4;font:12.5px/1.55 ui-monospace,Menlo,monospace}
iframe{position:fixed;left:-10000px;top:0;width:1280px;height:860px;border:0}
#out{padding:12px;white-space:pre}</style></head><body>
<iframe id="app" src="index.html"></iframe><div id="out">measuring…</div>
<script>
/* Ezra (#130): "the project lags from just that, it also still doesn't compress the quality in the
   canvas playback, even though just for this one thing it shouldn't need to do that anyway."

   SECOND ATTEMPT. The first version of this probe built a comp out of eight shapes and reported a
   render cost of 0.08ms a frame — the ladder was never under any pressure at all, so "tier stayed at
   0" proved exactly nothing. That result was thrown away rather than reported. A probe that cannot
   make the machine struggle cannot answer a question about what happens when it struggles.

   So this one builds a comp that is actually expensive: a large 1080x1920 project, a real decoded
   IMAGE (generated here so the probe carries no fixture), and a stack of Gaussian Blurs — a
   full-canvas convolution per layer per frame, which is the shape of work resolution CAN help with,
   unlike video decode. Run it under `--cpu 6` so the machine is phone-slow.

   Read the answer against the last line of his own report. If the ladder holds at tier 0 with the
   frame cost well over budget AND the latch engaged, that is queue 54 working as designed — a drop
   was tried, did not pay for itself, and was undone — and "it doesn't compress the quality" is not
   the bug. If it holds at 0 with the latch NEVER engaging, it never even tried, and that is a defect. */
(function () {
  var out = document.getElementById('out'), fr = document.getElementById('app'), L = [];
  function done(){ out.textContent = L.join('\n'); window.__done = true; }
  fr.addEventListener('load', function () {
    var w = fr.contentWindow, tries = 0;
    (function wait() {
      if (++tries > 400) { L.push('FM never initialised'); return done(); }
      if (!w.FM || !w.FM.play || !w.FM._perfState || !w.FM.addMediaLayer) return setTimeout(wait, 50);
      setTimeout(function () { go(w); }, 500);
    })();
  });

  // A real image file, made here: a probe that needs a fixture is a probe that rots.
  function makeImage(w, W, H) {
    return new Promise(function (res) {
      var c = w.document.createElement('canvas'); c.width = W; c.height = H;
      var g = c.getContext('2d');
      for (var i = 0; i < 240; i++) {
        g.fillStyle = 'hsl(' + (i * 7 % 360) + ' 80% ' + (35 + (i % 40)) + '%)';
        g.fillRect((i * 37) % W, (i * 91) % H, 120, 90);
      }
      c.toBlob(function (b) { res(new w.File([b], 'tierprobe.png', { type: 'image/png' })); }, 'image/png');
    });
  }

  async function go(w) {
    var FM = w.FM;
    try {
      if (FM.home && FM.home.isOpen && FM.home.isOpen()) FM.home.close();
      var q = (FM.settings && FM.settings.get('playbackQuality')) || 'auto';
      L.push('playbackQuality: ' + q + (q === 'detail' ? '   *** "detail" parks the ladder at tier 0 BY DESIGN — nothing below means anything ***' : ''));

      FM.scene.layers = [];
      FM.scene.project.width = 1080; FM.scene.project.height = 1920; FM.scene.project.duration = 10;
      var file = await makeImage(w, 1400, 1400);
      var rec = await FM.loadImageFile(file);
      FM.addMediaLayer(rec);
      var base = FM.scene.layers[0];
      base.duration = 10;
      /* LEVELS, not blur. Second lesson from building this probe, and it matters beyond the probe:
         Gaussian Blur compiles to a canvas `filter` string, which is GPU work — eight of them on a
         1080x1920 comp at 6x CPU throttle moved renderAvg to 1.1ms, i.e. they are very nearly free on
         the clock the ladder actually measures. Levels is a per-pixel JS loop over the whole frame,
         so it lands squarely on the main thread, which is the cost the ladder was built to react to. */
      var lv = function () { return { type: 'levels', enabled: true, gamma: 1.7, inblack: 10, inwhite: 240,
                                      params: { gamma: 1.7, inblack: 10, inwhite: 240 } }; };
      base.effects = [lv(), lv()];
      for (var i = 0; i < 5; i++) {
        var l = FM.makeLayer('shape', { name: 'load' + i, shape: 'star', x: 300 + i * 90, y: 400 + i * 220,
          shapeW: 700, shapeH: 700, fill: '#3ce', start: 0, duration: 10 });
        l.effects = [lv()];
        FM.scene.layers.push(l);
      }
      FM.selectLayer(null); FM.refreshAll();
      await new Promise(function (r) { setTimeout(r, 400); });

      var samples = [];
      FM.time = 0;
      FM.play();
      for (var k = 0; k < 45; k++) {
        await new Promise(function (r) { setTimeout(r, 150); });
        samples.push(FM._perfState());
      }
      FM.pause();

      var tiers = samples.map(function (s) { return s.tier; });
      var last = samples[samples.length - 1];
      var avgs = samples.map(function (s) { return s.renderAvg; }).filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
      var med = avgs.length ? avgs[Math.floor(avgs.length / 2)] : 0;
      var budget = 1000 / 60 * 0.72;
      L.push('');
      L.push('6.75s of playback, 6 layers, 8 blurs, 1080x1920:');
      L.push('  median renderAvg    ' + med.toFixed(1) + ' ms      (the ladder drops above ' + budget.toFixed(1) + ' ms)');
      L.push('  UNDER PRESSURE?     ' + (med > budget ? 'YES — the ladder had a real reason to act' : 'NO — this probe still is not loading the machine, so nothing below means anything'));
      L.push('  tier path           ' + tiers.join('') + '   (0 = full resolution)');
      L.push('  tier reached        ' + Math.min.apply(null, tiers) + ' -> ' + Math.max.apply(null, tiers) + '  of ' + (last.tiers - 1));
      L.push('  latch ever engaged  ' + samples.some(function (s) { return s.locked; }) + '   (true = "shedding pixels did not pay, so it was undone")');
      L.push('  canvas px first/last ' + samples[0].canvasPx + ' / ' + last.canvasPx);
      L.push('  final               ' + JSON.stringify(last));
    } catch (e) {
      L.push('THREW: ' + (e && e.message || e));
      L.push((e && e.stack || '').split('\n').slice(0, 5).join('\n'));
    }
    try { FM.scene.layers = []; if (FM.storage && FM.storage.save) FM.storage.save(); } catch (e) {}
    done();
  }
})();
</script></body></html>
