<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>probe2</title>
<style>html,body{margin:0;background:#000}iframe{border:0;display:block}pre{color:#0f0;font:11px monospace;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<pre id="out">PENDING</pre>
<script>
var q = new URLSearchParams(location.search);
var W = +(q.get('w')||380), H = +(q.get('h')||800), MODE = q.get('mode')||'phone';
var SAFE = +(q.get('safe')||0);      // simulated env(safe-area-inset-top) in px
var f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function until(fn,ms){var t0=Date.now();while(Date.now()-t0<(ms||15000)){try{if(fn())return true;}catch(e){}await sleep(60);}return false;}
function box(elm){ if(!elm) return null; var r=elm.getBoundingClientRect(); return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),bottom:+r.bottom.toFixed(1)}; }
var R = {};
function say(o){ document.getElementById('out').textContent = JSON.stringify(o,null,1); }

async function openEditor(d, FM){
  var card = d.querySelector('.hm-card');
  if (card){ card.click(); await until(()=>!FM.home.isOpen(), 15000); }
  await sleep(700);
  if (FM.scene.layers.length < 2){
    FM.scene.layers.length = 0;
    FM.scene.layers.push(FM.makeLayer('text',{name:'Title',text:'Your Big Idea',x:FM.scene.project.width/2,y:FM.scene.project.height*0.32,size:96}));
    FM.scene.layers.push(FM.makeLayer('shape',{shape:'circle',name:'Circle',x:FM.scene.project.width*0.34,y:FM.scene.project.height*0.62,shapeW:260,shapeH:260,fill:'#5ac7ed'}));
    FM.refreshAll();
  }
  await sleep(600);
}

// The PROPOSED Preset preview screen, built with the app's own tokens, mounted where the real one
// would live so the measurement is real layout, not arithmetic.
function mountMock(d, host, safeTop){
  var html = ''
  + '<div class="__pp" style="position:absolute;inset:0;z-index:9;background:var(--panel,#10141d);display:flex;flex-direction:column">'
  + '  <div class="__pp-top" style="flex:none;display:flex;align-items:center;gap:10px;padding:14px;padding-top:calc(14px + '+safeTop+'px);border-bottom:1px solid var(--line-soft)">'
  + '    <button class="fxb-back" style="flex:none">‹</button>'
  + '    <div class="fxb-catview-title" style="flex:1;text-align:center">Preset preview</div>'
  + '    <button class="__pp-apply" style="flex:none;background:none;border:none;color:var(--accent);font-size:15px;font-weight:700;padding:6px 4px">Apply</button>'
  + '  </div>'
  + '  <div class="__pp-player" style="flex:none;width:100%;aspect-ratio:1/1;background:#000;position:relative"></div>'
  + '  <div class="__pp-scrub" style="flex:none;padding:10px 14px 12px">'
  + '    <div class="__pp-chip" style="font-size:11px;font-weight:700;height:18px">00:04:00</div>'
  + '    <div class="__pp-track" style="height:14px;margin:4px 0"></div>'
  + '    <div class="__pp-ends" style="display:flex;justify-content:space-between;font-size:10.5px;height:13px"><span>00:00:00</span><span>00:05:00</span></div>'
  + '  </div>'
  + '  <div class="__pp-list fxp-list" style="flex:1;min-height:0;overflow-y:auto;padding:0 14px 14px"></div>'
  + '</div>';
  var wrap = d.createElement('div'); wrap.innerHTML = html;
  var node = wrap.firstChild;
  host.appendChild(node);
  var list = node.querySelector('.__pp-list');
  var names = ['You’re dead','Preset 3','CC_Advanced Cinematic','It Might Be Time','FX_Rainbow Glitch','Preset 6','Preset 7','Preset 8','Preset 9','Preset 10'];
  names.forEach(function(n){
    var r = d.createElement('button'); r.className='fxp-row __pp-row';
    var t = d.createElement('div'); t.className='fxp-txt';
    var nm = d.createElement('div'); nm.className='fxp-name'; nm.textContent=n; t.appendChild(nm);
    r.appendChild(t);
    var dots = d.createElement('span'); dots.className='fxp-del'; dots.textContent='⋯'; r.appendChild(dots);
    list.appendChild(r);
  });
  return node;
}

f.addEventListener('load', function(){
  var d = f.contentDocument, w = f.contentWindow;
  (async function(){
    var ok = await until(()=> w.FM && w.FM.scene && w.FM.home, 20000);
    if(!ok) return say({error:'FM never init'});
    var st = d.createElement('style');
    st.textContent='*,*::before,*::after{animation:none!important;transition:none!important}#home-screen.hm-preintro > *{opacity:1!important}';
    d.head.appendChild(st);
    await sleep(400);
    var FM = w.FM;
    try {
      await openEditor(d, FM);
      if (MODE === 'studio') { d.body.classList.add('layout-studio'); await sleep(600); }
      FM.selectLayer(FM.scene.layers[0].id);
      await sleep(500);

      R.mode = MODE; R.safeTop = SAFE;
      R.viewport = { innerW: w.innerWidth, innerH: w.innerHeight };
      R.bodyClasses = d.body.className;

      // ---- studio band measurement ----
      var insp = d.getElementById('inspector-panel');
      R.inspector = { box: box(insp), client: insp?{w:insp.clientWidth,h:insp.clientHeight,scrollH:insp.scrollHeight}:null };
      R.timeline = box(d.getElementById('timeline-panel'));
      R.main = box(d.getElementById('main'));
      R.topbar = box(d.getElementById('topbar'));
      R.cssVars = (function(){ var c=w.getComputedStyle(d.body); return { railW: c.getPropertyValue('--rail-w').trim(), inspW: c.getPropertyValue('--insp-w').trim(), tlH: c.getPropertyValue('--tl-h').trim() }; })();
      // widest thing the band could host + what's already in it
      var cats = d.querySelector('.cat-grid'); R.catGrid = box(cats);
      R.inspBody = box(d.querySelector('.insp-body') || d.querySelector('#inspector-panel > *'));

      // ---- mount the proposed screen inside the real fx-browser ----
      FM.fxBrowser.open(FM.scene.layers[0]);
      await sleep(800);
      var root = d.getElementById('fx-browser');
      var node = mountMock(d, root, SAFE);
      await sleep(400);

      var top = node.querySelector('.__pp-top');
      var player = node.querySelector('.__pp-player');
      var scrub = node.querySelector('.__pp-scrub');
      var list = node.querySelector('.__pp-list');
      var rows = node.querySelectorAll('.__pp-row');
      R.proposed = {
        rootH: box(node).h,
        header: box(top),
        player: box(player),
        scrub: box(scrub),
        list: box(list),
        listClientH: list.clientHeight,
        rowH: box(rows[0]).h,
        rowPitch: rows.length>1 ? +(box(rows[1]).y - box(rows[0]).y).toFixed(1) : null
      };
      // how many rows are FULLY visible inside the list viewport, and how many are partly visible
      var lr = list.getBoundingClientRect();
      var full = 0, partial = 0;
      Array.prototype.forEach.call(rows, function(r){
        var b = r.getBoundingClientRect();
        if (b.top >= lr.top - 0.5 && b.bottom <= lr.bottom + 0.5) full++;
        else if (b.top < lr.bottom - 4 && b.bottom > lr.top + 4) partial++;
      });
      R.proposed.rowsFullyVisible = full;
      R.proposed.rowsPartlyVisible = partial;
      R.proposed.listScrollH = list.scrollHeight;

      // ---- variant: player capped at 46% of viewport height instead of square ----
      player.style.aspectRatio = '';
      player.style.height = Math.round(w.innerHeight * 0.42) + 'px';
      await sleep(200);
      var lr2 = list.getBoundingClientRect(); var full2=0, part2=0;
      Array.prototype.forEach.call(rows, function(r){ var b=r.getBoundingClientRect();
        if (b.top >= lr2.top-0.5 && b.bottom <= lr2.bottom+0.5) full2++;
        else if (b.top < lr2.bottom-4 && b.bottom > lr2.top+4) part2++; });
      R.variantPlayer42vh = { playerH: box(player).h, listH: box(list).h, rowsFullyVisible: full2, rowsPartlyVisible: part2 };

      // ---- variant: 42vh player + a bottom safe-area inset on the list (home indicator) ----
      var SAFEB = +(q.get('safeb')||0);
      list.style.paddingBottom = (14 + SAFEB) + 'px';
      await sleep(200);
      var lr3 = list.getBoundingClientRect(); var full3=0, part3=0;
      var padB = parseFloat(w.getComputedStyle(list).paddingBottom) || 0;
      Array.prototype.forEach.call(rows, function(r){ var b=r.getBoundingClientRect();
        if (b.top >= lr3.top-0.5 && b.bottom <= lr3.bottom - padB + 0.5) full3++;
        else if (b.top < lr3.bottom - padB - 4 && b.bottom > lr3.top+4) part3++; });
      R.variant42vhSafeBottom = { safeBottom: SAFEB, listH: box(list).h, usableH: +(box(list).h - padB).toFixed(1), rowsFullyVisible: full3, rowsPartlyVisible: part3 };

      // ---- variant: player inset 14px each side (not full-bleed), square ----
      player.style.height = ''; player.style.aspectRatio = '1/1';
      player.style.margin = '0 14px'; player.style.width = 'calc(100% - 28px)';
      await sleep(200);
      var lr4 = list.getBoundingClientRect(); var full4=0, part4=0;
      var padB4 = parseFloat(w.getComputedStyle(list).paddingBottom) || 0;
      Array.prototype.forEach.call(rows, function(r){ var b=r.getBoundingClientRect();
        if (b.top >= lr4.top-0.5 && b.bottom <= lr4.bottom - padB4 + 0.5) full4++;
        else if (b.top < lr4.bottom - padB4 - 4 && b.bottom > lr4.top+4) part4++; });
      R.variantInsetSquare = { playerH: box(player).h, listH: box(list).h, usableH:+(box(list).h-padB4).toFixed(1), rowsFullyVisible: full4, rowsPartlyVisible: part4 };

      // ---- variant: player uses the PROJECT aspect (portrait 9:16) instead of square ----
      player.style.aspectRatio = (FM.scene.project.width + '/' + FM.scene.project.height);
      await sleep(200);
      R.variantProjectAspect = { projectAspect: FM.scene.project.width+'x'+FM.scene.project.height, playerH: box(player).h, listH: box(list).h };

      R.projectAspect = FM.scene.project.width + 'x' + FM.scene.project.height;

      if (q.get('keep') === '1') {
        // restore variant A (full-bleed square) and leave it mounted for a screenshot
        player.style.aspectRatio='1/1'; player.style.height=''; player.style.margin=''; player.style.width='';
        list.style.paddingBottom = (14 + (+(q.get('safeb')||0))) + 'px';
        f.style.width=W+'px'; f.style.height=H+'px';
        document.getElementById('out').style.display='none';
        await sleep(300);
        return;
      }
      node.remove();

      // ---- dead-selector check: does theme-glass's .ctx-menu rule ever match? ----
      FM.contextMenu.show(20,20,[{label:'Rename…',action:function(){}}]);
      await sleep(200);
      var m = d.getElementById('ctx-menu');
      R.ctxMenuIdentity = { id: m.id, className: m.className, matchesDotCtxMenu: m.matches('.ctx-menu'),
        computedBackdrop: w.getComputedStyle(m).backdropFilter, bg: w.getComputedStyle(m).backgroundColor };
      R.htmlDataTheme = d.documentElement.getAttribute('data-theme');
      FM.contextMenu.hide();

      say(R);
    } catch(e){ R.fatal = String(e && e.stack || e); say(R); }
  })();
});
</script>
</body>
</html>
