<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squish harness</title>
<style>
  html, body { margin: 0; background: #05070b; color: #cfd6e4;
               font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #sheet { display: block; }
  #stats { padding: 8px 12px; white-space: pre-wrap; font-size: 12px; color: #8a93a6; }
  .bad { color: #ff7a85; font-weight: 700; }
</style>
</head>
<body>
<canvas id="sheet" width="10" height="10"></canvas>
<div id="stats">booting…</div>

<!-- The REAL compositor and its real dependencies. No app UI (app.js/inspector/timeline) — this
     page renders scenes, it does not edit them. Order matches index.html. -->
<script src="../js/settings.js"></script>
<script src="../js/scene.js"></script>
<script src="../js/eases.js"></script>
<script src="../js/masks.js"></script>
<script src="../js/behaviors.js"></script>
<script src="../js/media.js"></script>
<script src="../js/blend-modes.js"></script>
<script src="../js/compositor.js"></script>
<script src="../js/fx-registry.js"></script>
<script>
/* ============================================================================================
 * FreeMotion — SQUISH harness.  Dev-only; not shipped, not linked from the app.
 *
 * WHY THIS EXISTS
 *   The Squish effect makes the CANVAS EDGES act as walls: a layer that would go off-frame is
 *   compressed against the wall instead of being clipped. That is only judgeable as a picture,
 *   and only if you can see where the wall is. So this harness renders ONE layer through the
 *   REAL compositor (FM.renderScene) at 1:1, lays a series of those renders out as a labelled
 *   contact sheet, and draws the frame border on every tile.
 *
 * WHAT MAKES IT TRUSTWORTHY
 *   - Project background is TRANSPARENT, so every non-zero alpha pixel in a render IS subject.
 *     Each tile reports its own subject-pixel count; the page reports PASS/BLANK for the sheet.
 *     A blank capture can therefore never be mistaken for a result — read #stats (or --dump-dom
 *     and grep READY/BLANK) before believing any image.
 *   - Renders go into a canvas sized EXACTLY to the project, so __fmRS = 1 and plateScale() = 1:
 *     identical to export. ?do=ps deliberately breaks that to test the ps-scaling rule.
 *   - Everything is synchronous: when body[data-ready="1"] appears, the pixels are final.
 *
 * URL PARAMS
 *   do=sweep    the circle crossing the RIGHT wall and the BOTTOM wall (inside, touching,
 *               25%, 50%, 75% over) as one 5x2 sheet.                        [judge sheet #1]
 *   do=bounce   a ball dropped onto the bottom wall with a Bounce ease on y, 8 frames through
 *               the impact as one filmstrip.                                 [judge sheet #2]
 *   do=single   one big tile (default).      do=det  determinism: same frame twice, byte-diff.
 *   do=ps       the same three positions at plate scale 1 vs 0.5 — an effect whose lengths are
 *               not multiplied by ps changes strength between these rows. That is a BUG.
 *
 *   fx=<type>   effect type to apply (default bulge; fx=none for the un-effected control).
 *   p=<json>    effect params, URI-encoded JSON, merged over the registry defaults.
 *               e.g.  ?fx=squish&p=%7B%22amount%22%3A1%7D
 *   shape=circle|rect|poly|grid    subject (grid = a painted lattice image; best for reading
 *                                  how the INTERIOR deforms).
 *   size=NNN    subject size in project px (default 300 for sweep/ps, 150 for bounce).
 *   x=,y=       subject centre, do=single only.
 *   W=,H=       project size (default 480x480).
 *   ts=0.75     tile scale on the sheet.        t=0  time for the static modes.
 *   n=,d=       Bounce ease knobs (count, damping) for do=bounce.
 *   grid=1      draw a faint 1/4 grid inside each tile (helps read compression).
 * ==========================================================================================*/
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  function num(k, dflt) { var v = parseFloat(Q.get(k)); return isFinite(v) ? v : dflt; }
  var MODE   = Q.get('do') || 'single';
  var PW     = num('W', 480), PH = num('H', 480);
  var FXTYPE = Q.get('fx') == null ? 'bulge' : Q.get('fx');
  var SHAPE  = Q.get('shape') || 'circle';
  var TS     = num('ts', 0.75);
  var T0     = num('t', 0);
  var SHOWGRID = Q.get('grid') === '1';

  var FXPARAMS = {};
  var pRaw = Q.get('p');
  if (pRaw) { try { FXPARAMS = JSON.parse(pRaw) || {}; } catch (e) { FXPARAMS = { __parseError: String(e.message || e) }; } }

  /* ---- the effect instance ------------------------------------------------------------------
   * Through the registry when the type is registered (so defaults come from FM.EFFECTS, exactly
   * as the app would build it), and a bare instance when it is not — a prototype must be able to
   * drive this harness before it has earned a catalogue entry. */
  function makeFx() {
    if (!FXTYPE || FXTYPE === 'none') return null;
    var inst = (FM.fxRegistry && FM.fxRegistry.makeInstance) ? FM.fxRegistry.makeInstance(FXTYPE) : null;
    if (!inst) inst = { type: FXTYPE, enabled: true, params: {} };
    Object.keys(FXPARAMS).forEach(function (k) { inst.params[k] = FXPARAMS[k]; });
    return inst;
  }

  /* ---- subjects -----------------------------------------------------------------------------
   * ONE layer, always. The circle carries a contrasting ring because a ring is what makes a
   * squash readable — a filled disc deforming into an ellipse is subtle, a ring is not.
   * `grid` is an image layer backed by a canvas we paint ourselves (same trick fx-thumbs.js
   * uses): a lattice shows how the INTERIOR compresses, not just the silhouette. */
  var LATTICE_ID = '_squishLattice';
  function paintLattice(g, S) {
    g.clearRect(0, 0, S, S);
    g.fillStyle = '#1d6fe0'; g.fillRect(0, 0, S, S);
    g.strokeStyle = '#eaf1ff'; g.lineWidth = Math.max(1, S / 90);
    var n = 8, i;
    for (i = 1; i < n; i++) {
      var v = S * i / n;
      g.beginPath(); g.moveTo(v, 0); g.lineTo(v, S); g.stroke();
      g.beginPath(); g.moveTo(0, v); g.lineTo(S, v); g.stroke();
    }
    g.strokeStyle = '#ffd166'; g.lineWidth = Math.max(2, S / 40);
    g.strokeRect(g.lineWidth / 2, g.lineWidth / 2, S - g.lineWidth, S - g.lineWidth);
    g.fillStyle = '#ff3b6b'; g.beginPath(); g.arc(S / 2, S / 2, S * 0.12, 0, Math.PI * 2); g.fill();
  }
  var latticeReady = false;
  function ensureLattice(size) {
    if (latticeReady) return;
    var c = document.createElement('canvas'); c.width = c.height = 256;
    paintLattice(c.getContext('2d'), 256);
    FM.media.set(LATTICE_ID, { kind: 'image', el: c, width: size, height: size, duration: 0 });
    latticeReady = true;
  }

  function makeSubject(size, x, y) {
    if (SHAPE === 'grid') {
      ensureLattice(size);
      var im = FM.makeLayer('image', { x: x, y: y, start: 0, duration: 10 });
      im.id = LATTICE_ID;
      return im;
    }
    var l = FM.makeLayer('shape', {
      x: x, y: y, start: 0, duration: 10,
      shape: SHAPE === 'rect' ? 'rect' : (SHAPE === 'poly' ? 'polygon' : 'ellipse'),
      shapeW: size, shapeH: size,
      fill: '#2fd0b5',
    });
    l.sides = 5;
    // The ring: an inset stroke that deforms with the fill, so squash/stretch reads at a glance.
    l.stroke = { enabled: true, width: Math.max(4, size * 0.075), color: '#ffd166' };
    return l;
  }

  function makeScene(layer) {
    var s = FM.newScene();
    // TRANSPARENT background on purpose: renderScene only fills when P.background is truthy, so
    // every alpha>0 pixel in the render is subject and the blank-capture check below is exact.
    s.project = { name: 'squish', width: PW, height: PH, fps: 60, duration: 10, background: '' };
    s.layers = [layer];
    return s;
  }

  /* ---- render one frame at 1:1 (export conditions: __fmRS = 1 -> plateScale = 1) ------------- */
  var _rc = document.createElement('canvas');
  function renderFrame(scene, t, w, h) {
    w = w || PW; h = h || PH;
    if (_rc.width !== w || _rc.height !== h) { _rc.width = w; _rc.height = h; }
    var g = _rc.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, w, h);
    FM.renderScene(g, scene, t);
    return _rc;
  }
  /* MEASUREMENT, not just a picture. The subject's alpha bounding box and centroid, in project px.
     A squash IS a bbox getting shorter in one axis, so this is how a prototype proves the effect
     did what it claims instead of asserting it — and how you tell a deformation from a translation. */
  function measure(cv) {
    var g = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    var d = g.getImageData(0, 0, w, h).data;
    var x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, n = 0, sx = 0, sy = 0, x, y, a;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        a = d[(y * w + x) * 4 + 3];
        if (a <= 8) continue;
        n++; sx += x; sy += y;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (!n) return { lit: 0, w: 0, h: 0, x0: 0, y0: 0, x1: 0, y1: 0, cx: 0, cy: 0, scale: 1 };
    var S = w / PW;   // report everything in PROJECT px even when the plate was reduced
    return { lit: n, scale: S,
      x0: x0 / S, y0: y0 / S, x1: x1 / S, y1: y1 / S,
      w: (x1 - x0 + 1) / S, h: (y1 - y0 + 1) / S,
      cx: (sx / n) / S, cy: (sy / n) / S };
  }
  function fmtM(m) {
    if (!m.lit) return 'BLANK';
    // `lit` is counted on the PLATE, so a reduced plate has ~1/4 the pixels for the same picture.
    // Normalise it when the plate isn't 1:1, or do=ps reads as though the effect changed coverage.
    var lit = m.scale === 1 ? ('lit ' + m.lit)
            : ('lit ' + m.lit + ' plate px (~' + Math.round(m.lit / (m.scale * m.scale)) + ' at 1:1)');
    return 'bbox ' + m.w.toFixed(1) + 'x' + m.h.toFixed(1)
         + ' [' + m.x0.toFixed(0) + ',' + m.y0.toFixed(0) + '..' + m.x1.toFixed(0) + ',' + m.y1.toFixed(0) + ']'
         + ' centroid ' + m.cx.toFixed(1) + ',' + m.cy.toFixed(1) + ' ' + lit;
  }
  function snapshot(cv) {   // own copy — _rc is reused for the next tile
    var c = document.createElement('canvas');
    c.width = cv.width; c.height = cv.height;
    c.getContext('2d').drawImage(cv, 0, 0);
    return c;
  }

  /* ---- contact sheet -------------------------------------------------------------------- */
  var PAD = 16, GAP = 16, LABEL = 34, FOOT = 26, HEAD = 62;
  var LAST_TILES = [];
  function buildSheet(title, tiles, cols) {
    LAST_TILES = tiles;
    var tw = Math.round(PW * TS), th = Math.round(PH * TS);
    var rows = Math.ceil(tiles.length / cols);
    var W = PAD * 2 + cols * tw + (cols - 1) * GAP;
    var H = HEAD + rows * (LABEL + th + FOOT) + (rows - 1) * GAP + PAD;
    var cv = document.getElementById('sheet');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    g.fillStyle = '#0b0e14'; g.fillRect(0, 0, W, H);
    g.textBaseline = 'alphabetic';
    // Two lines: WHAT this sheet shows, then the exact conditions it was rendered under. One line
    // ran off the right edge of a narrow sheet, taking the fx and params — the part you need to
    // trust the picture — with it.
    g.fillStyle = '#e6ebf5';
    g.font = '600 17px ui-monospace, Menlo, monospace';
    g.fillText(title, PAD, 26);
    g.fillStyle = '#8a93a6';
    g.font = '13px ui-monospace, Menlo, monospace';
    g.fillText(conditions(), PAD, 46);

    tiles.forEach(function (tile, i) {
      var c = i % cols, r = (i / cols) | 0;
      var x = PAD + c * (tw + GAP);
      var y = HEAD + PAD + r * (LABEL + th + FOOT + GAP);

      g.fillStyle = tile.lit > 0 ? '#9fb0cc' : '#ff7a85';
      g.font = '600 14px ui-monospace, Menlo, monospace';
      g.fillText(tile.label, x, y + 20);

      // tile interior: a dark backdrop so the transparent render reads, then the render itself
      g.fillStyle = '#171b24';
      g.fillRect(x, y + LABEL, tw, th);
      if (SHOWGRID) {
        g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1;
        for (var q = 1; q < 4; q++) {
          g.beginPath(); g.moveTo(x + tw * q / 4 + .5, y + LABEL); g.lineTo(x + tw * q / 4 + .5, y + LABEL + th); g.stroke();
          g.beginPath(); g.moveTo(x, y + LABEL + th * q / 4 + .5); g.lineTo(x + tw, y + LABEL + th * q / 4 + .5); g.stroke();
        }
      }
      g.drawImage(tile.img, x, y + LABEL, tw, th);

      // THE FRAME BORDER — the whole point of the sheet is seeing where the canvas edge is.
      // Drawn just OUTSIDE the tile: a border painted ON the edge covers the very pixels that get
      // squashed against the wall, which is exactly what a judge is here to look at.
      g.strokeStyle = '#6f7c96'; g.lineWidth = 2;
      g.strokeRect(x - 1.5, y + LABEL - 1.5, tw + 3, th + 3);
      if (tile.wall) {                                  // the wall this tile is testing, in hot pink
        g.strokeStyle = '#ff3b6b'; g.lineWidth = 4;
        g.beginPath();
        if (tile.wall === 'right')  { g.moveTo(x + tw + 3, y + LABEL - 3); g.lineTo(x + tw + 3, y + LABEL + th + 3); }
        if (tile.wall === 'bottom') { g.moveTo(x - 3, y + LABEL + th + 3); g.lineTo(x + tw + 3, y + LABEL + th + 3); }
        g.stroke();
      }

      g.fillStyle = tile.lit > 0 ? '#7e8aa4' : '#ff7a85';
      g.font = '12px ui-monospace, Menlo, monospace';
      var foot = tile.lit > 0
        ? (tile.m ? 'bbox ' + tile.m.w.toFixed(0) + 'x' + tile.m.h.toFixed(0)
                    + '  lit ' + Math.round(tile.m.lit / (tile.m.scale * tile.m.scale)) : 'lit ' + tile.lit)
        : 'BLANK — nothing rendered';
      g.fillText(foot + (tile.note ? '   ' + tile.note : ''), x, y + LABEL + th + 21);
    });
    return cv;
  }

  /* ---- the modes ------------------------------------------------------------------------ */
  // Overlap fractions of the subject's own size that sit past the wall.
  var OVERS = [
    { f: -0.25, label: 'inside' },
    { f: 0,     label: 'touching' },
    { f: 0.25,  label: '25% over' },
    { f: 0.5,   label: '50% over' },
    { f: 0.75,  label: '75% over' },
  ];

  function tileAt(size, x, y, label, wall) {
    var layer = makeSubject(size, x, y);
    var fx = makeFx();
    if (fx) layer.effects = [fx];
    var scene = makeScene(layer);
    var cv = renderFrame(scene, T0);
    var m = measure(cv);
    return { img: snapshot(cv), lit: m.lit, m: m, label: label, wall: wall };
  }

  function doSweep() {
    var D = num('size', 300);
    var tiles = [];
    OVERS.forEach(function (o) {
      tiles.push(tileAt(D, PW - D / 2 + o.f * D, PH / 2, 'R  ' + o.label, 'right'));
    });
    OVERS.forEach(function (o) {
      tiles.push(tileAt(D, PW / 2, PH - D / 2 + o.f * D, 'B  ' + o.label, 'bottom'));
    });
    return buildSheet(sheetTitle('WALL SWEEP  — top row: RIGHT wall   bottom row: BOTTOM wall'), tiles, 5);
  }

  function doBounce() {
    var D = num('size', 150);
    var n = num('n', 3), d = num('d', 1);
    var yTop = D * 0.7, yFloor = PH - D / 2;        // yFloor: the ball's bottom exactly ON the wall
    var tLand = 0.7;
    var yProp = { kf: [
      { t: 0, v: yTop, e: 'linear' },
      { t: tLand, v: yFloor, ez: { fam: 'bounce', preset: 'bounce', p: { n: n, d: d } } },
    ] };
    // Where does the impact actually happen? ASK the curve rather than assuming: find first contact
    // (bottom of the ball reaches the wall) and the deepest point, then straddle them. That keeps the
    // filmstrip centred on the impact whatever the ease knobs are set to.
    var step = 1 / 600, tt, y, tTouch = -1, tPeak = 0, yPeak = -1e9;
    for (tt = 0; tt <= tLand * 1.6; tt += step) {
      y = FM.evalProp(yProp, tt);
      if (tTouch < 0 && y + D / 2 >= PH - 0.5) tTouch = tt;
      if (y > yPeak) { yPeak = y; tPeak = tt; }
    }
    if (tTouch < 0) { tTouch = tLand; tPeak = tLand; }
    var span = Math.max(step * 4, tPeak - tTouch);
    // Lead-in is capped at a fraction of tTouch, not just a multiple of span: the bounce ease dives
    // to the floor inside the first sixth of its segment, so a plain span*1.6 lead lands at NEGATIVE
    // time — before the layer exists — and frame 1 comes back empty. (Measured: it did.)
    var lead = Math.min(span * 1.6, tTouch * 0.85);
    var t0 = Math.max(0, tTouch - lead), t1 = tTouch + span * 4.0;
    var tiles = [], N = 8, i;
    for (i = 0; i < N; i++) {
      var tf = t0 + (t1 - t0) * i / (N - 1);
      var layer = makeSubject(D, PW / 2, 0);
      layer.transform.y = yProp;
      var fx = makeFx();
      if (fx) layer.effects = [fx];
      var scene = makeScene(layer);
      var cv = renderFrame(scene, tf);
      var yv = FM.evalProp(yProp, tf);
      var past = (yv + D / 2) - PH;                 // px of the ball past the wall (negative = clear)
      var m = measure(cv);
      tiles.push({
        img: snapshot(cv), lit: m.lit, m: m, wall: 'bottom',
        label: 'f' + (i + 1) + '  t=' + tf.toFixed(3),
        note: (past >= 0 ? '+' + past.toFixed(0) + 'px past' : (-past).toFixed(0) + 'px clear'),
      });
    }
    return buildSheet(sheetTitle('BOUNCE IMPACT  — drop onto the BOTTOM wall, bounce ease n=' + n + ' d=' + d
      + '   (contact t=' + tTouch.toFixed(3) + ', deepest t=' + tPeak.toFixed(3) + ')'), tiles, 4);
  }

  function doSingle() {
    var D = num('size', 300);
    var x = num('x', PW - D / 2 + 0.5 * D), y = num('y', PH / 2);
    var t = tileAt(D, x, y, 'x=' + x.toFixed(0) + ' y=' + y.toFixed(0) + '  size=' + D, null);
    var save = TS; TS = num('ts', 1); var sheet = buildSheet(sheetTitle('SINGLE'), [t], 1); TS = save;
    return sheet;
  }

  /* Determinism: the SAME frame rendered twice must be byte-identical. Math.random in a render
     flickers in playback and does not survive export, so this is a hard gate, not a nicety. */
  function doDet() {
    var D = num('size', 300);
    var x = num('x', PW - D / 2 + 0.5 * D), y = num('y', PH / 2);
    function once() {
      var layer = makeSubject(D, x, y);
      var fx = makeFx(); if (fx) layer.effects = [fx];
      var cv = renderFrame(makeScene(layer), T0);
      return cv.getContext('2d').getImageData(0, 0, PW, PH).data;
    }
    var a = once(), b = once(), diff = 0, i;
    for (i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
    var cv = renderFrame(makeScene((function () {
      var l = makeSubject(D, x, y); var fx = makeFx(); if (fx) l.effects = [fx]; return l;
    })()), T0);
    var m = measure(cv);
    var tiles = [{
      img: snapshot(cv), lit: m.lit, m: m,
      label: diff === 0 ? 'DETERMINISTIC — 0 differing bytes' : 'NON-DETERMINISTIC — ' + diff + ' differing bytes',
      wall: null, note: diff === 0 ? 'two renders identical' : 'RENDER USES RANDOMNESS',
    }];
    DET_DIFF = diff;
    return buildSheet(sheetTitle('DETERMINISM'), tiles, 1);
  }
  var DET_DIFF = null;

  /* Plate scale: rendering into a canvas HALF the project size makes renderScene stamp __fmRS=0.5,
     so plateScale() returns 0.5 — exactly what a reduced-quality preview does. Any effect length
     measured in pixels must be multiplied by ps or the two rows below will not match. */
  function doPs() {
    var D = num('size', 300);
    var spots = [
      { x: PW - D / 2 - 0.25 * D, y: PH / 2, label: 'R inside', wall: 'right' },
      { x: PW - D / 2 + 0.5 * D,  y: PH / 2, label: 'R 50% over', wall: 'right' },
      { x: PW / 2, y: PH - D / 2 + 0.5 * D,  label: 'B 50% over', wall: 'bottom' },
    ];
    var tiles = [], k;
    for (k = 0; k < spots.length; k++) tiles.push(psTile(D, spots[k], 1));
    for (k = 0; k < spots.length; k++) tiles.push(psTile(D, spots[k], 0.5));
    return buildSheet(sheetTitle('PLATE SCALE  — row 1: ps=1 (export)   row 2: ps=0.5 (reduced preview). They must MATCH.'), tiles, 3);
  }
  function psTile(D, spot, ps) {
    var layer = makeSubject(D, spot.x, spot.y);
    var fx = makeFx(); if (fx) layer.effects = [fx];
    var scene = makeScene(layer);
    var cv = renderFrame(scene, T0, Math.round(PW * ps), Math.round(PH * ps));
    var m = measure(cv);   // reported in PROJECT px, so the two rows compare directly
    // upscale the reduced render back to project size so the two rows are directly comparable
    var out = document.createElement('canvas');
    out.width = PW; out.height = PH;
    var og = out.getContext('2d');
    og.imageSmoothingEnabled = false;
    og.drawImage(cv, 0, 0, PW, PH);
    return { img: out, lit: m.lit, m: m, label: 'ps=' + ps + '  ' + spot.label, wall: spot.wall,
             note: 'plate ' + Math.round(PW * ps) + 'x' + Math.round(PH * ps) };
  }

  function sheetTitle(what) { return what; }
  function conditions() {
    return 'fx=' + (FXTYPE || 'none') + '   params=' + JSON.stringify(FXPARAMS)
         + '   shape=' + SHAPE + '   project=' + PW + 'x' + PH
         + (MODE === 'ps' ? '   plate scale VARIES BY ROW' : '   plate scale 1:1 (export conditions)');
  }

  /* ---- go ------------------------------------------------------------------------------- */
  var out = document.getElementById('stats');
  try {
    if (!FM || !FM.renderScene || !FM.makeLayer || !FM.fxRegistry) throw new Error('FM did not load (renderScene/makeLayer/fxRegistry missing)');
    var sheet =
      MODE === 'sweep'  ? doSweep()  :
      MODE === 'bounce' ? doBounce() :
      MODE === 'det'    ? doDet()    :
      MODE === 'ps'     ? doPs()     : doSingle();

    // Blank-capture guard. The sheet is only worth looking at if the SUBJECT actually rendered,
    // so re-read the finished sheet and report both the per-tile counts and a sheet-wide verdict.
    var sg = sheet.getContext('2d');
    var sd = sg.getImageData(0, 0, sheet.width, sheet.height).data;
    var nonBg = 0, i;
    for (i = 0; i < sd.length; i += 4) {
      if (Math.abs(sd[i] - 11) > 6 || Math.abs(sd[i + 1] - 14) > 6 || Math.abs(sd[i + 2] - 20) > 6) nonBg++;
    }
    var known = FM.fxRegistry.get(FXTYPE);
    var blanks = LAST_TILES.filter(function (x) { return !x.lit; }).length;
    var msg = [
      'mode=' + MODE + '  fx=' + FXTYPE + (FXTYPE && FXTYPE !== 'none' ? (known ? ' (registered)' : ' (NOT in registry — running as a bare instance)') : ''),
      'params=' + JSON.stringify(FXPARAMS) + '  shape=' + SHAPE + '  project=' + PW + 'x' + PH,
      'sheet=' + sheet.width + 'x' + sheet.height + '  non-background px=' + nonBg + '  blank tiles=' + blanks + '/' + LAST_TILES.length,
      (DET_DIFF != null ? 'determinism: ' + (DET_DIFF === 0 ? 'IDENTICAL' : DET_DIFF + ' DIFFERING BYTES') : ''),
      '--- per tile (project px) ---',
    ].concat(LAST_TILES.map(function (x) {
      return '  ' + x.label.replace(/\s+/g, ' ') + '  ' + (x.m ? fmtM(x.m) : 'lit ' + x.lit) + (x.note ? '  ' + x.note : '');
    })).concat([
      (nonBg > 5000 && !blanks ? 'READY — sheet has content' : 'BLANK — sheet is empty or a tile rendered nothing; do not judge this capture'),
    ]).filter(Boolean).join('\n');
    var ok = nonBg > 5000 && !blanks;
    out.textContent = msg;
    if (!ok) out.className = 'bad';
    document.body.setAttribute('data-ready', ok ? '1' : '0');
    document.title = (ok ? 'READY' : 'BLANK') + ' — squish ' + MODE;
  } catch (e) {
    out.className = 'bad';
    out.textContent = 'ERROR — ' + (e && e.stack || e);
    document.body.setAttribute('data-ready', '0');
    document.title = 'ERROR — squish';
  }
})();
</script>
</body>
</html>
