<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inspector heading (queue 377)</title></head>
<body style="margin:0;background:#081116;color:#d8e6ee;font:12px/1.5 ui-monospace,monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:12px">measuring…</pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.addEventListener('load',function(){var w=f.contentWindow,d=f.contentDocument;
 waitFM(w).then(async function(FM){
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(450);
  var t=d.querySelector('#inspector-panel .panel-title');
  var r=t?t.getBoundingClientRect():null, cs=t?getComputedStyle(t):null;
  out.textContent='panel-title display '+(cs?cs.display:'(missing)')+'  height '+(r?r.height.toFixed(1):'-')
    +'\nwidth '+(r?r.width.toFixed(1):'-')+'  innerWidth '+w.innerWidth
    +'\nlabel text ['+((d.querySelector('.panel-title-label')||{}).textContent||'')+']';
  document.title='ready';
 }).catch(function(e){out.textContent='ERR '+e.message;});
});
</script></body></html>
