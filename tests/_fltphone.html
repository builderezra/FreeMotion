<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#359 — the Filters tab on the phone</title>
<style>html,body{margin:0;background:#060c0f}iframe{border:0;display:block}</style></head><body>
<iframe id="app" src="index.html"></iframe>
<script>
/* #359, verified in the layout he actually uses. He reported this from a phone screenshot of the
   Filters tab, and the grid probe next door renders tiles into ITS OWN canvases at 150px — which
   proves the subject each filter picked, and proves nothing about what the tab looks like at 380
   with the app's own tile size, its own crop and its own two-column grid. Same lesson as v7.79:
   measure the layout you ship to. */
(function () {
  var q = new URLSearchParams(location.search);
  var W = +q.get('w') || 380, H = +q.get('h') || 820;
  var fr = document.getElementById('app');
  fr.style.width = W + 'px'; fr.style.height = H + 'px';
  fr.addEventListener('load', function () {
    var w = fr.contentWindow, d = w.document, tries = 0;
    (function wait() {
      if (++tries > 300) { window.__done = true; return; }
      if (!w.FM || !w.FM.inspector || !w.FM.home || !w.FM.filters) return setTimeout(wait, 50);
      var FM = w.FM;
      try {
        if (FM.home.isOpen && FM.home.isOpen()) FM.home.close();
        var sp = d.getElementById('splash'); if (sp) sp.remove();
        FM.scene.layers.length = 0;
        var L = FM.makeLayer('shape', { name: 'Layer 1', shape: 'rect', x: 540, y: 960, shapeW: 400, shapeH: 400, fill: '#3a7bd5' });
        L.start = 0; L.duration = 4; FM.scene.layers.push(L);
        FM.selectLayer(L.id); FM.refreshAll();
        // ?cat=<key> opens an ordinary inspector card instead, so one probe serves any panel that
        // needs looking at on the phone rather than a new file per card.
        var cat = q.get('cat');
        if (cat) FM.inspector.openCategory(cat); else FM.inspector.openFxTab('filters');
        if (cat === 'presets') {
          // Two tagged and one loose, so the chip row, the tag sub-lines and "untagged last" are all
          // visible in one shot rather than needing three.
          FM.layerPresets.save('Loose look', FM.scene.layers[0]);
          FM.layerPresets.save('Sunset look', FM.scene.layers[0]);
          FM.layerPresets.save('Neon look', FM.scene.layers[0]);
          FM.presetTags.set('lp:Sunset look', ['Warm', 'Cinematic']);
          FM.presetTags.set('lp:Neon look', ['Night']);
        }
      } catch (e) {}
      // Tiles generate on a queue, one per frame — give the whole grid time to land before the shot.
      // ?to=<section-label> scrolls that section's banner to the top first, so a section far down the
      // list (Tuff is last) can be photographed without a screenshot of the four above it.
      setTimeout(function () {
        var to = q.get('to');
        if (to) {
          var hit = [].slice.call(d.querySelectorAll('.flt-sec, .flt-section, h3, h4, div'))
            .filter(function (n) { return (n.textContent || '').trim().toUpperCase() === to.toUpperCase() && n.children.length === 0; })[0];
          if (hit) hit.scrollIntoView({ block: 'start' });
        }
        setTimeout(function () { window.__done = true; }, 1800);
      }, 3200);
    })();
  });
})();
</script>
</body></html>
