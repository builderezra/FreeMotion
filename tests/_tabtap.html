<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Do the Media/Audio tiles work?</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:390px;top:0;width:900px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.addMenu&&w.FM.mobile)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), o=[], errs=[];
f.addEventListener('load',function(){
 var W=f.contentWindow;
 W.addEventListener('error',function(e){errs.push('ERROR: '+e.message);});
 var oe=W.console.error; W.console.error=function(){errs.push('console.error: '+[].slice.call(arguments).join(' ').slice(0,150)); oe.apply(W.console,arguments);};
 waitFM(W).then(async function(FM){
  var d=f.contentDocument;
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(600);
  async function tab(name){
    var sheet=d.getElementById('add-sheet');
    if(!sheet.classList.contains('open')){ FM.mobile.openAdd(); await sleep(700); sheet=d.getElementById('add-sheet'); }
    var b=[].slice.call(sheet.querySelectorAll('.addmenu-tab')).filter(function(x){return (x.textContent||'').toLowerCase().indexOf(name)>=0;})[0];
    if(b){b.click(); await sleep(600);} return sheet;
  }
  async function tap(sheetName, tileText){
    FM.scene.layers.length=0; FM.refreshAll(); await sleep(150);
    var sheet=await tab(sheetName);
    var tiles=[].slice.call(sheet.querySelectorAll('.addmenu-card'));
    var t=tiles.filter(function(x){return (x.textContent||'').toLowerCase().indexOf(tileText)>=0;})[0];
    if(!t){ o.push('  '+sheetName+' → "'+tileText+'": NO SUCH TILE (has: '+tiles.map(function(x){return (x.textContent||'').trim();}).join(', ')+')'); return; }
    var before=FM.scene.layers.length, e0=errs.length;
    var r=t.getBoundingClientRect();
    t.click(); await sleep(1200);
    o.push('  '+sheetName+' → "'+tileText+'"  tile '+r.width.toFixed(0)+'x'+r.height.toFixed(0)
      +'   layers '+before+'→'+FM.scene.layers.length
      +'   sheet '+(d.getElementById('add-sheet').classList.contains('open')?'still open':'closed')
      +(errs.length>e0?('   ⚠ '+(errs.length-e0)+' error(s)'):''));
  }
  o.push('DOES TAPPING A TILE DO ANYTHING?');
  await tap('media','sample clip');
  await tap('media','import');
  await tap('audio','sound effects');
  await tap('audio','record voice');
  await tap('audio','import audio');
  o.push('');
  o.push(errs.length? ('errors:\n  '+errs.slice(0,6).join('\n  ')) : 'no errors raised.');
  document.getElementById('out').textContent=o.join('\n');
  document.title='ready';
 }).catch(function(e){document.getElementById('out').textContent='ERR '+e.message+'\n'+o.join('\n');document.title='ERR';});
});
</script></body></html>
