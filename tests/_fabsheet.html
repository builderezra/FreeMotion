<!doctype html><html><head><meta charset="utf-8"><title>#194 — the + at three moments of its drift</title>
<style>
  html,body{margin:0;background:#0b1017;color:#8fa3ad;font:11px ui-monospace,monospace}
  .row{display:flex;flex-wrap:wrap;gap:18px;padding:18px;max-width:640px}
  /* MUST be shot at <=700px: every #add-fab rule lives in the phone media query, and above the
     breakpoint the button is display:none — a sheet shot at 800px came back as five empty squares and
     looked like the CSS had broken. */
  .cell{text-align:center}
  .holder{width:120px;height:120px;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%, #141c26, #0b1017);border-radius:16px}
</style></head><body>
<div class="row" id="r"></div>
<script src="../js/settings.js"></script>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../theme-glass.css">
<script>
/* Stills off the SAME animation at different negative delays — the only way to judge a drift from a
   screenshot. Rendered on a dark ground like the timeline's, at the real 64px, not blown up: the whole
   question is whether three hues stay legible at that size.
   THE PHASES ARE CHOSEN FROM THE COMBINED BEAT, not from one pool's period. Both pools alternate, so
   pool A repeats every 26s and pool B every 38s and the pattern only comes round every lcm = 494s;
   their 'to' ends coincide at 247s. The first version of this sheet sampled 0 / 6.5 / 13s — pool A's
   swing alone — so the genuinely worst frame was never rendered and a judge measuring it concluded
   the drift was tamer than it was. */
document.documentElement.setAttribute('data-theme', 'glass');
var r = document.getElementById('r');
[0, -6.5, -13, -95, -247].forEach(function (d) {
  var cell = document.createElement('div'); cell.className = 'cell';
  var h = document.createElement('div'); h.className = 'holder';
  h.innerHTML = '<button id="add-fab" aria-label="Add" style="position:static">' +
    '<span class="fab-aura" aria-hidden="true"><i class="fa-pool-a"></i><i class="fa-pool-b"></i></span>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
  cell.appendChild(h);
  var cap = document.createElement('div');
  cap.textContent = 't = ' + Math.abs(d) + 's' + (d === -247 ? '  (both extremes)' : '');
  cell.appendChild(cap);
  r.appendChild(cell);
  var a = h.querySelector('.fa-pool-a'), b = h.querySelector('.fa-pool-b');
  a.style.animationDelay = d + 's'; b.style.animationDelay = d + 's';
});
setTimeout(function () { window.__done = true; }, 600);
</script></body></html>
