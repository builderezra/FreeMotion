<!doctype html><html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#111">
<pre id="o" style="color:#cfd;font:12px ui-monospace;padding:10px;white-space:pre-wrap">running…</pre>
<iframe id="a" src="../index.html" style="width:1100px;height:820px;border:0"></iframe>
<script>
/* A RUN OF WARPS, COLLAPSED INTO ONE GPU CHAIN — the oldest entry's own named next step.
 * v13.81 put each warp on the GPU individually, and its note said plainly what was still missing:
 * "A CHAIN OF WARPS DOES NOT YET STAY ON THE GPU… worth roughly another 3x on a stacked layer — it
 * is written here as the plan, not as a result."
 * Three questions here, and the first is the one that makes the other two mean anything:
 *   1. did the chain actually RUN, and does the control really turn it off?
 *   2. is it the same picture as the nested path it replaces?
 *   3. how much faster, on a stack, at his own 1080x1350?
 * And a fourth that is about correctness rather than speed: a NON-warp sitting between two warps
 * must STOP the collapse, because merging across it would apply the effects in the wrong order. */
var out=[]; function say(s){ out.push(s); document.getElementById('o').textContent = out.join('\n'); }
document.getElementById('a').addEventListener('load', function () {
  var w = document.getElementById('a').contentWindow, n = 0;
  (function wait(){
    if (!(w.FM && w.FM.scene && w.FM.renderScene && w.FM.fxRegistry)) { if (n++ > 400) return say('FM never came up'); return setTimeout(wait,50); }
    setTimeout(run.bind(null,w), 1200);
  })();
});
async function run(w){
  try{
    var FM = w.FM, d = w.document, P = FM.scene.project;
    if (FM.home && FM.home.isOpen && FM.home.isOpen()) FM.home.close();
    if (!FM.glWarp) return say('❌ FM.glWarp is missing — the module did not load');
    if (!FM.glWarp.runChain) return say('❌ FM.glWarp.runChain is missing');
    say('WebGL available to the app: ' + FM.glWarp.available() + '   ' + (FM.glWarp.stats().reason || ''));

    var W = 1080, H = 1350;
    P.width = W; P.height = H; P.duration = 6;
    FM.scene.layers.length = 0;
    var L = FM.makeLayer('shape', { shape:'rect', x: 540, y: 675, shapeW: 760, shapeH: 940, fill:'#4fd1ff' });
    L.start = 0; L.duration = 6; L.effects = [];
    // THREE warps, all shader-carrying, in stack order = application order.
    var want = ['twirl','ripple','wave'], made = [];
    want.forEach(function(ty){
      var i = FM.fxRegistry.makeInstance(ty);
      if (i) { made.push(ty); L.effects.push(i); }
    });
    if (L.effects.length < 3) return say('❌ only made ' + made.join(',') + ' — this probe needs three warps or it is not testing a chain');
    if (L.effects[0].params) L.effects[0].params.amount = 140;
    var L2 = FM.makeLayer('shape', { shape:'rect', x: 380, y: 420, shapeW: 300, shapeH: 300, fill:'#ff9a4f' });
    L2.start = 0; L2.duration = 6;
    FM.scene.layers.push(L2, L);
    await new Promise(function(r){ setTimeout(r,700); });

    var cv = d.createElement('canvas'); cv.width = W; cv.height = H;
    var cx = cv.getContext('2d', { willReadFrequently: true });
    function shot(){ cx.clearRect(0,0,W,H); FM.renderScene(cx, FM.scene, 0.7); return cx.getImageData(0,0,W,H).data; }
    /* ⚠️ THE FENCE, AND WITHOUT IT EVERY NUMBER BELOW IS A LIE. `renderScene` returns as soon as the
       GPU work is QUEUED — the first run of this probe reported 0.1 ms for three warps at 1080x1350
       and a "chained" figure HALF as fast as unchained, which is what timing an empty queue looks
       like. Reading one pixel back forces the draw to have actually happened. This is the third time
       this exact mistake has been made in this project; the fence is why it is caught now. */
    function timed(){ var t0=performance.now(); cx.clearRect(0,0,W,H); FM.renderScene(cx, FM.scene, 0.7); cx.getImageData(0,0,1,1); return performance.now()-t0; }
    function med(f, n){ var a=[]; for (var i=0;i<n;i++) a.push(f()); a.sort(function(x,y){return x-y;}); return a[a.length>>1]; }

    // ── 1. one warp at a time, on the GPU but NOT chained (what v13.81 shipped) ──
    FM._noGL = false; FM._noGLChain = true;  FM.glWarp._reset(); timed();
    var oneShot = shot(); var oneMs = med(timed, 5); var oneStats = FM.glWarp.stats();
    // ── 2. the whole run collapsed into one chain ──
    FM._noGLChain = false; FM.glWarp._reset(); timed();
    var chShot = shot(); var chMs = med(timed, 5); var chStats = FM.glWarp.stats();
    // ── 3. the CPU loop, for the number that answers his complaint ──
    FM._noGL = true; FM.glWarp._reset(); timed();
    var cpuMs = med(timed, 3); var cpuStats = FM.glWarp.stats();
    FM._noGL = false;

    say('');
    say('THE CONTROL FIRST — WHICH PATH ACTUALLY RAN:');
    say('   _noGLChain = true   → gpu ' + oneStats.gpu + ', chains ' + oneStats.chains + '   ' + (oneStats.chains === 0 && oneStats.gpu > 0 ? '✅ per-effect GPU, no chain' : '🚨 the control does not control'));
    say('   _noGLChain = false  → gpu ' + chStats.gpu + ', chains ' + chStats.chains + ', chained ' + chStats.chained + '   ' + (chStats.chains > 0 ? '✅ the chain really ran' : '🚨 IT DID NOT CHAIN — everything below is measuring the same path twice: ' + chStats.reason));
    say('   _noGL = true        → gpu ' + cpuStats.gpu + ', cpu ' + cpuStats.cpu + '   ' + (cpuStats.gpu === 0 ? '✅ CPU only' : '🚨'));

    say('');
    say('SPEED — a full renderScene at ' + W + 'x' + H + ' with THREE stacked warps (' + made.join(' → ') + '):');
    say('   CPU loop            ' + cpuMs.toFixed(1) + ' ms');
    say('   GPU, one at a time  ' + oneMs.toFixed(1) + ' ms   → ' + (cpuMs/oneMs).toFixed(1) + 'x vs CPU');
    say('   GPU, chained        ' + chMs.toFixed(1) + ' ms   → ' + (cpuMs/chMs).toFixed(1) + 'x vs CPU, ' + (oneMs/chMs).toFixed(2) + 'x vs unchained');

    function compare(a, b, label){
      var diff=0, big=0, lit=0, worst=0;
      for (var q=0;q<a.length;q+=4){
        if (a[q+3]>4) lit++;
        var e = Math.max(Math.abs(a[q]-b[q]), Math.abs(a[q+1]-b[q+1]), Math.abs(a[q+2]-b[q+2]), Math.abs(a[q+3]-b[q+3]));
        if (e>0) diff++; if (e>24) big++; if (e>worst) worst=e;
      }
      var pct = 100*big/(a.length/4);
      say('   ' + label + ': differing ' + diff + ' (' + (100*diff/(a.length/4)).toFixed(2) + '%), >24 ' + big + ' (' + pct.toFixed(3) + '%), worst ' + worst +
          '   ' + (pct < 0.5 ? '✅ same frame' : '🚨 DIFFERENT PICTURE'));
      return pct;
    }
    say('');
    say('SAME PICTURE? (chained vs the nested per-effect path it replaces)');
    compare(oneShot, chShot, 'chain vs unchained');

    /* ── 4. A NON-WARP BETWEEN TWO WARPS MUST BREAK THE RUN ─────────────────────────────────────
       This is the correctness question, not a speed one. The chain collapses a CONTIGUOUS run at the
       outermost end; if it reached across an effect that is not a warp, that effect would end up
       applied in the wrong place in the stack. The picture would still look plausible, which is
       exactly why it needs a measurement rather than an eye. */
    /* ⚠️ IT MUST BE AN EFFECT THAT IS ACTUALLY IN THE POST-EFFECT STACK. The first version of this
       check used `invert`, which is a ctx.filter colour effect and never enters postFxOrder at all —
       so the run really was contiguous, the chain was right, and the probe called it a bug. Pixelate
       is dispatched through applyPostFx like the warps are, so it genuinely sits between them. */
    var mid = FM.fxRegistry.makeInstance('pixelate') || FM.fxRegistry.makeInstance('posterize');
    if (!mid) { say(''); say('ⓘ could not make a pixel effect — the ordering check did not run'); }
    else {
      L.effects.splice(1, 0, mid);           // twirl, invert, ripple, wave  → only the last two may chain
      FM._noGLChain = false; FM.glWarp._reset(); timed();
      var mixShot = shot(); var mixStats = FM.glWarp.stats();
      FM._noGLChain = true; FM.glWarp._reset(); timed();
      var mixRef = shot();
      say('');
      say('ORDERING — a colour effect sitting BETWEEN warps (' + L.effects.map(function(e){return e.type;}).join(' → ') + '):');
      // per CHAIN, not cumulative — `chained` counts every pass across every render this probe did.
      var perChain = mixStats.chains ? mixStats.chained / mixStats.chains : 0;
      say('   chains ' + mixStats.chains + ', ' + perChain.toFixed(1) + ' effects per chain, of ' + L.effects.length + ' on the layer' +
          '   ' + (perChain === 2 ? '✅ the run stopped at the pixel effect (only the outer two warps merged)'
                                  : '🚨 it collapsed ACROSS the pixel effect'));
      compare(mixRef, mixShot, 'with the break');
      L.effects.splice(1, 1);
    }

    /* ── 5. THE FALLBACK STILL WORKS. A path nobody exercises is a path that rots. ── */
    FM._noGLChain = false; FM.glWarp._reset();
    P.width = 160; P.height = 160;
    var sc = d.createElement('canvas'); sc.width = 160; sc.height = 160;
    FM.renderScene(sc.getContext('2d'), FM.scene, 0.7);
    var sm = FM.glWarp.stats();
    say('');
    say('THE FALLBACK, at 160x160 (under the size floor):  gpu ' + sm.gpu + ', cpu ' + sm.cpu + ', chains ' + sm.chains +
        '   ' + (sm.chains === 0 && sm.cpu > 0 ? '✅ small plates still take the CPU loop' : 'ⓘ ' + sm.reason));
    P.width = W; P.height = H;
  } catch(e){ say('threw: ' + (e && (e.stack||e.message||String(e)))); }
  window.__done = true;
}
</script></body></html>
