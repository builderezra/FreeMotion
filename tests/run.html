<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeMotion — test runner</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; background: #0d0f13; color: #e6e9ef; margin: 0; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8a93a6; font-size: 12px; margin-bottom: 14px; }
  #sum { font-size: 15px; font-weight: 700; margin: 10px 0 14px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; margin-right: 8px; }
  .green { background: #10331f; color: #57d98a; } .red { background: #3a1518; color: #ff7a85; }
  .row { padding: 7px 11px; border-radius: 7px; margin: 4px 0; display: flex; gap: 10px; align-items: baseline; }
  .row.ok { background: #11251a; } .row.fail { background: #2a1416; } .row.pend { opacity: .8; }
  .tag { font-weight: 700; flex: 0 0 46px; }
  .ok .tag { color: #57d98a; } .fail .tag { color: #ff7a85; }
  .err { color: #c98; font-size: 12px; }
  .item { color: #6a7488; }
  /* Parked off-screen, NOT display:none. Two tests measure real on-screen geometry (the preview's
     size vs its backing store, and the edit-points overlay's hit area), and a display:none subtree
     gives every element a 0x0 box — so those two could only ever report "no size to compare" and the
     suite sat permanently at 19/21 for a reason that had nothing to do with the app. A real 900x760
     box off the left edge is invisible and measurable. */
  iframe { position: fixed; left: -10000px; top: 0; width: 900px; height: 760px; border: 0; }
  .note { color: #6a7488; font-size: 11.5px; margin-top: 14px; }
</style>
</head>
<body>
  <h1>FreeMotion test suite</h1>
  <div class="sub">Headless render + DOM assertions against a synthetic scene. Loads the real app in a hidden frame, runs <code>tests.js</code>, reports green/red. "pending" = a known backlog gap not built yet.</div>
  <div id="sum">Loading app…</div>
  <div id="list"></div>
  <div class="note">Regression must be all-green to ship. Re-run after any change.</div>
  <!-- queue 936: a fresh start no longer makes a project, and every test here was written against a boot that has one.
       Same origin as the app frame, so this key reaches its storage.migrate() before it runs. A real device never
       carries it; the #936 test boots a fresh origin without it to measure the real fresh start. -->
  <script>try { localStorage.setItem('fm.test.seedProject', '1'); } catch (e) {}</script>
  <iframe id="app" src="../index.html"></iframe>
  <script>
    var frame = document.getElementById('app');
    /* ⚠️ THE APP FRAME MUST NOT RELOAD MID-RUN — AND IF IT DOES, SAY SO BY NAME (30 Sep, found while chasing v17.18's timeouts).
       `load` fires on EVERY load of the frame, so a test that made the app reload (a force-update tap, a stray Enter on the
       wrong control, a real navigation) would re-inject tests.js into the fresh page and START THE WHOLE SUITE AGAIN —
       reaching the same test, reloading again, and looping until the driver's cap, which reports "RAN OUT OF TIME" with a
       different lastTest each time and reads exactly like a loaded Mac. (v17.18's two timeouts turned out NOT to be this —
       the suite had simply outgrown ship.sh's cap — but nothing stopped this from happening, so it is closed anyway.) Now
       the second load ends the run at once, naming the test, its last __fmStep marker and the last real input. */
    var started = false, leaving = null;
    /* …AND THE SAME FOR THE TEST PAGE ITSELF: a navigation of THIS page wipes the flags above with it, and the suite would
       simply begin again. sessionStorage outlives a navigation of this tab (the driver makes a fresh profile per run, so
       nothing leaks between runs); a run that started and never finished, followed by a load of this page that is not a
       person pressing reload, is that navigation — reported by name, and the suite is not started again. Both halves are
       proven by throwaway tests that reload the frame and navigate the top page: each run stops in ~4 s with the name. */
    var RUN_KEY = 'fm.run.started', LEAVE_KEY = 'fm.run.leaving';
    var navType = ''; try { navType = (performance.getEntriesByType('navigation')[0] || {}).type || ''; } catch (e) {}
    var pageRenavigated = false;
    try {
      if (sessionStorage.getItem(RUN_KEY) === '1' && navType !== 'reload') pageRenavigated = true;
      else { sessionStorage.removeItem(RUN_KEY); sessionStorage.removeItem(LEAVE_KEY); }
    } catch (e) {}
    function stopWith(msg) {
      var sum = document.getElementById('sum');
      sum.textContent = '';
      var pill = document.createElement('span'); pill.className = 'pill red'; pill.textContent = 'Error'; sum.appendChild(pill);
      sum.appendChild(document.createTextNode(msg));
    }
    function describeLeaving(g) {
      g = g || {};
      return (g.test ? 'during: ' + g.test : 'no test name recorded') + (g.step ? ' (last step: ' + g.step + ')' : '') +
        (g.input ? ' — last real input: ' + g.input : '') + (g.href ? ' — the app was at ' + g.href : '');
    }
    function say(n) {
      if (!n || !n.tagName) return String(n || '');
      var cls = n.className && n.className.baseVal !== undefined ? n.className.baseVal : n.className;
      return n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') + (cls ? '.' + String(cls).trim().split(/\s+/).join('.') : '');
    }
    frame.addEventListener('load', function () {
      var w = frame.contentWindow;
      if (pageRenavigated) {
        var prev = null; try { prev = JSON.parse(sessionStorage.getItem(LEAVE_KEY) || 'null'); } catch (e) {}
        stopWith('THE TEST PAGE ITSELF WAS NAVIGATED DURING A TEST (a ' + (navType || 'navigation') + ', not a reload) — ' + describeLeaving(prev) + '. The run stops here instead of starting the suite again.');
        return;
      }
      if (started) {
        stopWith('THE APP FRAME RELOADED DURING A TEST — ' + describeLeaving(leaving) + '. The run stops here instead of starting the suite again.');
        return;
      }
      try {
        var lastIn = '';
        ['pointerdown', 'click', 'keydown', 'submit'].forEach(function (k) {
          w.addEventListener(k, function (e) { if (e.isTrusted) lastIn = k + (e.key ? ' ' + e.key : '') + ' on ' + say(e.target); }, true);
        });
        w.addEventListener('pagehide', function () {
          leaving = { test: w.__fmLastTest || '', step: w.__fmStep || '', input: lastIn, href: String(w.location.href) };
          try { sessionStorage.setItem(LEAVE_KEY, JSON.stringify(leaving)); } catch (e) {}
        });
      } catch (e) {}
      // no-store, not a plain fetch: the browser was serving tests.js from cache, so the runner
      // could report green against a version of the suite that no longer exists on disk. A test
      // harness that silently tests stale code is worse than no harness.
      fetch('tests.js', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (src) {
        /* ⚠️ THE APP MUST ACTUALLY BE THERE BEFORE A SINGLE TEST RUNS (21 Sep). The iframe's `load`
           event fires when the document and its subresources are done — but if ONE of the app's ~40
           script tags fails to execute (a dropped request under load is the observed case), FM is
           left half-built and the suite runs anyway. The first test to touch the missing piece then
           reports something like "FM.makeLayer is not a function", which reads as a bug in THAT test
           and is nothing of the kind. It has cost two ship cycles: v16.31 (`Cannot read properties of
           undefined (reading 'refresh')`) and v16.35 (`FM.makeLayer is not a function`), each ~20
           minutes of diagnosis before the answer turned out to be "the app never loaded".
           Same argument as the no-store fetch above: a harness that silently tests something other
           than what it claims is worse than no harness. Naming the failure costs one line. */
        var CORE = ['makeLayer', 'renderScene', 'newScene', 'layerById', 'refreshAll', 'scene'];
        var missing = CORE.filter(function (k) { return !w.FM || w.FM[k] === undefined; });
        if (missing.length) throw new Error('THE APP DID NOT LOAD IN THE TEST FRAME — FM is missing ' +
          missing.join(', ') + '. Every failure below would be misattributed to whichever test touched ' +
          'it first. This is usually a dropped script request under load: re-run, and if it repeats, ' +
          'check for stale headless Chrome processes (see tests/_cdp.py).');
        started = true;
        try { sessionStorage.setItem(RUN_KEY, '1'); } catch (e) {}
        var s = w.document.createElement('script'); s.textContent = src; w.document.body.appendChild(s);
        if (!w.FMTests) throw new Error('FMTests did not load (is FM initialised?)');
        return w.FMTests.run();
      }).then(function (res) {
        try { sessionStorage.removeItem(RUN_KEY); sessionStorage.removeItem(LEAVE_KEY); } catch (e) {}
        /* The FULL pass/fail list, not just the reds. #115 has now cost three attempts partly because
         * a failing run only ever showed its three failures, and the three reds were almost certainly
         * downstream of something earlier that still "passed". Diffing two complete runs finds the
         * FIRST test that behaves differently, which is the actual question. tests/_fmdiff.py reads it. */
        window.__fmResults = res.results.map(function (r) { return { name: r.name, item: r.item || '', ok: !!r.ok, pending: !!r.pending, error: r.error || '' }; });
        document.getElementById('sum').innerHTML =
          '<span class="pill ' + (res.regressionGreen ? 'green' : 'red') + '">Regression ' + res.regressionPass + '/' + res.regressionTotal + (res.regressionGreen ? ' ✓' : ' ✗') + '</span>' +
          '<span class="pill">Pending ' + res.pendingPass + '/' + res.pendingTotal + ' built</span>';
        document.getElementById('list').innerHTML = res.results.map(function (r) {
          var cls = r.ok ? 'ok' : (r.pending ? 'fail pend' : 'fail');
          return '<div class="row ' + cls + '">' +
            '<span class="tag">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
            '<span>' + r.name + (r.pending ? ' <em style="opacity:.6">(pending)</em>' : '') +
            (r.error ? ' <span class="err">— ' + r.error + '</span>' : '') + '</span></div>';
        }).join('');
      }).catch(function (e) {
        try { sessionStorage.removeItem(RUN_KEY); } catch (x) {}
        document.getElementById('sum').innerHTML = '<span class="pill red">Error</span>' + (e && e.message || e);
      });
    });
  </script>
</body>
</html>
