<!doctype html><html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#111">
<pre id="o" style="color:#cfd;font:12px ui-monospace;padding:10px">…</pre>
<iframe id="a" src="../index.html" style="width:380px;height:300px;border:0"></iframe>
<script>
/* #185 / #188 / #189 — the phone bar's right-hand run: refresh chip · notes · cog · Export.
 * Ezra: "the distance between the settings cog and the export button needs to be the same for the
 * notepad and refresh button, it just looks wonky still".
 * The trap is that these four controls do not present the same kind of edge:
 *   · the version chip is a BORDERED PILL — its visible edge is its border box;
 *   · notes and the cog are BARE ICONS — their visible edge is the ink, which sits inside a 42px
 *     tap target with ~10px of padding on each side;
 *   · Export is a FILLED button — its visible edge is its background box.
 * So equal `gap` values produce visibly unequal spacing, which is exactly what he keeps seeing. This
 * measures the VISUAL edges — border box for the chip and Export, real ink for the icons — and reports
 * the three gaps between them. */
document.getElementById('a').addEventListener('load', function () {
  var w = document.getElementById('a').contentWindow, d = w.document, n = 0;
  (function wait() {
    if (!(w.FM && w.FM.scene && w.FM.timeline)) { if (n++ > 300) return; return setTimeout(wait, 50); }
    if (w.FM.home && w.FM.home.isOpen && w.FM.home.isOpen()) w.FM.home.close();
    setTimeout(function () {
      var out = [];
      function inkEdges(id) {
        var b = d.getElementById(id); if (!b) return null;
        var box = b.getBoundingClientRect();
        var svg = b.querySelector('svg');
        if (!svg) return { id: id, left: box.left, right: box.right, kind: 'box', box: box };
        var bb = null; try { bb = svg.getBBox(); } catch (e) {}
        var sr = svg.getBoundingClientRect();
        if (!bb || !bb.width) return { id: id, left: sr.left, right: sr.right, kind: 'svg', box: box };
        // map the 24-unit viewBox onto the rendered svg rect
        var k = sr.width / 24;
        return { id: id, left: sr.left + bb.x * k, right: sr.left + (bb.x + bb.width) * k, kind: 'ink', box: box };
      }
      // The chip and Export are painted surfaces: their border box IS what the eye sees.
      function boxEdges(id) {
        var b = d.getElementById(id); if (!b) return null;
        var r = b.getBoundingClientRect();
        return { id: id, left: r.left, right: r.right, kind: 'painted', box: r };
      }
      var items = [boxEdges('ver-m'), inkEdges('m-notes'), inkEdges('m-settings'), boxEdges('m-export')].filter(Boolean);
      items.forEach(function (it) {
        out.push(it.id.padEnd(12) + it.kind.padEnd(9) +
          'tap ' + Math.round(it.box.left) + '..' + Math.round(it.box.right) +
          '   VISUAL ' + it.left.toFixed(1) + '..' + it.right.toFixed(1) +
          '  (' + (it.right - it.left).toFixed(1) + ' wide)');
      });
      out.push('');
      out.push('gaps between visible edges:');
      var gaps = [];
      for (var i = 1; i < items.length; i++) {
        var g = items[i].left - items[i - 1].right;
        gaps.push(g);
        out.push('   ' + (items[i - 1].id + ' -> ' + items[i].id).padEnd(30) + g.toFixed(1) + 'px');
      }
      /* THE RULE IS NOT "ALL THREE EQUAL". That was the second attempt and he rejected it: "the space
         between the settings cog and notes pad is perfect but you've got them far away from the export
         button and refresh button". A gap bounded by a hard painted edge LOOKS wider than the same gap
         between two soft glyphs, so the two edge-bounded gaps must be smaller to read the same.
         What must hold: the two outer gaps match each other, and the icon-to-icon gap is the larger. */
      var outer = [gaps[0], gaps[2]], inner = gaps[1];
      var outerSpread = Math.abs(outer[0] - outer[1]);
      out.push('');
      out.push('outer gaps (chip→notes, cog→Export): ' + outer.map(function (g) { return g.toFixed(1); }).join(' / ') +
        '   difference ' + outerSpread.toFixed(1) + 'px   ' + (outerSpread <= 1.5 ? 'MATCHED' : 'MISMATCHED'));
      out.push('inner gap  (notes→cog): ' + inner.toFixed(1) + 'px   ' +
        (inner > Math.max.apply(null, outer) + 2 ? 'larger, as it should be' : 'NOT larger — it will read as tighter than the outer two'));
      document.getElementById('o').textContent = out.join('\n');
      window.__done = true;
    }, 700);
  })();
});
</script></body></html>
