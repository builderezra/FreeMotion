<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Update-preset button (queue 407)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.layerPresets&&w.FM.inspector)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(450);
  FM.scene.layers.length=0;
  var a=FM.makeLayer('shape',{name:'Src',shape:'rect',x:540,y:960,shapeW:300,shapeH:300,fill:'#e0653f'});
  var b=FM.makeLayer('shape',{name:'Dst',shape:'rect',x:540,y:1400,shapeW:300,shapeH:300,fill:'#3a7bd5'});
  [a,b].forEach(function(L){L.start=0;L.duration=4;});
  a.transform.rotation=18; a.stroke={enabled:true,width:8,color:'#ffce4a'};
  FM.scene.layers.push(a,b);
  FM.refreshAll(); FM.timeline.rebuild();
  FM.layerPresets.save('Sunset edge', a);
  FM.selectLayer(b.id); await sleep(200);
  FM.layerPresets.apply('Sunset edge', b);
  await sleep(200);
  FM.inspector.openCategory('presets');
  await sleep(500);
  document.title='ready';
 }).catch(function(e){document.title='ERR '+e.message;});
});
</script></body></html>
