<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#0b1117;display:flex;gap:24px;padding:24px;font:12px system-ui;color:#9fb}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .fab{position:relative;width:64px;height:64px;border:none;padding:0;border-radius:0;
       display:flex;align-items:center;justify-content:center;background:transparent}
  .fab-aura{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;
       background:linear-gradient(158deg,#10222f,#0d1626);isolation:isolate}
  .fab-aura > i{position:absolute;display:block;border-radius:50%;
       width:150%;height:150%;left:-25%;top:-25%;mix-blend-mode:screen}
  .fa-pool-a{background:
      radial-gradient(54% 54% at 33% 40%, rgba(41,217,187,.84), rgba(41,217,187,.30) 52%, transparent 78%),
      radial-gradient(44% 44% at 72% 33%, rgba(122,92,255,.95), rgba(122,92,255,.40) 46%, transparent 72%);}
  .fa-pool-b{background:radial-gradient(52% 52% at 46% 70%, rgba(38,132,255,.80), rgba(38,132,255,.26) 52%, transparent 78%);}
  .a-from{transform:translate3d(-5%,3.5%,0) scale(1)}
  .a-to  {transform:translate3d(5.5%,-4%,0) scale(1.07)}
  .b-from{transform:translate3d(4%,-3%,0) scale(1.05) rotate(0deg)}
  .b-to  {transform:translate3d(-4.5%,4%,0) scale(1) rotate(-8deg)}
  svg{position:relative;z-index:1}
</style>
<div class="cell"><button class="fab"><span class="fab-aura"><i class="fa-pool-a a-from"></i><i class="fa-pool-b b-from"></i></span>
<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span>a=from b=from</span></div>
<div class="cell"><button class="fab"><span class="fab-aura"><i class="fa-pool-a a-to"></i><i class="fa-pool-b b-from"></i></span>
<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span>a=to b=from</span></div>
<div class="cell"><button class="fab"><span class="fab-aura"><i class="fa-pool-a a-from"></i><i class="fa-pool-b b-to"></i></span>
<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span>a=from b=to</span></div>
<div class="cell"><button class="fab"><span class="fab-aura"><i class="fa-pool-a a-to"></i><i class="fa-pool-b b-to"></i></span>
<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span>a=to b=to (t=247s)</span></div>
