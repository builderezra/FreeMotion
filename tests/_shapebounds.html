<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#114 — does the music note fit inside its own box?</title>
<style>html,body{margin:0;background:#05070b;color:#cfd6e4;font:12.5px/1.5 ui-monospace,Menlo,monospace}
#out{padding:12px;white-space:pre}</style></head><body><div id="out">…</div>
<script src="js/settings.js"></script><script src="js/scene.js"></script>
<script src="js/eases.js"></script><script src="js/masks.js"></script>
<script src="js/behaviors.js"></script><script src="js/media.js"></script>
<script src="js/blend-modes.js"></script><script src="js/compositor.js"></script>
<script>
/* Ezra (#114): "Music note shape needs a slight fix, the bottom part is falling off." His screenshot
   shows the note's HEAD hanging below and left of the layer's selection box.
   Every data shape is authored in the unit square [0,1]x[0,1] and then scaled into the layer's box, so
   "falling off" means a point outside that square — an arithmetic question with an exact answer, not
   something to eyeball. Print the extents of every shape and name the ones that escape, so the note is
   fixed against a number and any SIBLING with the same fault is found in the same pass. */
(function () {
  var L = [], polys = FM.SHAPE_POLYS || {};
  function bbox(list) {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    (list || []).forEach(function (poly) {
      (poly || []).forEach(function (p) {
        if (!p || p.length < 2) return;
        if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
        if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      });
    });
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  }
  var names = Object.keys(polys).sort();
  var bad = [];
  names.forEach(function (n) {
    var b = bbox(polys[n]);
    if (!isFinite(b.x0)) return;
    var over = Math.max(0, -b.x0, -b.y0, b.x1 - 1, b.y1 - 1);
    if (over > 0.0005) bad.push({ n: n, b: b, over: over });
  });
  L.push('shapes with polygon data: ' + names.length);
  L.push('');
  if (!bad.length) L.push('every shape fits inside its own unit box — nothing escapes.');
  else {
    L.push('SHAPES THAT ESCAPE THE UNIT BOX (worst first):');
    bad.sort(function (a, b) { return b.over - a.over; }).forEach(function (r) {
      L.push('  ' + r.n.padEnd(14) + ' x ' + r.b.x0.toFixed(4) + ' … ' + r.b.x1.toFixed(4) +
             '   y ' + r.b.y0.toFixed(4) + ' … ' + r.b.y1.toFixed(4) +
             '   overshoot ' + (r.over * 100).toFixed(2) + '% of the box');
    });
  }
  L.push('');
  var nb = bbox(polys.note);
  L.push('note, part by part (the head is the piece he says falls off):');
  (polys.note || []).forEach(function (poly, i) {
    var b = bbox([poly]);
    L.push('  part ' + i + '  x ' + b.x0.toFixed(4) + ' … ' + b.x1.toFixed(4) + '   y ' + b.y0.toFixed(4) + ' … ' + b.y1.toFixed(4));
  });
  L.push('  whole   x ' + nb.x0.toFixed(4) + ' … ' + nb.x1.toFixed(4) + '   y ' + nb.y0.toFixed(4) + ' … ' + nb.y1.toFixed(4));
  document.getElementById('out').textContent = L.join('\n');
  window.__done = true;
})();
</script></body></html>
