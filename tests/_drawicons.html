<!doctype html>
<html><head><meta charset="utf-8"><title>#163 — drawing icon candidates, for judging</title>
<style>
  html,body{margin:0;background:#0d1418;color:#dfe8ec;font:12px/1.4 system-ui,sans-serif}
  h2{font:600 13px system-ui;margin:16px 0 6px 14px;color:#9fb4bd;letter-spacing:.04em;text-transform:uppercase}
  .grid{display:flex;flex-wrap:wrap;gap:18px;padding:0 14px 10px}
  .cand{background:#16232a;border:1px solid #243a44;border-radius:12px;padding:10px 12px 8px;text-align:center}
  .sizes{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin-bottom:6px}
  .s{display:flex;flex-direction:column;align-items:center;gap:3px}
  .s span{font-size:9px;color:#7d949e}
  .name{font-size:11px;color:#cfe0e6;font-weight:600}
  svg{display:block;color:#5ce0c8;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div id="out"></div>
<script>
/* Ezra (#163): "Make the logos for the pencil drawing and freehand drawing better, get multiple agents
   with really high standards to not accept it until it's perfect."
   Candidates are rendered at 96 / 48 / 24px against the app's real panel colour and accent, because a
   24px icon judged on a white page at 200px is not being judged at all — 24 is the shape-picker cell,
   and it is where every previous icon change in this app has actually failed. */
const PENCIL = [
  /* ROUND 3. Ezra, on round 2: "in what world is that a pencil, all of those candidates fail, I want it
     to look like a damn pencil." He is right and the mistake was mine.
     Round 1's judge measured — correctly — that every interior counter died at 24px, and I deleted the
     eraser, the ferrule and the tip division on that advice. What remains once all three are gone is a
     wedge, and a wedge is a shard, not a pencil. The pixel reasoning was right about counters and I
     followed it past the point where the object stopped being the object.
     What actually makes a pencil read is the SILHOUETTE, not the detail: a FLAT cut top at one end and a
     SHARPENED POINT at the other. My wedges had neither — both ends were the same. Every candidate
     below has both, and the detail is what varies. */
  ['Q1 silhouette + ferrule', '<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M16.76 3.56 L20.44 7.24 L9.88 17.8 L5.4 18.6 L6.2 14.12 Z M13.33 6.99 L17.01 10.67 L18.59 9.09 L14.91 5.41 Z"/>'],
  ['Q2 pure silhouette', '<path fill="currentColor" stroke="none" d="M16.76 3.56 L20.44 7.24 L9.88 17.8 L5.4 18.6 L6.2 14.12 Z"/>'],
  ['Q3 outlined, bolder', '<path d="M16.4 4.2 L19.8 7.6 L9.6 17.8 L5.6 18.6 L6.4 14.6 Z" stroke-width="2"/><path d="M13.6 7 L17 10.4" stroke-width="2"/>'],
  ['Q4 silhouette + squiggle', '<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M17 2.8 L20.7 6.5 L11 16.2 L6.4 17.1 L7.3 12.5 Z M14 5.8 L17.7 9.5 L19.2 8 L15.5 4.3 Z"/><path d="M2.6 21c2-1.8 4-1.8 6 0s4 1.8 6 0 4-1.8 5.6-.4" stroke-width="2"/>'],
];
const VECTOR = [
  /* ROUND 2, same judgement: handles are impossible at 24px (V3's node and handle fused into an 11px
     slab), outlined nodes all died (1–2px counters), and V2 survived only by discarding everything that
     made it a vector icon. So: a FILLED pen nib with ONE negative feature big enough to see, a curve
     with real inflection, and a filled square anchor so the path does not end in fuzz.
     HORIZONTAL-dominant on purpose — the pencil is diagonal-dominant, and a different primary axis is
     the only separation that survives a glance. */
  ['V5 nib + curve + anchor', '<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M17.4 3.2 L22 8 L17.4 12.8 L12.8 8 Z M16.5 7.4 L18.3 7.4 L17.4 11 Z"/><path d="M2.6 18.6c4.2 0 3-6.4 7.4-8.2" stroke-width="2"/><rect x="1" y="16.8" width="3.8" height="3.8" rx=".6" fill="currentColor" stroke="none"/>'],
  ['V6 flatter curve, big nib', '<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M18 4 L22.4 8.6 L18 13.2 L13.6 8.6 Z M17.1 8 L18.9 8 L18 11.4 Z"/><path d="M2.4 17.6c5.6 0 4.4-4.6 9.2-6" stroke-width="2.2"/><rect x=".9" y="15.8" width="4" height="4" rx=".6" fill="currentColor" stroke="none"/>'],
  ['V7 two anchors, no nib', '<path d="M3.4 17.8c5 0 4-7.4 9-7.4" stroke-width="2.2"/><rect x="1.2" y="16" width="4.2" height="4.2" rx=".6" fill="currentColor" stroke="none"/><rect x="17.6" y="8.4" width="4.6" height="4.6" rx=".7" fill="currentColor" stroke="none"/>'],
  ['V8 nib both-ends curve', '<path fill="currentColor" stroke="none" fill-rule="evenodd" d="M17.6 2.8 L22.2 7.6 L17.6 12.4 L13 7.6 Z M16.7 7 L18.5 7 L17.6 10.6 Z"/><path d="M2.2 19c3.8 0 2.6-5.2 5.6-7.4 1.4-1 2.6-1.4 3.6-1.6" stroke-width="2"/><rect x=".8" y="17.2" width="3.6" height="3.6" rx=".5" fill="currentColor" stroke="none"/>'],
];
function cell(inner, n) {
  return '<div class="s"><svg viewBox="0 0 24 24" width="' + n + '" height="' + n + '">' + inner + '</svg><span>' + n + 'px</span></div>';
}
function block(title, list) {
  let h = '<h2>' + title + '</h2><div class="grid">';
  list.forEach(([name, inner]) => {
    h += '<div class="cand"><div class="sizes">' + [96, 48, 24].map(n => cell(inner, n)).join('') + '</div><div class="name">' + name + '</div></div>';
  });
  return h + '</div>';
}
document.getElementById('out').innerHTML =
  block('Freehand Drawing — pencil candidates', PENCIL) + block('Vector Drawing — candidates', VECTOR);
window.__done = true;
</script></body></html>
