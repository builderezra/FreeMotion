<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Does leaving a project actually free its media? (queue 385)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:390px;top:0;width:980px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
/* `_leavecost.html` measured the BEFORE — leaving released nothing — but it used shape layers, which
   have no media at all, so it could never measure a fix. This one imports a REAL video (canvas →
   captureStream → MediaRecorder, the technique from _vidplay.html), which is the only thing whose
   release is worth anything, and then walks: in the project → home → back in.
   It also checks the two silent hazards: the project card must not re-capture BLANK on the way out,
   and a project file saved from the home screen must still carry its media. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.home&&w.FM.timeline)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), out=document.getElementById('out'), log=[];
function say(s){log.push(s); out.textContent=log.join('\n');}
function makeVideo(seconds){
  return new Promise(function(res,rej){
    var c=document.createElement('canvas'); c.width=320; c.height=240;
    var g=c.getContext('2d'); var n=0;
    var stream=c.captureStream(30);
    var mime=['video/webm;codecs=vp8','video/webm','video/mp4'].filter(function(m){return window.MediaRecorder&&MediaRecorder.isTypeSupported(m);})[0];
    if(!mime) return rej(new Error('no MediaRecorder mime supported headless'));
    var rec=new MediaRecorder(stream,{mimeType:mime}), parts=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)parts.push(e.data);};
    rec.onstop=function(){res(new File(parts,'probe.'+(mime.indexOf('mp4')>=0?'mp4':'webm'),{type:mime.split(';')[0]}));};
    rec.onerror=function(e){rej(new Error('recorder: '+e));};
    (function draw(){
      n++; g.fillStyle='hsl('+(n*7%360)+',70%,45%)'; g.fillRect(0,0,320,240);
      g.fillStyle='#fff'; g.fillRect((n*4)%300,100,20,20);
      if(n<seconds*30) requestAnimationFrame(draw); else rec.stop();
    })();
    rec.start();
  });
}
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(600);

  function snap(tag){
    var vids=[].slice.call(d.querySelectorAll('video'));
    var withSrc=vids.filter(function(v){return v.src||v.currentSrc;}).length;
    var recs=0, files=0;
    FM.scene.layers.forEach(function(l){ var m=FM.media.get(l.id); if(m){recs++; if(m.file)files++;} });
    say(tag+' layers '+FM.scene.layers.length+'  media recs '+recs+'  <video> in DOM '+vids.length
        +'  with src '+withSrc+'  home '+(FM.home.isOpen()?'open':'shut'));
    return {recs:recs, withSrc:withSrc};
  }

  FM.scene.layers.length=0; FM.refreshAll();
  var file;
  try { file=await makeVideo(3); say('made a real video: '+file.type+'  '+(file.size/1024).toFixed(0)+' KB'); }
  catch(e){ say('CANNOT MAKE A VIDEO HEADLESS: '+e.message); document.title='ready'; return; }
  var rec; try { rec=await FM.loadVideoFile(file); } catch(e){ say('loadVideoFile FAILED: '+e.message); document.title='ready'; return; }
  FM.addMediaLayer(rec);
  await sleep(1200);   // addMediaLayer calls storage.save(), which writes the blob to IDB
  var L=FM.scene.layers[FM.scene.layers.length-1];
  if(!L||L.type!=='video'){say('no video layer was added (got '+(L&&L.type)+')');document.title='ready';return;}
  var inProj = snap('1 in the project  :');
  if(!inProj.recs){ say('nothing resident to release — the rest would prove nothing'); document.title='ready'; return; }

  // …and its blob really is in IDB, which is the precondition release checks for itself
  var stored = await FM.storage.readMedia(L.id);
  say('   the blob is in IDB: '+(stored&&stored.file?'yes ('+(stored.file.size/1024).toFixed(0)+' KB)':'NO — release must refuse to free it'));

  FM.home.open();
  await sleep(2600);   // past captureThumbSoon's PUSH_MS+80 timer AND its idle callback
  var left = snap('2 after going home:');
  say(left.recs===0 ? '   ✅ RELEASED — the project costs nothing while you are on the home screen'
                    : '   ❌ still holding '+left.recs+' record(s): leaving frees nothing');

  // THE ORDERING HAZARD: the card's thumbnail is captured late and asynchronously, and it renders the
  // canvas. If the release ran first, every card would silently re-capture BLANK.
  var thumb = await FM.projects.getThumb(FM.projects.currentId());
  var blank = '(no thumb at all)';
  if (thumb) {
    blank = await new Promise(function(res){
      var im=new Image(); im.onload=function(){
        var c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
        var g=c.getContext('2d'); g.drawImage(im,0,0);
        var px=g.getImageData(0,0,c.width,c.height).data, ink=0;
        for(var i=0;i<px.length;i+=4){ if(px[i]>12||px[i+1]>12||px[i+2]>12) ink++; }
        res((100*ink/(px.length/4)).toFixed(1)+'% non-black of '+im.width+'x'+im.height);
      };
      im.onerror=function(){res('(thumb would not decode)');};
      im.src=thumb;
    });
  }
  say('   card thumbnail: '+blank+'   ← must NOT be ~0%, or the release beat the capture');

  // THE keepOpen HAZARD: "Save project file…" re-opens the CURRENT project without a load and
  // serializes FM.media. With the media released and nothing putting it back, it embeds nothing.
  var raw = await FM.storage.serializeScene(FM.scene);
  say('   raw serializeScene while released: '+(raw&&raw.media?Object.keys(raw.media).length:0)+' blob(s)  (0 is expected — nothing has put the media back yet)');
  // …now the REAL route: openProject(id, keepOpen) is what that menu entry calls, and it must hydrate.
  await FM.home._openProject(FM.projects.currentId(), true);
  await sleep(600);
  var ser = await FM.storage.serializeScene(FM.scene);
  var embedded = ser && ser.media ? Object.keys(ser.media).length : 0;
  say('   after openProject(id, keepOpen) it embeds '+embedded+' media blob(s)'
      +(embedded ? '   ✅ a project file saved from home still carries its media' : '   ❌ a project file saved here would have NO MEDIA'));
  say('   home still open after keepOpen: '+(FM.home.isOpen()?'yes (correct)':'no — it closed, which that menu entry does not want'));

  FM.home.close();
  await sleep(2200);
  var back = snap('3 back in project :');
  say(back.recs>=inProj.recs ? '   ✅ HYDRATED — the clip is back without a reload'
                             : '   ❌ came back with '+back.recs+' of '+inProj.recs+' record(s)');
  var m=FM.media.get(L.id);
  say('   the layer can draw again: '+(m&&m.el&&(m.el.src||m.el.currentSrc)?'yes':'NO — element has no src'));
  document.title='ready';
 }).catch(function(e){say('ERR '+e.message);document.title='ERR';});
});
</script></body></html>
