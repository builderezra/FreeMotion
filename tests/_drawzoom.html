<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#165.3 — does the draw overlay survive a zoomed viewport?</title>
<style>html,body{margin:0;background:#05070b;color:#cfd6e4;font:12.5px/1.6 ui-monospace,Menlo,monospace}
iframe{position:fixed;left:-10000px;top:0;width:1280px;height:860px;border:0}
#out{padding:14px;white-space:pre}</style></head><body>
<iframe id="app" src="index.html"></iframe><div id="out">measuring…</div>
<script>
/* #165 point 3. Ezra: "another option that lets you grab the screen and zoom in or out so you can do
 * more detailed drawing."
 *
 * MEASURE BEFORE BUILDING. Reading the code says pan/zoom already exists (FM.viewport in
 * canvas-edit.js) and that js/draw-tool.js REFUSES to run alongside it:
 *
 *     if (FM.viewport && !FM.viewport.isDefault()) FM.viewport.reset();
 *     // overlay lays out in screen px — a zoomed viewport double-scales it
 *
 * So the feature is not "build pan and zoom", it is "make the draw overlay survive one". That comment
 * is a claim, and it is the claim the whole job rests on, so it gets measured rather than inherited —
 * this file has been wrong about its own recorded conclusions enough times to earn the rule (#93's
 * "not bit-exact", #47's "segmented export", #215's library re-add).
 *
 * The test is the only one that matters for a drawing tool: aim at a known screen point, inject the
 * gesture, and ask where the stroke actually landed in PROJECT coordinates. #97 spent four rounds on
 * exactly this class of bug, so the number is the deliverable. */
(function () {
  var out = document.getElementById('out'), fr = document.getElementById('app'), L = [];
  function done() { out.textContent = L.join('\n'); window.__drawzoom = L.join('\n'); window.__done = true; }

  fr.addEventListener('load', function () {
    var w = fr.contentWindow, tries = 0;
    (function wait() {
      if (++tries > 300) { L.push('FM never initialised'); return done(); }
      if (!w.FM || !w.FM.startDraw || !w.FM.drawTool) return setTimeout(wait, 50);
      setTimeout(function () { go(w); }, 800);
    })();
  });

  async function go(w) {
    var FM = w.FM, d = w.document;
    var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    try {
      if (w.innerWidth <= 700) { L.push('this probe is about the DESKTOP drawing surface; the frame is ' + w.innerWidth + 'px'); return done(); }
      FM.scene.layers.length = 0;
      if (FM.refreshAll) FM.refreshAll();
      await sleep(300);

      L.push('WHAT THE CODE CLAIMS');
      L.push('  js/draw-tool.js resets the viewport on entry, commenting:');
      L.push('  "overlay lays out in screen px — a zoomed viewport double-scales it"');
      L.push('');
      L.push('DOES FM.viewport EXIST, AND WHAT CAN IT DO?');
      var vp = FM.viewport;
      L.push('  FM.viewport            ' + (vp ? 'present' : 'MISSING — the whole plan below is wrong'));
      if (vp) {
        L.push('  .scale / .apply()      ' + (typeof vp.scale) + ' / ' + (typeof vp.apply));
        L.push('  .reset() / .isDefault()' + ' ' + (typeof vp.reset) + ' / ' + (typeof vp.isDefault));
      }
      L.push('');

      /* Aim at a fixed point on the CANVAS and see where the tool thinks it is. toProject() is the
         function every stroke sample goes through, so measuring it measures the strokes. */
      var pv = d.getElementById('preview');
      function aimAt(fracX, fracY) {
        var r = pv.getBoundingClientRect();
        return { cx: r.left + r.width * fracX, cy: r.top + r.height * fracY };
      }
      function projectOf(cx, cy) {
        // Mirror of draw-tool's own toProject, read off the live canvas — if this drifts from the tool
        // the drift IS the bug, so it is computed from the same three stamps the tool reads.
        var c = pv, r = c.getBoundingClientRect(), sc = c.__fmRS || 1;
        return [ (c.__fmOX || 0) + ((cx - r.left) / r.width) * (c.width / sc),
                 (c.__fmOY || 0) + ((cy - r.top) / r.height) * (c.height / sc) ];
      }

      FM.startDraw('freehand');
      await sleep(400);
      var P = FM.scene.project;
      L.push('UNZOOMED (the control) — project ' + P.width + 'x' + P.height);
      var a = aimAt(0.5, 0.5), p0 = projectOf(a.cx, a.cy);
      L.push('  aimed at the canvas centre → project ' + p0[0].toFixed(1) + ', ' + p0[1].toFixed(1) +
             '   (want ' + (P.width / 2) + ', ' + (P.height / 2) + ')');
      var err0 = Math.hypot(p0[0] - P.width / 2, p0[1] - P.height / 2);
      L.push('  error                  ' + err0.toFixed(1) + 'px');
      L.push('');

      /* Now zoom the viewport WITHOUT letting startDraw reset it — which is precisely the state the
         feature has to work in, and precisely the state the tool currently refuses to enter. */
      if (vp && typeof vp.apply === 'function') {
        vp.scale = 2;
        vp.apply();
        await sleep(300);
        var b = aimAt(0.5, 0.5), p1 = projectOf(b.cx, b.cy);
        var err1 = Math.hypot(p1[0] - P.width / 2, p1[1] - P.height / 2);
        L.push('ZOOMED TO 2x — the state the feature has to work in');
        L.push('  overlay rect           ' + JSON.stringify((function () { var o = d.getElementById('draw-overlay'); if (!o) return 'no overlay'; var r = o.getBoundingClientRect(); return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; })()));
        L.push('  canvas rect            ' + JSON.stringify((function () { var r = pv.getBoundingClientRect(); return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; })()));
        L.push('  canvas stamps          __fmRS ' + (pv.__fmRS || 1) + '  __fmOX ' + (pv.__fmOX || 0) + '  __fmOY ' + (pv.__fmOY || 0));
        L.push('  aimed at the canvas centre → project ' + p1[0].toFixed(1) + ', ' + p1[1].toFixed(1));
        L.push('  error                  ' + err1.toFixed(1) + 'px   <-- if this is large, the comment is right');
        L.push('');
        /* A BETTER HYPOTHESIS, tested here rather than assumed. syncOverlay() already sizes the overlay
           from the CANVAS's own getBoundingClientRect, so it cannot be computing the wrong number — it
           can only be running at the wrong TIME. A viewport zoom changes the canvas's CSS box without
           firing a window resize, and draw-tool only re-syncs on resize. If that is it, the overlay is
           STALE rather than mis-computed, and the fix is a call, not a rewrite. */
        w.dispatchEvent(new w.Event('resize'));
        await sleep(320);
        var o2 = d.getElementById('draw-overlay');
        var or2 = o2 ? o2.getBoundingClientRect() : null;
        var cr2 = pv.getBoundingClientRect();
        var c2 = aimAt(0.5, 0.5), p2 = projectOf(c2.cx, c2.cy);
        var err2 = Math.hypot(p2[0] - P.width / 2, p2[1] - P.height / 2);
        L.push('AFTER FORCING A RE-SYNC (a window resize, which is the only thing that re-runs syncOverlay)');
        L.push('  overlay rect           ' + (or2 ? JSON.stringify({ x: Math.round(or2.x), y: Math.round(or2.y), w: Math.round(or2.width), h: Math.round(or2.height) }) : 'none'));
        L.push('  canvas rect            ' + JSON.stringify({ x: Math.round(cr2.x), y: Math.round(cr2.y), w: Math.round(cr2.width), h: Math.round(cr2.height) }));
        L.push('  overlay matches canvas ' + (or2 && Math.abs(or2.width - cr2.width) < 2 && Math.abs(or2.height - cr2.height) < 2 ? 'YES' : 'NO'));
        L.push('  error                  ' + err2.toFixed(1) + 'px   <-- if this collapses, the overlay was STALE, not wrong');
        L.push('');
        /* VALIDATE THE PROPOSED FIX WITHOUT WRITING IT. The overlay lives inside #canvas-wrap, which is
           what the viewport transforms, so its CSS box is in the WRAPPER'S LOCAL space while
           getBoundingClientRect() is in SCREEN space — feeding one into the other applies the zoom
           twice. The proposed fix divides the screen delta by the wrapper's applied scale. That scale
           is derived from the wrapper itself (rect width vs offsetWidth) rather than read from
           FM.viewport, so it stays correct whatever applies the transform.
           Computing it here proves the arithmetic before anyone edits the tool — a wrong stroke position
           is the bug #97 spent four rounds on, and it is invisible in a screenshot. */
        /* CHECK MY OWN ASSUMPTION FIRST. The lines above call the gap between "aimed at the canvas
           centre" and "the project centre" an ERROR — but at 2x the canvas shows a CROPPED view, and
           the centre of a crop is not the centre of the project. If the crop is off-centre then that
           gap is the tool being CORRECT and the probe being wrong.
           The honest test: work out what the canvas centre SHOULD map to from the crop stamps alone,
           and compare toProject's answer with that instead of with the project centre. */
        var visW = pv.width / (pv.__fmRS || 1), visH = pv.height / (pv.__fmRS || 1);
        var wantX = (pv.__fmOX || 0) + visW / 2, wantY = (pv.__fmOY || 0) + visH / 2;
        var trueErr = Math.hypot(p1[0] - wantX, p1[1] - wantY);
        L.push('IS THAT 102.8px REALLY AN ERROR? — checked against the CROP, not the project centre');
        L.push('  visible project extent ' + visW.toFixed(1) + ' x ' + visH.toFixed(1) + '  (canvas backing / __fmRS)');
        L.push('  crop origin            ' + (pv.__fmOX || 0).toFixed(1) + ', ' + (pv.__fmOY || 0).toFixed(1));
        L.push('  so the canvas centre SHOULD be project ' + wantX.toFixed(1) + ', ' + wantY.toFixed(1));
        L.push('  toProject actually says               ' + p1[0].toFixed(1) + ', ' + p1[1].toFixed(1));
        L.push('  TRUE mapping error     ' + trueErr.toFixed(1) + 'px');
        L.push('  verdict                ' + (trueErr < 2
          ? 'toProject is CORRECT under zoom — the 102.8 above is my probe comparing against the wrong target'
          : 'toProject really is wrong under zoom by ' + trueErr.toFixed(1) + 'px'));
        L.push('');
        var wrap = d.getElementById('canvas-wrap');
        if (wrap) {
          var wr2 = wrap.getBoundingClientRect();
          var k = (wrap.offsetWidth && wr2.width) ? (wr2.width / wrap.offsetWidth) : 1;
          var wantW = cr2.width / k, wantH = cr2.height / k;
          L.push('THE PROPOSED FIX, CHECKED ON PAPER (nothing edited)');
          L.push('  wrapper applied scale  ' + k.toFixed(3) + '   (rect ' + Math.round(wr2.width) + ' / offset ' + wrap.offsetWidth + ')');
          L.push('  overlay box today      ' + Math.round(or2.width) + ' x ' + Math.round(or2.height) + '  (screen rect fed in as a local box)');
          L.push('  overlay box under fix  ' + Math.round(wantW) + ' x ' + Math.round(wantH) + '  (screen rect / applied scale)');
          L.push('  canvas LOCAL box       ' + pv.offsetWidth + ' x ' + pv.offsetHeight + '   <-- the target');
          var ok = Math.abs(wantW - pv.offsetWidth) < 2 && Math.abs(wantH - pv.offsetHeight) < 2;
          L.push('  fix lands on target    ' + (ok ? 'YES — the arithmetic holds, this is the change to make' : 'NO — the mechanism is still not fully understood, do not write it yet'));
          L.push('');
        }
        L.push('READ IT: an error that stays near zero means the coordinate maths ALREADY survives a zoom,');
        L.push('and the reset on entry is the only thing standing between him and the feature — in which');
        L.push('case point 3 is a toggle plus deleting one line. A large error means the overlay really');
        L.push('does double-scale and the coordinates have to be fixed first, before any UI.');
        vp.scale = 1; vp.apply();
      } else {
        L.push('FM.viewport has no apply() — cannot put the app into the state under test');
      }
      /* THE REAL TEST, now that the reset is gone: enter drawing WITH a zoom already set, commit a
         stroke at known project coordinates, and check the layer landed there. Everything above measures
         maths; this measures ink. */
      try { FM.drawTool._stop(); } catch (e) {}
      await sleep(150);
      if (vp) { vp.scale = 2; vp.apply(); }
      await sleep(250);
      FM.scene.layers.length = 0;
      FM.startDraw('freehand');
      await sleep(350);
      L.push('DRAWING AT 2x — does the zoom survive being picked up, and does the ink land right?');
      L.push('  viewport scale on entry ' + (vp ? vp.scale : 'n/a') + '   (1 would mean the reset is still there)');
      FM.drawTool.points = [[300, 700], [500, 700], [700, 700]];
      FM.drawTool._commit();
      await sleep(250);
      var lay = FM.scene.layers.filter(function (l) { return l.name === 'Freehand'; }).pop();
      if (!lay) L.push('  the stroke did not commit at all');
      else {
        var t = lay.transform || {};
        var cx = FM.evalProp ? FM.evalProp(t.x, 0) : t.x, cy = FM.evalProp ? FM.evalProp(t.y, 0) : t.y;
        L.push('  stroke drawn through project y=700, x 300..700 → layer centre ' + Math.round(cx) + ', ' + Math.round(cy));
        L.push('  wanted centre           500, 700');
        L.push('  ink error               ' + Math.hypot(cx - 500, cy - 700).toFixed(1) + 'px   <-- the number that actually matters');
      }
      /* PANNING (v8.02): a two-finger scroll must move the canvas and the overlay must come with it,
         or you would pan away from your own drawing surface. */
      if (vp) {
        var x0 = vp.x, y0 = vp.y;
        var ov = d.getElementById('draw-overlay');
        var ob = ov ? ov.getBoundingClientRect().top : 0;
        w.dispatchEvent(new w.WheelEvent('wheel', { deltaY: 120, bubbles: true, cancelable: true }));
        await sleep(200);
        var oa = ov ? ov.getBoundingClientRect().top : 0;
        var cb = pv.getBoundingClientRect().top;
        L.push('');
        L.push('TWO-FINGER SCROLL WHILE DRAWING (queue 165.3, the "grab the screen" half)');
        L.push('  viewport moved          ' + (vp.x - x0).toFixed(0) + ', ' + (vp.y - y0).toFixed(0) + '   (0,0 would mean the gesture did nothing)');
        /* This line was originally asserted as if syncOverlay() were what kept the overlay with the
           canvas during a pan. It is not, and the mutation proved it: removing the re-sync changed
           nothing. #draw-overlay is a CHILD of #canvas-wrap, and the viewport transforms the wrapper —
           so a pure translate carries the overlay along for free, with no JavaScript involved at all.
           Kept as a REPORT rather than a claim, because it is still worth seeing, and stated honestly
           so nobody later reads it as evidence for a call that does nothing. */
        L.push('  overlay followed        ' + (Math.abs(oa - cb) < 2 ? 'YES' : 'NO — ' + Math.round(oa - cb) + 'px off') +
               '   (automatic: the overlay is a CHILD of the wrapper the viewport transforms)');
      }
      try { FM.drawTool._stop(); } catch (e) {}
      if (vp) { vp.scale = 1; vp.x = 0; vp.y = 0; vp.apply(); }
    } catch (e) {
      L.push('THREW: ' + (e && e.message || e));
      L.push((e && e.stack || '').split('\n').slice(0, 4).join('\n'));
    }
    done();
  }
})();
</script></body></html>
