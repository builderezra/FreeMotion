<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Does the + hold still while the timeline scrolls?</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:390px;top:0;width:900px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.timeline)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), o=[];
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var W=f.contentWindow, d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  FM.scene.layers.length=0;
  for(var i=0;i<4;i++){
    var L=FM.makeLayer('shape',{name:'Shape '+(i+1),shape:'rect',x:400,y:600+i*200,shapeW:300,shapeH:200,fill:'#3a7bd5'});
    L.start=i*0.8; L.duration=6; FM.scene.layers.push(L);
  }
  FM.scene.project.duration=12; FM.refreshAll(); FM.timeline.rebuild(); await sleep(500);
  var tl=d.getElementById('timeline');
  function plus(){ return d.querySelector('.tl-addrow-plus') || d.querySelector('.tl-addrow .tl-addrow-head'); }
  var p0=plus();
  if(!p0){ o.push('no + button found'); }
  else {
    o.push('scrolling the timeline right in 12 steps, sampling the + each frame');
    o.push('(a PINNED + keeps the same screen x; a wobbling one does not)');
    var xs=[], ys=[];
    for(var s=0;s<12;s++){
      tl.scrollLeft = s*40;
      await new Promise(function(r){W.requestAnimationFrame(function(){W.requestAnimationFrame(r);});});
      var el=plus(); var r=el.getBoundingClientRect();
      xs.push(r.left); ys.push(r.top);
    }
    var mnx=Math.min.apply(null,xs), mxx=Math.max.apply(null,xs);
    var mny=Math.min.apply(null,ys), mxy=Math.max.apply(null,ys);
    o.push('  x: '+xs.map(function(v){return v.toFixed(1);}).join(' '));
    o.push('  y: '+ys.map(function(v){return v.toFixed(1);}).join(' '));
    o.push('');
    o.push('  x drift '+(mxx-mnx).toFixed(2)+'px    y drift '+(mxy-mny).toFixed(2)+'px');
    o.push((mxx-mnx)>1.5 ? '  ❌ the + MOVES while the timeline scrolls' : '  ✅ the + holds still');
  }
  document.getElementById('out').textContent=o.join('\n');
  document.title='ready';
 }).catch(function(e){document.getElementById('out').textContent='ERR '+e.message+'\n'+o.join('\n');document.title='ERR';});
});
</script></body></html>
