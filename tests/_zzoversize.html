<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>oversize toast vs canvas dialog</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:800px;border:0;display:block"></iframe>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.toast)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var sp=f.contentDocument.getElementById('splash'); if(sp) sp.remove();
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(600);
  var sp2=f.contentDocument.getElementById('splash'); if(sp2) sp2.remove();
  var d=f.contentDocument, w=f.contentWindow, out=[];
  var P=FM.scene.project; P.name='probe'; P.width=3024; P.height=4032;
  FM._resetOversizeWarning();
  var fired=FM.warnOversizeProject();
  out.push('warnOversizeProject -> '+fired);
  var t=d.getElementById('toast');
  out.push('toast1 text: '+JSON.stringify(t.textContent));
  out.push('toast1 hidden? '+t.classList.contains('hidden')+'  z='+w.getComputedStyle(t).zIndex);
  // tap it, exactly as a thumb would
  t.click();
  await sleep(60);
  out.push('after tap, toast text: '+JSON.stringify(t.textContent.slice(0,60)+'...'));
  out.push('after tap, toast hidden? '+t.classList.contains('hidden'));
  var r1=t.getBoundingClientRect();
  out.push('toast rect: '+JSON.stringify({x:Math.round(r1.x),y:Math.round(r1.y),w:Math.round(r1.width),h:Math.round(r1.height)}));
  var cx=Math.round(r1.left+r1.width/2), cy=Math.round(r1.top+r1.height/2);
  var before=d.elementFromPoint(cx,cy);
  out.push('elementFromPoint at toast centre BEFORE dialog: <'+(before?before.tagName.toLowerCase()+'#'+before.id+'.'+before.className:'none')+'>');
  await sleep(900);   // the 400ms setTimeout + slack
  var dlg=d.getElementById('canvas-dialog');
  out.push('canvas-dialog hidden? '+dlg.classList.contains('hidden')+'  z='+w.getComputedStyle(dlg).zIndex+'  bg='+w.getComputedStyle(dlg).backgroundColor+'  backdrop='+w.getComputedStyle(dlg).backdropFilter);
  out.push('dialog rect: '+JSON.stringify(dlg.getBoundingClientRect().toJSON?dlg.getBoundingClientRect().toJSON():{}));
  out.push('toast still shown? hidden='+t.classList.contains('hidden')+'  display='+w.getComputedStyle(t).display+'  z='+w.getComputedStyle(t).zIndex);
  out.push('toast text now: '+JSON.stringify(t.textContent.slice(0,80)));
  var after=d.elementFromPoint(cx,cy);
  out.push('elementFromPoint at toast centre AFTER dialog: <'+(after?after.tagName.toLowerCase()+'#'+after.id+'.'+after.className:'none')+'>');
  // sample a few points across the toast
  var pts=[[cx-r1.width/2+6,cy],[cx,r1.top+3],[cx,r1.bottom-3]].map(function(p){var e=d.elementFromPoint(Math.round(p[0]),Math.round(p[1]));return (e?e.tagName.toLowerCase()+'#'+e.id:'none');});
  out.push('samples across the toast: '+pts.join(' | '));
  out.push('body classes: '+d.body.className);
  var box=document.createElement('pre');
  box.id='out';box.style.cssText='position:fixed;left:390px;top:0;width:900px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap';
  box.textContent=out.join('\n');
  document.body.appendChild(box);
  document.title='ready'; window.__done=1;
 }).catch(function(e){var b=document.createElement('pre');b.id='out';b.textContent='ERR '+e.message+'\n'+e.stack;document.body.appendChild(b);window.__done=1;});
});
</script></body></html>
