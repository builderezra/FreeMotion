<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The shape grid's colours (queue 434)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.mobile&&w.FM.mobile.openAdd)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  FM.mobile.openAdd(); await sleep(900);
  var sheet=d.getElementById('add-sheet');
  var tab=[].slice.call(sheet.querySelectorAll('.addmenu-tab')).filter(function(t){return /shape/i.test((t.textContent||'')+(t.getAttribute('aria-label')||''));})[0];
  if(tab){ tab.click(); await sleep(800); }
  document.title='ready';
 }).catch(function(e){document.title='ERR '+e.message;});
});
</script></body></html>
