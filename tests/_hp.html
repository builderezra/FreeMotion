<!doctype html><html><head><meta charset="utf-8"><base href="/"></head><body>
<iframe id="app" src="index.html" style="width:380px;height:820px;border:0"></iframe><pre id="out">…</pre>
<script>
var fr=document.getElementById('app'),out=document.getElementById('out'),L=[];
function say(s){L.push(s);out.textContent=L.join('\n');}
fr.addEventListener('load',function(){var w=fr.contentWindow,d=w.document,t=0;
(function wait(){ if(++t>300){say('no FM');window.__done=true;return;}
 if(!w.FM||!w.FM.timeline||!w.FM.home)return setTimeout(wait,50);
 var FM=w.FM; try{ var sp=d.getElementById('splash'); if(sp)sp.remove(); if(FM.home.isOpen())FM.home.close();
 FM.scene.layers.length=0;
 var Lr=FM.makeLayer('shape',{name:'L',shape:'rect',x:540,y:960,shapeW:300,shapeH:300,fill:'#3a7bd5'});
 Lr.start=0;Lr.duration=4;FM.scene.layers.push(Lr);FM.selectLayer(null);FM.refreshAll();FM.timeline.rebuild();
 }catch(e){say('setup '+e.message);}
 setTimeout(function(){
  try{
   var ht=d.getElementById('tl-headtap'), cl=d.getElementById('tl-centerline');
   var hr=ht?ht.getBoundingClientRect():null, cr=cl?cl.getBoundingClientRect():null;
   say('centerline rect '+JSON.stringify(cr));
   say('headtap    rect '+JSON.stringify(hr));
   var eye=d.querySelector('.track-head .th-eye, .track-head [class*=eye]');
   if(eye){var er=eye.getBoundingClientRect();var cx=er.left+er.width/2, cy=er.top+er.height/2;
     var top=d.elementFromPoint(cx,cy);
     say('eye rect '+JSON.stringify(er));
     say('topmost at eye centre: '+(top?(top.id||top.className||top.tagName):'none'));}
   else say('no eye found');
   var ruler=d.getElementById('tl-ruler')||d.querySelector('.tl-ruler');
   if(ruler){var rr=ruler.getBoundingClientRect();
     var top2=d.elementFromPoint(rr.left+rr.width*0.6, rr.top+rr.height/2);
     say('ruler rect '+JSON.stringify(rr));
     say('topmost mid-ruler: '+(top2?(top2.id||top2.className||top2.tagName):'none'));}
  }catch(e){say('probe '+e.message);}
  window.__done=true;
 },900);})();});
</script></body></html>
