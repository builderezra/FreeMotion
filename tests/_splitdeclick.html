<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>split x de-click (bug hunt)</title></head>
<body style="margin:0;background:#0b1218;color:#cfe;font:12px/1.6 ui-monospace">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:12px;white-space:pre-wrap">measuring…</pre>
<script>
/* LEAD from the 21 Aug fan-out: the 45ms de-click envelope is measured from each clip's OWN edges, so a
   split butts two edges together and preview gets a ~90ms V-shaped duck to silence at the cut that the
   export does not have. The de-click exists to stop a click at a clip boundary — but at a SPLIT there is
   no discontinuity to protect against, because the two halves are the same continuous audio.
   FM._declickGain is exposed for exactly this kind of check, so no media is needed. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM._declickGain&&w.FM.splitLayer&&w.FM.makeLayer)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.onload=function(){waitFM(f.contentWindow).then(run).catch(function(e){out.textContent='ERR '+e.message+'\n'+e.stack;});};
async function run(FM){
  var L=[];
  FM.scene.layers.length=0;
  var A=FM.makeLayer('video',{name:'song'});
  A.start=0; A.duration=10; A.trimStart=0;
  FM.scene.layers.push(A);
  FM.media.set(A.id,{kind:'video',duration:60,width:2,height:2});
  function gainAt(t){
    // whichever half covers t (at the seam, take the QUIETEST — that is what you would hear)
    var g=null;
    FM.scene.layers.forEach(function(l){
      if(t>=l.start-1e-9 && t<=l.start+l.duration+1e-9){
        var v=FM._declickGain(l,t,null,0);
        g=(g===null)?v:Math.max(g,v);
      }
    });
    return g===null?0:g;
  }
  var times=[]; for(var t=4.90;t<=5.101;t+=0.010) times.push(+t.toFixed(3));
  var before=times.map(gainAt);
  L.push('de-click gain around t=5, BEFORE the split (mid-clip, should be a flat 1):');
  L.push('  '+before.map(function(v){return v.toFixed(2);}).join(' '));
  var minBefore=Math.min.apply(null,before);
  if(minBefore<0.99){ out.textContent=L.join('\n')+'\n\nCONTROL FAILED: the gain already dips mid-clip before any split.'; document.title='DONE'; return; }
  FM.time=5;
  await FM.splitLayer(A.id);
  var after=times.map(gainAt);
  L.push('');
  L.push('halves: '+FM.scene.layers.map(function(l){return l.start.toFixed(2)+'..'+(l.start+l.duration).toFixed(2);}).join('  '));
  L.push('de-click gain around t=5, AFTER the split:');
  L.push('  '+after.map(function(v){return v.toFixed(2);}).join(' '));
  var minAfter=Math.min.apply(null,after);
  var dipMs=after.filter(function(v){return v<0.99;}).length*10;
  L.push('');
  L.push(minAfter<0.99
    ? '❌ the cut ducks the sound to '+minAfter.toFixed(2)+' of full, across about '+dipMs+'ms'
    : '✅ no duck at the cut');
  out.textContent=L.join('\n');
  document.title='DONE';
}
</script></body></html>
