<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;background:#000}iframe{border:0;display:block}pre{color:#0f0;font:11px monospace;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<pre id="out">PENDING</pre>
<script>
var q = new URLSearchParams(location.search);
var W = +(q.get('w')||380), H = +(q.get('h')||800), MODE = q.get('mode')||'phone';
var f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function until(fn,ms){var t0=Date.now();while(Date.now()-t0<(ms||15000)){try{if(fn())return true;}catch(e){}await sleep(60);}return false;}
var R = {};
function box(elm){ if(!elm) return null; var r=elm.getBoundingClientRect(); return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),bottom:+r.bottom.toFixed(1)}; }
function say(o){ document.getElementById('out').textContent = JSON.stringify(o,null,1); }

async function openEditor(d, FM){
  var card = d.querySelector('.hm-card');
  if (card){ card.click(); await until(()=>!FM.home.isOpen(), 15000); }
  await sleep(700);
  if (FM.scene.layers.length < 2){
    FM.scene.layers.length = 0;
    FM.scene.layers.push(FM.makeLayer('text',{name:'Title',text:'Your Big Idea',x:FM.scene.project.width/2,y:FM.scene.project.height*0.32,size:96}));
    FM.scene.layers.push(FM.makeLayer('shape',{shape:'circle',name:'Circle',x:FM.scene.project.width*0.34,y:FM.scene.project.height*0.62,shapeW:260,shapeH:260,fill:'#5ac7ed'}));
    FM.refreshAll();
  }
  await sleep(600);
}

f.addEventListener('load', function(){
  var d = f.contentDocument, w = f.contentWindow;
  (async function(){
    var ok = await until(()=> w.FM && w.FM.scene && w.FM.home, 20000);
    if(!ok) return say({error:'FM never init'});
    var st = d.createElement('style');
    st.textContent='*,*::before,*::after{animation:none!important;transition:none!important}#home-screen.hm-preintro > *{opacity:1!important}';
    d.head.appendChild(st);
    await sleep(400);
    var FM = w.FM;
    try {
      await openEditor(d, FM);
      if (MODE === 'studio') d.body.classList.add('layout-studio');
      await sleep(500);
      FM.selectLayer(FM.scene.layers[0].id);
      await sleep(500);

      R.viewport = { innerW: w.innerWidth, innerH: w.innerHeight, dpr: w.devicePixelRatio };
      R.bodyClasses = d.body.className;
      R.safeAreaTopSupported = w.CSS && w.CSS.supports ? w.CSS.supports('padding-top: env(safe-area-inset-top)') : null;

      // --- inspector band (studio question) ---
      var insp = d.getElementById('inspector-panel');
      R.inspectorPanel = box(insp);
      if (insp) {
        var cs = w.getComputedStyle(insp);
        R.inspectorStyle = { position: cs.position, overflowY: cs.overflowY, gridArea: cs.gridArea };
        R.inspectorClient = { w: insp.clientWidth, h: insp.clientHeight, scrollH: insp.scrollHeight };
      }
      R.timelinePanel = box(d.getElementById('timeline-panel'));
      R.topbar = box(d.getElementById('topbar'));
      R.main = box(d.getElementById('main'));

      // --- inspector Presets card (the existing preset UI) ---
      try {
        FM.inspector.openCategory('presets');
        await sleep(500);
        R.presetCard = {
          wrap: box(d.querySelector('.preset-wrap')),
          chip: box(d.querySelector('.preset-chip')),
          chipCount: d.querySelectorAll('.preset-chip').length,
          hint: box(d.querySelector('.insp-hint')),
          hasSaveLayerBtn: !!Array.prototype.find.call(d.querySelectorAll('.fx-act'), b=>/Save this layer/.test(b.textContent||'')),
          actLabels: Array.prototype.map.call(d.querySelectorAll('#inspector-panel .fx-act'), b=>(b.textContent||'').trim())
        };
        // chip height when synthetic (no presets saved) — inject one to measure
        if (!d.querySelector('.preset-chip')) {
          w.localStorage.setItem('fm.layerpresets', JSON.stringify([{name:'You’re dead',data:{effects:[]}},{name:'CC_Advanced Cinematic',data:{effects:[]}}]));
          w.localStorage.setItem('fm.fxpresets', JSON.stringify([{name:'FX_Rainbow Glitch',effects:[]}]));
          FM.inspector.refresh(); await sleep(400);
          R.presetCard.chip = box(d.querySelector('.preset-chip'));
          R.presetCard.chipCount = d.querySelectorAll('.preset-chip').length;
          R.presetCard.injected = true;
          R.presetCard.wrap = box(d.querySelector('.preset-wrap'));
        }
      } catch(e){ R.presetCardErr = String(e && e.message); }

      // --- fx-browser full-screen sheet ---
      FM.fxBrowser.open(FM.scene.layers[0]);
      await sleep(900);
      var root = d.getElementById('fx-browser');
      R.fxBrowser = {
        rootBox: box(root),
        rootStyle: (function(){var c=w.getComputedStyle(root);return {position:c.position,zIndex:c.zIndex,background:c.background.slice(0,60),display:c.display,flexDirection:c.flexDirection};})(),
        top: box(root.querySelector('.fxb-top')),
        topStyle: (function(){var t=root.querySelector('.fxb-top'); if(!t) return null; var c=w.getComputedStyle(t); return {padding:c.padding,paddingTop:c.paddingTop,position:c.position,borderBottom:c.borderBottomWidth};})(),
        closeBtn: box(root.querySelector('.fxb-close')),
        title: box(root.querySelector('.fxb-title')),
        searchBtn: box(root.querySelector('.fxb-search-btn')),
        scroll: box(root.querySelector('.fxb-scroll')),
        tileCount: root.querySelectorAll('.fxb-tile').length
      };

      // --- open the per-effect preset sub-sheet (.fxb-catview) via contextmenu on a tile ---
      var tile = root.querySelector('.fxb-tile') || root.querySelector('.fxb-card');
      if (tile) {
        tile.dispatchEvent(new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true}));
        await sleep(900);
      }
      var cv = root.querySelector('.fxb-catview');
      R.catview = {
        found: !!cv,
        box: box(cv),
        style: cv ? (function(){var c=w.getComputedStyle(cv);return {position:c.position,zIndex:c.zIndex,background:c.background.slice(0,40)};})() : null,
        top: box(cv && cv.querySelector('.fxb-catview-top')),
        back: box(cv && cv.querySelector('.fxb-back')),
        backText: cv && cv.querySelector('.fxb-back') ? cv.querySelector('.fxb-back').textContent : null,
        titleText: cv && cv.querySelector('.fxb-catview-title') ? cv.querySelector('.fxb-catview-title').textContent : null,
        scroll: box(cv && cv.querySelector('.fxb-catview-scroll')),
        rowCount: cv ? cv.querySelectorAll('.fxp-row').length : 0,
        row0: box(cv && cv.querySelector('.fxp-row')),
        row1: box(cv && cv.querySelectorAll('.fxp-row')[1]),
        desc: box(cv && cv.querySelector('.fxb-desc')),
        tags: box(cv && cv.querySelector('.fxb-tags'))
      };

      // --- measure a THUMBLESS pill row (what AM actually shows) by cloning an fxp-row & stripping the thumb ---
      if (cv) {
        var sc = cv.querySelector('.fxb-catview-scroll');
        var probe = d.createElement('div');
        probe.className = 'fxp-list'; probe.id='__probe_list';
        for (var i=0;i<6;i++){
          var r = d.createElement('button'); r.className='fxp-row';
          var t2 = d.createElement('div'); t2.className='fxp-txt';
          var n = d.createElement('div'); n.className='fxp-name'; n.textContent=['You’re dead','Preset 3','CC_Advanced Cinematic','It Might Be Time','FX_Rainbow Glitch','Preset 6'][i];
          t2.appendChild(n); r.appendChild(t2);
          var dots = d.createElement('span'); dots.className='fxp-del'; dots.textContent='⋯'; r.appendChild(dots);
          probe.appendChild(r);
        }
        sc.appendChild(probe);
        await sleep(200);
        R.thumblessRow = { h: box(probe.querySelector('.fxp-row')).h, listGapH: box(probe).h, rows: 6 };
        probe.remove();
      }

      // --- context menu primitive ---
      try {
        FM.contextMenu.show(20, 20, [{label:'Rename…',action:function(){}},{label:'Duplicate',action:function(){}},{sep:true},{label:'Delete',danger:true,action:function(){}}]);
        await sleep(250);
        var m = d.getElementById('ctx-menu');
        R.ctxMenu = { box: box(m), itemH: box(m && m.querySelector('.ctx-item')), items: m ? m.querySelectorAll('.ctx-item').length : 0,
          zIndex: m ? w.getComputedStyle(m).zIndex : null };
        FM.contextMenu.hide();
      } catch(e){ R.ctxErr = String(e && e.message); }

      // --- who else is fixed & what z-index (layering map) ---
      var zs = [];
      Array.prototype.forEach.call(d.querySelectorAll('body *'), function(elm){
        var c = w.getComputedStyle(elm);
        if ((c.position==='fixed') && c.zIndex!=='auto' && +c.zIndex >= 50) {
          zs.push({sel: (elm.id?'#'+elm.id:'.'+String(elm.className).split(' ')[0]), z:+c.zIndex, hidden: elm.classList.contains('hidden'), display:c.display});
        }
      });
      zs.sort((a,b)=>b.z-a.z);
      R.fixedZ = zs.slice(0,30);

      // --- theme-glass audit: which sheet selectors it touches ---
      var glassRules = [];
      Array.prototype.forEach.call(d.styleSheets, function(ss){
        var href = ss.href||'';
        if (!/theme-glass/.test(href)) return;
        try { Array.prototype.forEach.call(ss.cssRules, function(rule){
          if (rule.selectorText) glassRules.push(rule.selectorText);
          else if (rule.cssRules) Array.prototype.forEach.call(rule.cssRules, function(r2){ if(r2.selectorText) glassRules.push('@media '+ (rule.conditionText||'') +' :: '+r2.selectorText); });
        }); } catch(e){ glassRules.push('CORS:'+href); }
      });
      R.glassSelectors = glassRules;
      R.sheetOrder = Array.prototype.map.call(d.styleSheets, ss=> (ss.href||'inline').split('/').pop());

      say(R);
    } catch(e){ R.fatal = String(e && e.stack || e); say(R); }
  })();
});
</script>
</body>
</html>
