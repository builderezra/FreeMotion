<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Export dialog with the M4A option (queue 395)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<script>
/* The export dialog at 380px with the format list open on the audio options, so the new M4A row can be
   looked at next to the WAV one it falls back to. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.showExportDialog)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  FM.scene.layers.length=0;
  var L=FM.makeLayer('shape',{name:'S',shape:'rect',x:540,y:960,shapeW:300,shapeH:300,fill:'#3a7bd5'});
  L.start=0;L.duration=4;FM.scene.layers.push(L);
  FM.scene.project.duration=4; FM.refreshAll(); await sleep(300);
  FM.showExportDialog(); await sleep(500);
  var sel=d.getElementById('exp-format');
  if(sel){ sel.value='audiom4a'; if(FM._syncExportFormat) FM._syncExportFormat(); }
  await sleep(400);
  document.title='ready';
 }).catch(function(e){document.title='ERR '+e.message;});
});
</script></body></html>
