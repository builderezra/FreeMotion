<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Filter favourites and the new categories (queue 444)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.filters&&w.FM.inspector)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  FM.scene.layers.length=0;
  var L=FM.makeLayer('shape',{name:'S',shape:'rect',x:540,y:960,shapeW:400,shapeH:400,fill:'#3a7bd5'});
  L.start=0;L.duration=4;FM.scene.layers.push(L);
  FM.refreshAll(); FM.selectLayer(L.id); await sleep(300);
  // two favourites, so the Favourites row has something in it
  ['nightdrive','noir'].forEach(function(id){ if(!FM.filters.isFave(id)) FM.filters.toggleFave(id); });
  FM.inspector.openCategory('effects'); await sleep(400);
  // switch to the Filters tab
  var tabs=[].slice.call(d.querySelectorAll('.fxmode-btn'));
  var ft=tabs.filter(function(t){return /filter/i.test(t.textContent||'');})[0];
  if(ft){ ft.click(); await sleep(700); }
  document.title='ready';
 }).catch(function(e){document.title='ERR '+e.message;});
});
</script></body></html>
