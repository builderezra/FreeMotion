<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeMotion — Full unchanged probe</title>
<!--
  THE "FULL UNCHANGED" PROBE (queue 980; DESIGN.md §0.4.5, BUILD-PLAN.md §3.2). His rule, 1 Oct: "i dont want the original
  editor changing in design and function". This page does NOT judge anything. It loads the app in a frame exactly as
  tests/run.html does, builds one fixed project THROUGH THE APP, drives Full the way he would (FU1–FU7) and writes what it
  saw: a layout record and a PNG per screen, and a state record after every edit. tools/full-unchanged.sh runs it once on
  HEAD and once on the tree and compares the two, so the verdict is "the same as the release before", never "looks fine".

  Run it only through tools/full-unchanged.sh (it needs tests/_cdp.py's --dump/--shots, its phone emulation and its
  real-input channel). By hand:
    python3 tests/_cdp.py --port <p> --width 380 --height 800 --dump out.json --shots shots/ \
      --url 'http://localhost:<p>/tests/full-unchanged.html?w=380&h=800&phone=1&shots=1'

  What it never does: turn Simple on (except FU6/FU7, which go through the cog when a switch exists), mask anything (the
  ONE mask list, FU_INVISIBLE, lives in tools/full-unchanged.sh), or compare. Ids are canonicalised here (they carry
  performance.now() and Math.random(), so two runs of the same build never share them) — by POSITION, so a layer that moved
  still shows as moved.

  ⚠️ A STEP THAT THROWS ON HEAD IS A BROKEN INSTRUMENT, NOT A PASS. Every step records its error; the tool refuses to say
  PASS when HEAD itself errored anywhere, because a step that fails the same way on both sides compares equal and proves
  nothing (memory: "a negative test needs a positive control").

  ⚠️ A STEP THAT CANNOT FIND FULL'S OWN CONTROL IS A BROKEN INSTRUMENT TOO (review of v1, 1 Oct). Every edit goes through
  the control Full shows him — the Speed card's box, the Group button, the ◆, the menu item, a real finger on the phone —
  because a change to that control's HANDLER is exactly what a call into the function underneath cannot see. When the
  control is not there the step still runs its fallback (so the rest of the script lines up), but it writes `fell` into
  its record, and tools/_fu_compare.py refuses PASS for any run with a `fell` in it.

  v2 (1 Oct, the review's fixes): every computed style that paints (borders, shadows, radii, gradients, filters, outline,
  weight, SVG fill/stroke, cursor, pointer-events, touch-action, transition, animation) and the geometry attributes of every
  SVG shape; a second picture of each screen with the preview hidden, so its overlays are compared pixel for pixel; the
  preview's own backing store and a hash of what it drew, at full quality; the transitions and animations each screen runs;
  a hover per toolbar on the PC pass; real touch on the phone pass (the 350 ms hold, the 300 ms grip arm, the diamond
  hold); FU2's missing edits; a real export through the export sheet; every key the handler answers, with what each one
  opened; the live session's whole wire, presence included; FU5 unmasked except N1.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  /* Parked off-screen: the screenshot is a clip of the frame at (0,0), and nothing of this page may sit over it. */
  #sum, #log { position: fixed; left: -10000px; top: 0; width: 600px; color: #fff; font: 12px system-ui; }
  iframe#app { position: fixed; left: 0; top: 0; border: 0; background: #000; }
</style>
</head>
<body>
<div id="sum">Loading…</div>
<div id="log"></div>
<iframe id="app"></iframe>
<script>
(function () {
  'use strict';
  var PROBE_VERSION = 2;
  var Q = new URLSearchParams(location.search);
  var W = parseInt(Q.get('w'), 10) || 1280, H = parseInt(Q.get('h'), 10) || 800;
  var PHONE = Q.get('phone') === '1', SHOTS = Q.get('shots') === '1';
  /* FU_INVISIBLE's layer keys, handed over by tools/full-unchanged.sh (the list lives THERE, once). Used for ONE thing: the
     FU fixture document that FU5 feeds the sanitiser is built by each side's own app, so it is stripped of these keys
     BEFORE it goes in — the sanitiser then gets the same input on both sides, and its output is compared byte for byte. */
  var INV = (Q.get('inv') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var UPTO = Q.get('upto') || '';   // development only: stop FU2 after the step whose name contains this (the tool never passes it)
  /* FU1 and FU2 first, in this order: the self-test's plants are measured with a PREFIX of it (FU1 for the pictures, FU1+FU2
     for the edits, FU1..FU3 for the keys, FU1..FU5 for the sanitiser), so whatever one group leaves behind, a plant's run
     reaches its group exactly where the full run did. */
  var ALL = ['FU1', 'FU2', 'FU3', 'FU6', 'FU4', 'FU5', 'FU7'];
  var GROUPS = (Q.get('groups') || ALL.join(',')).split(',').filter(function (g) { return ALL.indexOf(g) >= 0; });
  var DUMP = window.__fmDump = { probe: PROBE_VERSION, w: W, h: H, phone: PHONE, groups: GROUPS, step: 'boot', screens: {}, fu2: [], fu3: [], fu4: null, fu5: [], fu6: {}, fu7: null, errors: [], notes: [], fell: [] };
  var frame = document.getElementById('app');
  frame.style.width = W + 'px'; frame.style.height = H + 'px';
  var w, D, FM;   // the app frame's window, document and FM, once loaded
  var APP_VERSION = '';

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function step(s) { DUMP.step = s; try { if (w) w.__fmStep = s; } catch (e) {} }
  function done(ok, msg) {
    var s = document.getElementById('sum');
    // tests/_cdp.py waits for "Regression" or "Error" in #sum and calls it green on "✓". Here green means "the probe ran to
    // the end", NOT "Full is unchanged" — that verdict is tools/full-unchanged.sh's, from the records.
    s.textContent = ok ? 'Regression 1/1 ✓ probe finished' : 'Error: ' + msg;
  }
  async function until(what, fn, ms) {
    var t0 = Date.now();
    for (;;) {
      var v; try { v = fn(); } catch (e) { v = null; }
      if (v) return v;
      if (Date.now() - t0 > (ms || 8000)) throw new Error('timed out waiting for ' + what);
      await sleep(50);
    }
  }
  function raf1() { return new Promise(function (r) { w.requestAnimationFrame(function () { r(); }); }); }
  function raf2() { return new Promise(function (r) { w.requestAnimationFrame(function () { w.requestAnimationFrame(r); }); }); }

  /* ═══ DETERMINISM ═══════════════════════════════════════════════════════════════════════════════════════════════════
     Two runs of the SAME build must produce the same records, or the comparison measures the clock. Each source handled
     once, here:
       · Math.random: replaced in the app frame by a seeded generator before any of its scripts run (the driver's init
         script), and re-seeded per group. The generator's state can be saved and put back (rngState below).
       · A new layer's bar colour: the next of eight from a counter in js/scene.js that EVERY FM.makeLayer advances — and
         the compositor makes one per group on every render (`_flat`), the effect thumbnails more while a sheet is open,
         so which colour a clip got was how many frames this machine drew first. v1 masked every palette colour as
         "@clip-colour", which hid a change to how bar colours are chosen (the review planted "every new layer gets the
         same colour" and it passed). Now the colour is MADE deterministic instead, and compared exactly: those two
         render-time callers are made colour-neutral (each such call is followed by seven more and the random generator
         is put back, so the counter lands where it started, mod 8), and the counter is aligned to the palette's first
         colour at the start of every group. Every other FM.makeLayer runs untouched.
       · CSS animations: their timing is RECORDED first (the transitions and animations each screen started, with their
         durations, delays, easing and keyframes), then finite ones are finished and infinite ones paused at 0 for the
         instant of a measurement — the same frame on both sides.
       · The text caret: made transparent by a probe-only style (caret-color is not in the record; the PNG would see it).
       · A file's lastModified: fixed, so the live session's media manifest carries the same `lm` on both sides. */
  var RNG = { a: 0x980 };
  function seedRandom(seed) {
    RNG.a = seed >>> 0;
    w.Math.random = function () {   // mulberry32
      RNG.a = (RNG.a + 0x6D2B79F5) >>> 0; var t = RNG.a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var PALETTE = null, MAKE_LAYER = null, COLOUR_STEPS = 0;
  async function loadPalette() {
    var src = await (await w.fetch('js/scene.js', { cache: 'no-store' })).text();
    var m = /CLIP_COLORS\s*=\s*\[([^\]]*)\]/.exec(src);
    if (!m) throw new Error('could not read CLIP_COLORS from js/scene.js — the clip-colour rule in the probe needs updating');
    PALETTE = m[1].split(',').map(function (x) { return x.trim().replace(/^['"]|['"]$/g, ''); }).filter(Boolean);
    DUMP.palette = PALETTE;
  }
  function colourNeutralCaller() {
    var st = ''; try { st = String(new Error().stack || ''); } catch (e) {}
    return /\/js\/(compositor|fx-thumbs|fx-browser|audio-fx-browser|elements-browser)\.js/.test(st);
  }
  function installColourGuard() {
    MAKE_LAYER = FM.makeLayer;
    FM.makeLayer = function (type, props) {
      if (type === '_flat' || colourNeutralCaller()) {
        var saved = RNG.a;
        var out = MAKE_LAYER.apply(this, arguments);
        for (var i = 1; i < PALETTE.length; i++) MAKE_LAYER('_flat', {});
        RNG.a = saved;
        return out;
      }
      return MAKE_LAYER.apply(this, arguments);
    };
  }
  /* The next layer made gets PALETTE[0]: one throwaway call reads where the counter is, then it is walked round to 0. */
  function alignColours() {
    var saved = RNG.a;
    var c = MAKE_LAYER('_flat', {}).clipColor, i = PALETTE.indexOf(c);
    if (i < 0) { DUMP.notes.push('the clip colour ' + c + ' is not in the palette — colours are not aligned'); RNG.a = saved; return; }
    var n = (PALETTE.length - ((i + 1) % PALETTE.length)) % PALETTE.length;
    for (var k = 0; k < n; k++) MAKE_LAYER('_flat', {});
    RNG.a = saved;
    COLOUR_STEPS++;
  }
  function finishFinite() {
    D.getAnimations().forEach(function (a) {
      try { var t = a.effect.getComputedTiming(); if (isFinite(t.endTime) && a.playState === 'running') a.finish(); } catch (e) {}
    });
  }
  async function settle(ms) {
    await sleep(ms == null ? 150 : ms);
    for (var i = 0; i < 4; i++) { finishFinite(); await raf2(); }
  }
  /* For the instant of a measurement: every finite animation at its end (one in its delay phase too — a glint that waits
     before it sweeps), every infinite one paused at 0. Twice, a frame apart: finishing one can start the next. */
  function freezeInfinite() {
    var fr = [];
    D.getAnimations().forEach(function (a) {
      try {
        var t = a.effect.getComputedTiming();
        if (isFinite(t.endTime)) { if (a.playState !== 'finished') a.finish(); }
        else if (a.playState !== 'paused' || a.currentTime !== 0) { var was = a.playState; a.pause(); a.currentTime = 0; fr.push({ a: a, was: was }); }
      } catch (e) {}
    });
    return fr;
  }
  /* …and every canvas on screen has stopped drawing: filmstrips, waveforms and thumbnails arrive asynchronously, and a
     picture taken while one is half-painted measures the machine's speed. A small signature of each visible canvas is read
     every ~120 ms until two readings in a row agree (3 s at most; the last state is what is recorded either way). */
  var sigCanvas = null;
  function canvasSig() {
    if (!sigCanvas) { sigCanvas = D.createElement('canvas'); sigCanvas.width = 48; sigCanvas.height = 48; }
    var g = sigCanvas.getContext('2d'), parts = [];
    [].slice.call(D.querySelectorAll('canvas')).forEach(function (c) {
      if (c === sigCanvas || !c.width || !c.height || !c.getClientRects().length) return;
      try { g.clearRect(0, 0, 48, 48); g.drawImage(c, 0, 0, 48, 48); parts.push(cyrb53(new Uint8Array(g.getImageData(0, 0, 48, 48).data.buffer))); }
      catch (e) { parts.push('x'); }
    });
    return parts.join(',');
  }
  async function canvasesQuiet(maxMs) {
    var last = canvasSig(), t0 = Date.now(), stable = 0;
    while (Date.now() - t0 < (maxMs || 3000)) {
      await sleep(120); await raf2();
      var s = canvasSig();
      if (s === last) { if (++stable >= 2) return true; } else { stable = 0; last = s; }
    }
    return false;
  }
  function unfreeze(fr) { fr.forEach(function (f) { try { if (f.was === 'running') f.a.play(); } catch (e) {} }); }

  /* ═══ MOTION: what each screen ANIMATED (review of v1: "durations and easing are invisible") ═══════════════════════
     Every transition and animation the app starts while a screen is being reached is written down when it starts — the
     element, the property or @keyframes name, the computed duration, delay, easing (and iterations), and an animation's
     keyframes — sorted, so the order two rAFs happened to fire in is not a difference. Then they are finished as before. */
  var motionLog = null;
  function motionStart() { motionLog = Object.create(null); }
  function motionTake() { var m = motionLog ? Object.keys(motionLog).sort() : []; motionLog = null; return m; }
  /* …and every animation that never ends and is running on the screen now, whenever it started (a spinner, a glint, a
     pulse started at boot sends no animationstart while the screen is reached): its timing and its keyframes, so a change
     to an infinite animation is seen even though the picture freezes it at its first frame. */
  function infiniteNow() {
    var out = {};
    D.getAnimations().forEach(function (a) {
      try {
        var ef = a.effect, ct = ef.getComputedTiming();
        if (isFinite(ct.endTime) || !ef.target || !ef.target.getClientRects().length) return;
        var kf = JSON.stringify(ef.getKeyframes().map(function (k) { var o = {}; Object.keys(k).sort().forEach(function (x) { if (x !== 'computedOffset') o[x] = k[x]; }); return o; }));
        out[JSON.stringify(['I', pathOf(ef.target) + (ef.pseudoElement || ''), a.animationName || a.transitionProperty || '', ct.duration, ct.delay, ct.easing, String(ct.iterations), kf.slice(0, 1500)])] = 1;
      } catch (e) {}
    });
    return Object.keys(out).sort();
  }
  function noteMotion(e) {
    if (!motionLog) return;
    try {
      var t = e.target; if (!t || t.nodeType !== 1) return;
      var cs = w.getComputedStyle(t, e.pseudoElement || null), row;
      if (e.type === 'transitionrun') {
        row = ['T', pathOf(t) + (e.pseudoElement || ''), e.propertyName, cs.transitionProperty, cs.transitionDuration, cs.transitionDelay, cs.transitionTimingFunction];
      } else {
        var kf = '';
        try {
          var an = t.getAnimations().filter(function (a) { return a.animationName === e.animationName; })[0];
          if (an) kf = JSON.stringify(an.effect.getKeyframes().map(function (k) { var o = {}; Object.keys(k).sort().forEach(function (x) { if (x !== 'computedOffset') o[x] = k[x]; }); return o; }));
        } catch (er) {}
        row = ['A', pathOf(t) + (e.pseudoElement || ''), e.animationName, cs.animationDuration, cs.animationDelay, cs.animationTimingFunction, cs.animationIterationCount, kf.slice(0, 1500)];
      }
      motionLog[JSON.stringify(row)] = 1;
    } catch (er) {}
  }

  /* ═══ THE LAYOUT RECORD (DESIGN §0.4.5 "two comparisons per screen", 1) ═════════════════════════════════════════════
     Every rendered element (a box, not visibility:hidden): its path, rect rounded to 0.5 px, own text (and a form
     control's value), aria-label, title, every computed style that paints or decides what a finger does, and its
     attributes (an SVG shape's geometry — the review redrew the phone bin's lid by one unit and the old record could not
     see it; a button's disabled; aria state). In document order, so a reorder is a difference. The field names travel in
     the record (DUMP.fields), so the comparer can never disagree with the probe about which column is which. */
  var STYLES = ['display', 'visibility', 'opacity', 'color', 'background-color', 'font-size', 'transform',
    'border-color', 'border-style', 'border-width', 'border-radius', 'box-shadow', 'background-image', 'filter', 'backdrop-filter',
    'outline', 'font-weight', 'font-family', 'letter-spacing', 'fill', 'stroke', 'stroke-width', 'cursor', 'pointer-events',
    'touch-action', 'z-index', 'mix-blend-mode', 'transition', 'animation'];
  var ATTRS = ['disabled', 'aria-pressed', 'aria-expanded', 'aria-checked', 'aria-selected', 'aria-hidden', 'role', 'tabindex',
    'placeholder', 'inputmode', 'type', 'href', 'draggable', 'contenteditable', 'src', 'style'];
  var SVG_ATTRS = ['d', 'points', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'width', 'height', 'viewBox',
    'transform', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'offset', 'stop-color', 'href', 'opacity'];
  DUMP.fields = ['path', 'x', 'y', 'w', 'h', 'text', 'aria-label', 'title'].concat(STYLES).concat(['attrs']);
  function half(v) { return Math.round(v * 2) / 2; }
  function nameOf(el) {
    var cls = el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className;
    cls = String(cls || '').trim();
    return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (cls ? '.' + cls.split(/\s+/).sort().join('.') : '');
  }
  function pathOf(el, stop) {
    var parts = [];
    for (var n = el; n && n.nodeType === 1 && n !== stop; n = n.parentElement) {
      parts.unshift(nameOf(n));
      if (n.id) break;           // from the nearest ancestor with an id: short, and stable when an unrelated sibling moves
    }
    return parts.join('>');
  }
  function short(s, n) { s = String(s); return s.length <= (n || 160) ? s : ('#' + cyrb53(new TextEncoder().encode(s)) + ':' + s.length); }
  function ownText(el) {
    var s = '';
    for (var c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 3) s += c.nodeValue;
    s = s.replace(/\s+/g, ' ').trim();
    // the version label moves with EVERY release (index.html's .ver): a release's own number, not Full's design
    if (APP_VERSION && s.indexOf(APP_VERSION) >= 0) s = s.split(APP_VERSION).join('v#');
    var tag = el.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
      s += '«' + (el.type === 'checkbox' || el.type === 'radio' ? (el.checked ? 'on' : 'off') : String(el.value)) + '»';
    }
    /* A canvas's backing store: the same box can hold a coarser picture. The preview's is in its own record (pv), taken
       after its quality ladder has been put back to the top. */
    if (tag === 'CANVAS' && el.id !== 'preview') s += '⧉' + el.width + 'x' + el.height;
    return s.slice(0, 200);
  }
  function attrsOf(el) {
    var out = [], svg = el.namespaceURI === 'http://www.w3.org/2000/svg';
    var list = svg ? SVG_ATTRS : ATTRS;
    for (var i = 0; i < list.length; i++) {
      var k = list[i];
      if (!el.hasAttribute(k)) continue;
      var v = el.getAttribute(k);
      if (k === 'style' && !svg) continue;   // inline styles already reach the computed styles
      out.push(k + '=' + short(v, 200));
    }
    return out.join(' ');
  }
  function styleOf(cs, k) {
    var v = cs.getPropertyValue(k);
    return (k === 'background-image' || k === 'font-family' || k === 'filter' || k === 'backdrop-filter') ? short(v, 200) : v;
  }
  function layoutRecord(root, skip) {
    root = root || D.body;
    var out = [], all = [root].concat([].slice.call(root.querySelectorAll('*')));
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (skip && el.closest && el.closest(skip)) continue;
      if (!el.getClientRects().length) continue;
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) continue;
      var cs = w.getComputedStyle(el);
      if (cs.visibility === 'hidden') continue;
      var rec = [pathOf(el), half(r.left), half(r.top), half(r.width), half(r.height), ownText(el),
        el.getAttribute('aria-label') || '', el.getAttribute('title') || ''];
      for (var k = 0; k < STYLES.length; k++) rec.push(styleOf(cs, STYLES[k]));
      rec.push(attrsOf(el));
      out.push(rec);
    }
    return out;
  }

  /* ═══ PICTURES (DESIGN §0.4.5, 2) — the driver clips the frame; the tolerance is the tool's, measured there ═══════ */
  var shotSeq = 0;
  async function shot(name) {
    if (!SHOTS) return null;
    var seq = ++shotSeq;
    window.__fmShotErr = '';
    window.__fmWantShot = { seq: seq, name: name, x: 0, y: 0, w: W, h: H };
    await until('the driver to take the picture ' + name, function () { return window.__fmShotDone === seq; }, 20000);
    if (window.__fmShotErr) throw new Error('picture ' + name + ': ' + window.__fmShotErr);
    return name;
  }
  /* THE PREVIEW, AT FULL QUALITY, AND WHAT IT DREW (review of v1). v1 left the preview canvas's pixels out of every
     picture because its resolution is adaptive (the play-quality ladder, FM._perfState) — and with them every overlay drawn
     over it (#select-box, its handles, the guides). So now: (1) the ladder is put back to the top and the probe waits for
     the motion window to close (a burst of renders sheds pixels for 700 ms), then asks for a frame; (2) the preview's
     backing store, scale and crop are recorded and compared; (3) a hash of what it drew is compared exactly; (4) a second
     picture is taken with ONLY the preview hidden, so everything drawn over it is compared pixel for pixel. */
  /* The motion window (js/app.js): three renders each within 500 ms of the last is "moving", and the preview sheds pixels
     until 700 ms pass with none. So the probe waits for 900 ms with no render asked for (FM.requestRender is watched, see
     BOOT) and no motion, puts the ladder back to the top, and asks for ONE render — alone, so it cannot start a burst. */
  var LAST_RENDER_ASK = 0;
  /* The preview back at the top of its quality ladder, its motion window closed and one fresh render drawn. Used before a
     measurement of the preview AND before every tap a tool maps through it (FM.eventToProject divides by the backing
     store's own size over its render scale, which moves with the ladder: measured 6 Oct, a mask point tapped at 70% of the
     preview's height landed at y 447.19 on one run of HEAD and 449.32 on the next, because the taps before it had started
     a motion window and the preview was shedding pixels on one run and not the other). */
  async function previewSettled() {
    try {
      await until('the preview to stop shedding pixels', function () {
        var s = FM._perfState ? FM._perfState() : null;
        return performance.now() - LAST_RENDER_ASK > 900 && (!s || !s.inMotion);
      }, 8000);
    } catch (e) { DUMP.notes.push(DUMP.step + ': ' + e.message); }
    if (FM._resetPlayQuality) FM._resetPlayQuality();
    if (FM.requestRender) FM.requestRender();
    await raf2(); await raf2();
  }
  async function previewState() {
    var pv = D.getElementById('preview');
    if (!pv) return { pv: null };
    await previewSettled();
    var st = FM._perfState ? FM._perfState() : {};
    var info = { w: pv.width, h: pv.height, rs: Math.round((pv.__fmRS || 0) * 1e4) / 1e4, ox: Math.round((pv.__fmOX || 0) * 100) / 100,
      oy: Math.round((pv.__fmOY || 0) * 100) / 100, crop: !!pv.__fmCrop, tier: st.tier, factor: st.factor, motion: !!st.inMotion };
    var hash = '';
    try { var g = pv.getContext('2d'); hash = cyrb53(new Uint8Array(g.getImageData(0, 0, pv.width, pv.height).data.buffer)); }
    catch (e) { hash = 'unreadable: ' + (e && e.message); }
    return { pv: info, pvHash: hash };
  }
  async function shotNoPreview(name) {
    var pv = D.getElementById('preview');
    if (!SHOTS || !pv) return;
    var was = pv.style.visibility;
    pv.style.visibility = 'hidden';
    try { await raf2(); await shot(name + '~nopv'); }
    finally { pv.style.visibility = was; }
  }
  async function capture(name, opts) {
    opts = opts || {};
    step('capture ' + name);
    if (!opts.keepToast && FM.hideToast) FM.hideToast();
    await settle(opts.wait);
    var motion = motionTake().concat(infiniteNow());

              for (var k = s0; k < e; k++) { var v = f[k]; sq += v * v; if (Math.abs(v) > pk) pk = Math.abs(v); }
              shape.push(Math.round(Math.sqrt(sq / Math.max(1, e - s0)) * 1000) + '/' + Math.round(pk * 1000));
            }
            ch.push(shape.join(' '));
          }
          ex.audio = { len: buf.length, rate: buf.sampleRate, ch: ch };
        }
      }
    } catch (e) { ex.err = String(e && e.message || e); }
    rec.push({ name: 'export frames and audio', err: ex.err, fell: [], surf: {}, state: { exportFrames: ex.frames, exportAudio: ex.audio } });

  /* ═══ FU4: Full in a live session (DESIGN §0.4.5 FU4; §21 F9). The app is the host, a plain engine guest is the friend,
     on the in-page loopback link. FU2's script runs; EVERYTHING that goes on the wire is recorded per step — every
     message's whole payload, canonicalised, UNMASKED (the tool masks FU_INVISIBLE's keys and nothing else) — including
     the host's presence, which is driven once per step on a fixed clock (v1 sent none, so "presence equal except ed" was
     an empty check), and the media manifest (v1 kept only its type). Then the People menu changes Sam's role, and the
     guest's document is recorded at the end. ═════════════════════════════════════════════════════════════════════════ */
  async function FU4() {
    await freshCopy('FU4');
    var s = startSession(true, true);   // on the probe's clock; with the Labs switch and his profile on, as FU1 leaves them: the Friends block lists Sam with his role button
    var out = DUMP.fu4 = { steps: [], guestDoc: null, err: '', presence: false };
    try {
      var PZ = s.C.presence;

      if (out.presence && PZ._clock) PZ._clock(sessNow);
      var pump = function () { try { s.S.tick('full'); } catch (e) {} try { s.loop.settle(); } catch (e) {} };
      var pres = function () { SESS_CLK.t += 5000; if (!out.presence) return; try { PZ.tick(); } catch (e) {} };
      pres(); pump(); s.sent.length = 0;
      /* EVERYTHING A STEP SENDS, AND ONLY WHAT IT SENDS (measured 6 Oct, HEAD against the same app at 380): the media
         manifest (`mf`) goes out from the media layer's reconcile, which awaits IndexedDB and runs on a wall-clock sweep
         — so after "Replace" it fell inside that step's window on one run and in the next step's on the other. So each
         step ends with one whole reconcile, awaited, and the wire is read only once nothing new has gone out for three
         readings in a row. And within a step, each KIND of message keeps its own order while the kinds are not
         interleaved by arrival (a stable sort by channel and type): the tx stream is compared in order, as DESIGN says;
         whether a manifest left before or after a batch in the same step is the machine's speed. */
      var media = s.C.media;
      var wire = async function () {
        pres(); pump();
        try { if (media && media._reconcile) await media._reconcile(s.S); } catch (e) {}
        var n = -1, same = 0, t0 = Date.now();
        while (same < 3 && Date.now() - t0 < 4000) {
          await sleep(100); pump();
          if (s.sent.length === n) same++; else { same = 0; n = s.sent.length; }
        }
        var msgs = s.sent.splice(0).map(function (m, i) { return { m: m, i: i, k: String(m.ch) + ' ' + String((m.msg || {}).t) }; });
        msgs.sort(function (a, b) { return a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i; });
        return msgs.map(function (x) { return x.m; }).map(function (m) {
          var msg = clone(m.msg || {});
          ['at', 'ts', 'now'].forEach(function (k) { delete msg[k]; });
          /* The host's document checksum (`hash`'s `h`) is a hash OVER the ids, which are random and timed on every run, so
             no canonicalisation can line two runs up (measured 6 Oct: different on HEAD against HEAD). That it is sent, and
             when, stays compared; the document it sums is compared directly — every step, and the guest's at the end. */
          if (msg.t === 'hash' && msg.h != null) msg.h = '@doc-checksum';
          return { ch: m.ch, t: msg.t, msg: canon(msg, FM.scene.layers) };
        });
      };
      var rec = []; rec.noFrames = true;
      await runFU2(fu2Steps(), rec, async function () { return wire(); });
      /* The People menu's role (DESIGN I8, U.setMemberRole): the cog's Friends block, Sam's role button, Viewer. */
      step('FU4 the People menu: Sam becomes a Viewer');
      var role = { name: 'the People menu: Sam becomes a Viewer', err: '', fell: [], surf: {} };
      CUR_FELL = role.fell; CUR_SURF = role.surf;
      try {
        if (s.C.ui && s.C.ui.openPeople) await s.C.ui.openPeople();
        await settle(400);
        var rb = firstVisibleSel(['.cs-role']);
        if (rb) {
          rb.click(); await settle(200);
          var it = byText('.ctx-item', /Viewer/);
          await via('the role menu’s Viewer', it, async function () { s.S.setPeerRole(s.mid, 'viewer'); });
        } else { fellOnly('Sam’s role button was not in the Friends block'); s.S.setPeerRole(s.mid, 'viewer'); }
        await settle(300);

      } catch (e) { role.err = String(e && e.message || e); }
      CUR_FELL = null; CUR_SURF = null;
      role.wire = await wire();
      closeTransient(); await settle(200);
      rec.push({ name: role.name, err: role.err, fell: role.fell, surf: role.surf, state: { toasts: takeToasts() }, extra: role.wire });
      if (role.fell.length) DUMP.fell = DUMP.fell.concat(role.fell.map(function (f) { return role.name + ' — ' + f; }));
      out.steps = rec.map(function (r) { return { name: r.name, err: r.err, fell: r.fell, wire: r.extra, toasts: r.state.toasts }; });
      out.guestDoc = canon(clone({ project: s.gdoc.project, layers: s.gdoc.layers }), s.gdoc.layers);

  }

  /* ═══ BOOT ═══════════════════════════════════════════════════════════════════════════════════════════════════════ */
  async function main() {

       seeded Math.random installed in the app frame before any of the app's own scripts run — so the draws it makes at
       boot (which drop-hint variant Home shows, the first shape hue) are the same on every run of the same build. */
    window.__fmWantSetup = {
      phone: PHONE,
      init: '(function () { if (window === window.top) return; var a = 0x980; Math.random = function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; ' +
            't = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();'
    };

    var missing = CORE.filter(function (k) { return !FM || FM[k] === undefined; });
    if (missing.length) throw new Error('THE APP DID NOT LOAD IN THE PROBE FRAME — FM is missing ' + missing.join(', '));
    w.addEventListener('pagehide', function () { DUMP.errors.push('THE APP FRAME NAVIGATED during: ' + DUMP.step); });
    await until('the splash to go', function () { return !D.getElementById('splash'); }, 15000);
    seedRandom(0x980);
    await loadPalette();
    installColourGuard();
    var rr = FM.requestRender;

    /* A NATIVE DIALOG WOULD FREEZE THE RUN: alert / confirm / prompt block the page, and the driver's every question then
       waits for ever (measured 1 Oct: a run went silent for 25 minutes). Each one Full raises is answered here the way a
       person dismissing it would (OK on an alert, Cancel on a confirm or a prompt) and written into the toasts of the step
       that raised it, so a new or changed dialog is a difference by name. */

    D.addEventListener('transitionrun', noteMotion, true);
    D.addEventListener('animationstart', noteMotion, true);
    var st = D.createElement('style'); st.id = 'fu-probe-caret'; st.textContent = '*, *::before, *::after { caret-color: transparent !important; }';
    D.head.appendChild(st);
    var toast = D.getElementById('toast');
    if (toast) new w.MutationObserver(function () {
      if (!toast.classList.contains('hidden') && toast.textContent) noteToast(toast.textContent.trim());
    }).observe(toast, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    APP_VERSION = String((D.querySelector('.ver') || {}).textContent || '').trim();
    DUMP.app = { version: APP_VERSION, inner: [w.innerWidth, w.innerHeight], hoverNone: w.matchMedia('(hover: none)').matches, phoneMq: w.matchMedia('(max-width: 700px)').matches, touch: w.navigator.maxTouchPoints };
    if (w.innerWidth !== W || w.innerHeight !== H) throw new Error('the app frame is ' + w.innerWidth + '×' + w.innerHeight + ', not ' + W + '×' + H);
    if (PHONE && !DUMP.app.hoverNone) throw new Error('the phone pass is not a phone: (hover: none) does not match inside the app frame');
    await settle(400);
    step('FU1 home');
    if (GROUPS.indexOf('FU1') >= 0) await screen('fu1-home', null, { wait: 600 });
    await buildFixture();
    var plan = { FU1: FU1, FU2: FU2, FU6: FU6, FU3: FU3, FU4: FU4, FU5: FU5, FU7: FU7 };
    for (var i = 0; i < GROUPS.length; i++) {
      try { await plan[GROUPS[i]](); }
      catch (e) { DUMP.errors.push(GROUPS[i] + ' stopped at "' + DUMP.step + '": ' + (e && e.message || e)); closeTransient(); await endSession(); }
    }
    DUMP.colourAligned = COLOUR_STEPS;
    step('done');
  }
  main().then(function () { done(true); }, function (e) {
    DUMP.errors.push('the probe stopped at "' + DUMP.step + '": ' + (e && e.message || e));
    done(false, (e && e.message) || String(e));
  });
})();
</script>
