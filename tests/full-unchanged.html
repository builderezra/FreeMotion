<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeMotion — Full unchanged probe</title>
<!--
  THE "FULL UNCHANGED" PROBE (queue 980; DESIGN.md §0.4.5, BUILD-PLAN.md §3.2). His rule, 1 Oct: "i dont want the original
  editor changing in design and function". This page does NOT judge anything. It loads the app in a frame exactly as
  tests/run.html does, builds one fixed project THROUGH THE APP, drives Full the way he would (FU1–FU7) and writes what it
  saw: a layout record and a PNG per screen, and a state record after every edit. tools/full-unchanged.sh runs it once on
  HEAD and once on the tree and compares the two, so the verdict is "the same as the release before", never "looks fine".

  Run it only through tools/full-unchanged.sh (it needs tests/_cdp.py's --dump/--shots and its phone emulation). By hand:
    python3 tests/_cdp.py --port <p> --width 380 --height 800 --dump out.json --shots shots/ \
      --url 'http://localhost:<p>/tests/full-unchanged.html?w=380&h=800&phone=1&shots=1'

  What it never does: turn Simple on (except FU6/FU7, which go through the cog when a switch exists), mask anything (the
  ONE mask list, FU_INVISIBLE, lives in tools/full-unchanged.sh), or compare. Ids are canonicalised here (they carry
  performance.now() and Math.random(), so two runs of the same build never share them) — by POSITION, so a layer that moved
  still shows as moved.

  ⚠️ A STEP THAT THROWS ON HEAD IS A BROKEN INSTRUMENT, NOT A PASS. Every step records its error; the tool refuses to say
  PASS when HEAD itself errored anywhere, because a step that fails the same way on both sides compares equal and proves
  nothing (memory: "a negative test needs a positive control").
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  /* Parked off-screen: the screenshot is a clip of the frame at (0,0), and nothing of this page may sit over it. */
  #sum, #log { position: fixed; left: -10000px; top: 0; width: 600px; color: #fff; font: 12px system-ui; }
  iframe#app { position: fixed; left: 0; top: 0; border: 0; background: #000; }
</style>
</head>
<body>
<div id="sum">Loading…</div>
<div id="log"></div>
<iframe id="app"></iframe>
<script>
(function () {
  'use strict';
  var PROBE_VERSION = 1;
  var Q = new URLSearchParams(location.search);
  var W = parseInt(Q.get('w'), 10) || 1280, H = parseInt(Q.get('h'), 10) || 800;
  var PHONE = Q.get('phone') === '1', SHOTS = Q.get('shots') === '1';
  /* FU1 and FU2 first, in this order: the self-test's plants are measured with a PREFIX of it (FU1 for the margin, FU1+FU2
     for the toast and the split floor), so whatever one group leaves behind, a plant's run starts FU2 where the full run did. */
  var ALL = ['FU1', 'FU2', 'FU6', 'FU3', 'FU4', 'FU5', 'FU7'];
  var GROUPS = (Q.get('groups') || ALL.join(',')).split(',').filter(function (g) { return ALL.indexOf(g) >= 0; });
  var DUMP = window.__fmDump = { probe: PROBE_VERSION, w: W, h: H, phone: PHONE, groups: GROUPS, step: 'boot', screens: {}, fu2: [], fu3: [], fu4: null, fu5: [], fu6: {}, fu7: null, errors: [], notes: [] };
  var frame = document.getElementById('app');
  frame.style.width = W + 'px'; frame.style.height = H + 'px';
  var w, D, FM;   // the app frame's window, document and FM, once loaded
  var APP_VERSION = '';

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function step(s) { DUMP.step = s; try { if (w) w.__fmStep = s; } catch (e) {} }
  function done(ok, msg) {
    var s = document.getElementById('sum');
    // tests/_cdp.py waits for "Regression" or "Error" in #sum and calls it green on "✓". Here green means "the probe ran to
    // the end", NOT "Full is unchanged" — that verdict is tools/full-unchanged.sh's, from the records.
    s.textContent = ok ? 'Regression 1/1 ✓ probe finished' : 'Error: ' + msg;
  }
  async function until(what, fn, ms) {
    var t0 = Date.now();
    for (;;) {
      var v; try { v = fn(); } catch (e) { v = null; }
      if (v) return v;
      if (Date.now() - t0 > (ms || 8000)) throw new Error('timed out waiting for ' + what);
      await sleep(50);
    }
  }
  function raf2() { return new Promise(function (r) { w.requestAnimationFrame(function () { w.requestAnimationFrame(r); }); }); }

  /* ═══ DETERMINISM ═══════════════════════════════════════════════════════════════════════════════════════════════════
     Two runs of the SAME build must produce the same records, or the comparison measures the clock. Three sources, each
     handled once here and nowhere else:
       · Math.random: replaced in the app frame by a seeded generator the moment the app has loaded (before the fixture).
         Boot-time draws already happened and are not ours to fix (the only one that shows is randomFill's start hue, and
         the fixture holds no shape that asks for one).
       · CSS animations: finite ones are finished, infinite ones (Home's glints and grain, a spinner) are paused at 0 for
         the instant of a measurement and resumed after — the same frame on both sides, and nothing about them is lost.
       · The text caret: made transparent by a probe-only style (caret-color is not in the record; the PNG would see it). */
  function seedRandom(seed) {
    var a = seed >>> 0;
    w.Math.random = function () {   // mulberry32
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function finishFinite() {
    D.getAnimations().forEach(function (a) {
      try { var t = a.effect.getComputedTiming(); if (isFinite(t.endTime) && a.playState === 'running') a.finish(); } catch (e) {}
    });
  }
  async function settle(ms) {
    await sleep(ms == null ? 150 : ms);
    for (var i = 0; i < 4; i++) { finishFinite(); await raf2(); }
  }
  /* For the instant of a measurement: every finite animation at its end (one in its delay phase too — a glint that waits
     before it sweeps), every infinite one paused at 0. Twice, a frame apart: finishing one can start the next. */
  function freezeInfinite() {
    var fr = [];
    D.getAnimations().forEach(function (a) {
      try {
        var t = a.effect.getComputedTiming();
        if (isFinite(t.endTime)) { if (a.playState !== 'finished') a.finish(); }
        else if (a.playState !== 'paused' || a.currentTime !== 0) { var was = a.playState; a.pause(); a.currentTime = 0; fr.push({ a: a, was: was }); }
      } catch (e) {}
    });
    return fr;
  }
  /* …and every canvas on screen has stopped drawing: filmstrips, waveforms and thumbnails arrive asynchronously, and a
     picture taken while one is half-painted measures the machine's speed. A small signature of each visible canvas is read
     every ~120 ms until two readings in a row agree (3 s at most; the last state is what is recorded either way). */
  var sigCanvas = null;
  function canvasSig() {
    if (!sigCanvas) { sigCanvas = D.createElement('canvas'); sigCanvas.width = 48; sigCanvas.height = 48; }
    var g = sigCanvas.getContext('2d'), parts = [];
    [].slice.call(D.querySelectorAll('canvas')).forEach(function (c) {
      if (c === sigCanvas || !c.width || !c.height || !c.getClientRects().length) return;
      try { g.clearRect(0, 0, 48, 48); g.drawImage(c, 0, 0, 48, 48); parts.push(cyrb53(new Uint8Array(g.getImageData(0, 0, 48, 48).data.buffer))); }
      catch (e) { parts.push('x'); }
    });
    return parts.join(',');
  }
  async function canvasesQuiet(maxMs) {
    var last = canvasSig(), t0 = Date.now(), stable = 0;
    while (Date.now() - t0 < (maxMs || 3000)) {
      await sleep(120); await raf2();
      var s = canvasSig();
      if (s === last) { if (++stable >= 2) return true; } else { stable = 0; last = s; }
    }
    return false;
  }
  function unfreeze(fr) { fr.forEach(function (f) { try { if (f.was === 'running') f.a.play(); } catch (e) {} }); }

  /* ═══ THE LAYOUT RECORD (DESIGN §0.4.5 "two comparisons per screen", 1) ═════════════════════════════════════════════
     Every rendered element (a box, not visibility:hidden): its path, rect rounded to 0.5 px, own text (and a form
     control's value), aria-label, title, and seven computed styles. In document order, so a reorder is a difference. */
  var STYLES = ['display', 'visibility', 'opacity', 'color', 'background-color', 'font-size', 'transform'];
  function half(v) { return Math.round(v * 2) / 2; }
  function nameOf(el) {
    var cls = el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className;
    cls = String(cls || '').trim();
    return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (cls ? '.' + cls.split(/\s+/).sort().join('.') : '');
  }
  function pathOf(el, stop) {
    var parts = [];
    for (var n = el; n && n.nodeType === 1 && n !== stop; n = n.parentElement) {
      parts.unshift(nameOf(n));
      if (n.id) break;           // from the nearest ancestor with an id: short, and stable when an unrelated sibling moves
    }
    return parts.join('>');
  }
  function ownText(el) {
    var s = '';
    for (var c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 3) s += c.nodeValue;
    s = s.replace(/\s+/g, ' ').trim();
    // the version label moves with EVERY release (index.html's .ver): a release's own number, not Full's design
    if (APP_VERSION && s.indexOf(APP_VERSION) >= 0) s = s.split(APP_VERSION).join('v#');
    var tag = el.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
      s += '«' + (el.type === 'checkbox' || el.type === 'radio' ? (el.checked ? 'on' : 'off') : String(el.value)) + '»';
    }
    /* A canvas's backing store: the same box can hold a coarser picture. Not the preview's — that one is ADAPTIVE by design
       (a quality tier learned from this machine's render speed, FM._perfState), so it is the machine's number. */
    if (tag === 'CANVAS' && el.id !== 'preview') s += '⧉' + el.width + 'x' + el.height;
    return s.slice(0, 200);
  }
  function layoutRecord(root, skip) {
    root = root || D.body;
    var out = [], all = [root].concat([].slice.call(root.querySelectorAll('*')));
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (skip && el.closest && el.closest(skip)) continue;
      if (!el.getClientRects().length) continue;
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) continue;
      var cs = w.getComputedStyle(el);
      if (cs.visibility === 'hidden') continue;
      var rec = [pathOf(el), half(r.left), half(r.top), half(r.width), half(r.height), ownText(el),
        el.getAttribute('aria-label') || '', el.getAttribute('title') || ''];
      for (var k = 0; k < STYLES.length; k++) rec.push(cs.getPropertyValue(STYLES[k]));
      out.push(rec);
    }
    return out;
  }

  /* ═══ PICTURES (DESIGN §0.4.5, 2) — the driver clips the frame; the tolerance is the tool's, measured there ═══════ */
  var shotSeq = 0;
  async function shot(name) {
    if (!SHOTS) return null;
    var seq = ++shotSeq;
    window.__fmShotErr = '';
    window.__fmWantShot = { seq: seq, name: name, x: 0, y: 0, w: W, h: H };
    await until('the driver to take the picture ' + name, function () { return window.__fmShotDone === seq; }, 20000);
    if (window.__fmShotErr) throw new Error('picture ' + name + ': ' + window.__fmShotErr);
    return name;
  }
  async function capture(name, opts) {
    opts = opts || {};
    step('capture ' + name);
    if (!opts.keepToast && FM.hideToast) FM.hideToast();
    await settle(opts.wait);
    /* The preview is drawn on request; one drawn while the stage was still settling (a sheet rising on the phone) keeps
       that frame's fit until something asks again, so ask once more now that the layout has landed. */
    /* …at full detail: the preview sheds pixels while things move and learns a quality tier from how fast THIS machine
       renders (js/app.js FM._perfState). That is the machine's number, not Full's, so it is put back to its start —
       the same thing opening a project does (FM.projects.open calls it) — before the frame that is measured. */
    if (FM._resetPlayQuality) FM._resetPlayQuality();
    if (FM.requestRender) FM.requestRender();
    var quiet = await canvasesQuiet();
    var fr = freezeInfinite();
    try {
      await raf2();
      fr = fr.concat(freezeInfinite());
      await raf2();
      var rec = layoutRecord(opts.root ? D.querySelector(opts.root) : D.body, opts.skip);
      var pv = D.getElementById('preview');
      DUMP.screens[name] = { layout: rec, focus: D.activeElement ? pathOf(D.activeElement) : '', canvasesQuiet: quiet,
        pv: pv ? { rs: pv.__fmRS, ox: pv.__fmOX, oy: pv.__fmOY, crop: !!pv.__fmCrop, w: pv.width, h: pv.height, perf: FM._perfState ? FM._perfState().tier : null } : null };   // diagnosis only: not compared
      if (!opts.noShot) await shot(name);
    } finally { unfreeze(fr); }
  }

  /* ═══ THE STATE RECORD (FU2–FU5, FU7): what an edit did, read from the app ════════════════════════════════════════ */
  function docRaw() {
    return JSON.parse(JSON.stringify({ project: FM.scene.project, layers: FM.scene.layers }, FM.jsonReplacer));
  }
  /* Ids carry performance.now() and Math.random() — no two runs share one. Each is replaced by its POSITION: layer ids by
     their index in the stack (so a moved layer still reads as moved), every other id / uid by first appearance. Strings
     that CONTAIN an id (an op path) are rewritten too. Nothing else is touched. */
  function canon(obj, layers) {
    var map = Object.create(null), n = 0;
    (layers || []).forEach(function (l, i) { if (l && typeof l.id === 'string' && !map[l.id]) map[l.id] = '@L' + i; });
    (function walk(v, depth) {
      if (!v || typeof v !== 'object' || depth > 40) return;
      if (Array.isArray(v)) { v.forEach(function (x) { walk(x, depth + 1); }); return; }
      Object.keys(v).forEach(function (k) {
        if ((k === 'id' || k === 'uid' || k === 'mid') && typeof v[k] === 'string' && v[k].length >= 4 && !map[v[k]]) map[v[k]] = '@' + k + (n++);
        walk(v[k], depth + 1);
      });
    })(obj, 0);
    var ids = Object.keys(map).sort(function (a, b) { return b.length - a.length; });
    var re = ids.length ? new RegExp(ids.map(function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g') : null;
    function sub(s) { return re ? s.replace(re, function (m) { return map[m]; }) : s; }
    return (function copy(v, depth, key, owner) {
      if (key === 'clipColor' && typeof v === 'string' && PALETTE_SET && PALETTE_SET[v.toLowerCase()] && !(owner && owner.clipColorSet)) return '@clip-colour';
      if (typeof v === 'string') return sub(v);
      if (typeof v === 'number') return Math.round(v * 1e6) / 1e6;   // float noise below a micro-unit is the engine's, not Full's
      if (!v || typeof v !== 'object' || depth > 40) return v;
      if (Array.isArray(v)) return v.map(function (x) { return copy(x, depth + 1); });
      var o = {};
      Object.keys(v).forEach(function (k) { o[sub(k)] = copy(v[k], depth + 1, k, v); });
      return o;
    })(obj, 0);
  }
  function canonDoc() { var d = docRaw(); return canon(d, d.layers); }
  /* Every toast text, in order. A PROGRESS toast ("Preparing frames… 14%") is relabelled many times a second and how many
     of its numbers a MutationObserver happens to see is the machine's speed, not Full's behaviour — so a percentage is
     written as "#%" and repeats collapse. The words are kept exactly: a changed word is a changed toast. */
  var toastLog = [];
  function noteToast(t) {
    t = t.replace(/\d+(\.\d+)?\s*%/g, '#%');
    if (toastLog[toastLog.length - 1] !== t) toastLog.push(t);
  }
  function takeToasts() { var t = toastLog; toastLog = []; return t; }
  function histInfo() {
    var s = FM.history && FM.history._steps ? FM.history._steps() : null;
    return { canUndo: !!(FM.history && FM.history.canUndo()), canRedo: !!(FM.history && FM.history.canRedo()), len: s ? s.len : null, index: s ? s.index : null };
  }
  function selInfo() {
    var idx = function (id) { return FM.scene.layers.findIndex(function (l) { return l.id === id; }); };
    return { primary: idx(FM.scene.selectedId), all: (FM.selectionIds ? FM.selectionIds() : []).map(idx) };
  }
  function cyrb53(data) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < data.length; i++) { var ch = data[i]; h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  async function mediaSettled() {
    var vids = [].slice.call(D.querySelectorAll('video')).concat(FM.media && FM.media.all ? [] : []);
    try {
      if (FM.media && typeof FM.media.get === 'function') {
        FM.scene.layers.forEach(function (l) { var m = FM.media.get(l.id); if (m && m.el && m.el.tagName === 'VIDEO' && vids.indexOf(m.el) < 0) vids.push(m.el); });
      }
    } catch (e) {}
    var t0 = Date.now();
    while (Date.now() - t0 < 2500) {
      if (vids.every(function (v) { return !v.seeking && (v.readyState >= 2 || !v.src); })) break;
      await sleep(40);
    }
    await raf2();
  }
  /* A rendered frame at three times, through the compositor itself (preview and export draw through FM.renderScene). */
  var FRAME_TIMES = [0.5, 2.25, 4.0];
  async function frameHashes(times) {
    var P = FM.scene.project, t0 = FM.time, out = [];
    // at the project's own size, the way the suite and the exporter call it (renderScene scales by ctx.canvas itself)
    var c = D.createElement('canvas'); c.width = P.width; c.height = P.height;
    var g = c.getContext('2d');
    try {
      for (var i = 0; i < (times || FRAME_TIMES).length; i++) {
        var t = (times || FRAME_TIMES)[i];
        FM.setTime(t);
        /* EXACTLY there, the way the export seeks (FM.seekVideosToTime {exact}): the preview's own seek skips any move under
           half a frame (queue 125), so where a video sat before decides which frame it shows — history, not Full. And not
           while a frame-cache build owns the element (FM.seekBusy): it ignores seeks until it is done. */
        await mediaIdle();
        if (FM.seekVideosToTime) FM.seekVideosToTime({ exact: true });
        await mediaSettled();
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
        try { FM.renderScene(g, FM.scene, t); } catch (e) { out.push('render threw: ' + (e && e.message)); continue; }
        out.push(cyrb53(new Uint8Array(g.getImageData(0, 0, c.width, c.height).data.buffer)));
      }
    } finally { FM.setTime(t0); if (FM.seekVideosToTime) FM.seekVideosToTime(); }
    return out;
  }
  async function mediaIdle() {
    var t0 = Date.now();
    for (;;) {
      var busy = FM.scene.layers.some(function (l) {
        if (l.type !== 'video') return false;
        var m = FM.media && FM.media.get ? FM.media.get(l.id) : null;
        return !!(m && (m._building || (FM.seekBusy && FM.seekBusy(m))));
      });
      if (!busy) return;
      if (Date.now() - t0 > 90000) throw new Error('a video’s frame cache was still building after 90 s');
      await sleep(60);
    }
  }
  async function stateRecord(opts) {
    opts = opts || {};
    var rec = { doc: canonDoc(), hist: histInfo(), toasts: takeToasts(), sel: selInfo(), time: Math.round(FM.time * 1e6) / 1e6,
      playing: !!FM.playing, panels: panelsOpen() };
    if (!opts.noFrames) rec.frames = await frameHashes();
    return rec;
  }
  /* Which of Full's surfaces are up — the part of "what did that key do" that is not in the document. */
  function panelsOpen() {
    var up = function (id) { var e = D.getElementById(id); return !!(e && !e.classList.contains('hidden') && e.getClientRects().length); };
    return {
      exportDialog: up('export-dialog'), canvasDialog: up('canvas-dialog'), addSheet: !!(D.getElementById('add-sheet') && D.getElementById('add-sheet').classList.contains('open')),
      shortcuts: !!(FM.shortcuts && FM.shortcuts.isOpen && FM.shortcuts.isOpen()), ctxMenu: !!(FM.contextMenu && FM.contextMenu.isOpen && FM.contextMenu.isOpen()),
      textEdit: !!(FM.textEdit && FM.textEdit.isActive && FM.textEdit.isActive()), crop: !!(FM.cropTool && FM.cropTool.isActive && FM.cropTool.isActive()),
      optBar: up('opt-bar'), home: !!(FM.home && FM.home.isOpen && FM.home.isOpen()), settings: !!(FM.settings && FM.settings.isOpen && FM.settings.isOpen()),
      inspectorCat: (D.querySelector('#inspector-panel .insp-cat.open, #inspector-panel [data-cat].open') || {}).textContent ? String(D.querySelector('#inspector-panel .insp-cat.open, #inspector-panel [data-cat].open').textContent).trim().slice(0, 40) : ''
    };
  }

  /* ═══ DRIVING FULL: synthetic events on ATTACHED elements only (the suite's rule — re-acquire after a rebuild) ═══ */
  function el(sel, what) {
    var e = typeof sel === 'string' ? D.querySelector(sel) : sel;
    if (!e || !e.isConnected) throw new Error('no ' + (what || sel) + ' on screen');
    return e;
  }
  function firstVisible(ids) {
    for (var i = 0; i < ids.length; i++) { var e = D.getElementById(ids[i]); if (e && e.getClientRects().length && e.getBoundingClientRect().width > 0) return e; }
    return null;
  }
  function press(sel, what) {
    var e = typeof sel === 'string' ? (sel.charAt(0) === '#' || sel.charAt(0) === '.' || sel.indexOf(' ') >= 0 ? D.querySelector(sel) : D.getElementById(sel)) : sel;
    if (!e || !e.isConnected) throw new Error('no ' + (what || sel) + ' to press');
    e.click();
    return e;
  }
  function key(code, k, mods) {
    mods = mods || {};
    var ev = new w.KeyboardEvent('keydown', { bubbles: true, cancelable: true, code: code, key: k, metaKey: !!mods.meta, ctrlKey: !!mods.ctrl, shiftKey: !!mods.shift, altKey: !!mods.alt });
    (D.activeElement || D.body).dispatchEvent(ev);
    var up = new w.KeyboardEvent('keyup', { bubbles: true, cancelable: true, code: code, key: k, metaKey: !!mods.meta, ctrlKey: !!mods.ctrl, shiftKey: !!mods.shift, altKey: !!mods.alt });
    (D.activeElement || D.body).dispatchEvent(up);
  }
  function pe(target, type, x, y, buttons, id) {
    target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id || 41, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons: buttons }));
  }
  function clipEl(L) {
    if (FM.timeline && FM.timeline.rebuild) FM.timeline.rebuild();
    return el('#tl-tracks .clip[data-id="' + L.id + '"]', 'the timeline clip of ' + L.name);
  }
  /* Bring an element to the middle of the timeline before a drag, so no drag starts or ends in the edge zone that
     auto-scrolls — an auto-scroll's distance is however many frames the machine fitted in, not Full's behaviour. On a
     phone the timeline scrolls under a centred playhead, so this moves FM.time too; the same on both sides. */
  async function centerOn(target) {
    var tl = D.getElementById('timeline');
    if (!tl) return;
    var r = target.getBoundingClientRect(), tr = tl.getBoundingClientRect();

  async function runFU2(steps, rec, after, before) {
    for (var i = 0; i < steps.length; i++) {
      var nm = steps[i][0], err = '';
      step('FU2 ' + nm);
      if (before) await before();
      takeToasts();
      try { await steps[i][1](); } catch (e) { err = String(e && e.message || e); }
      await settle(200);
      var st = await stateRecord({ noFrames: !!rec.noFrames });
      var entry = { name: nm, err: err, state: st };
      if (after) entry.extra = await after(nm);
      rec.push(entry);
    }
  }
  async function FU2() {
    await freshCopy('FU2');
    var rec = DUMP.fu2;
    rec.push({ name: 'start', err: '', state: await stateRecord() });
    await runFU2(fu2Steps(), rec);
    /* …and at the end, the export's frames (every quarter second, through the compositor) and its audio mix. */
    step('FU2 export frames and audio');
    var P = FM.scene.project, times = [];
    for (var t = 0; t < Math.min(P.duration, 8); t += 0.25) times.push(Math.round(t * 100) / 100);
    var ex = { err: '', frames: [], audio: null };
    try {
      // the exporter's own first step: full-resolution frame caches for every reversed / frame-blended clip
      if (FM.exporter && FM.exporter.prepareCaches) await FM.exporter.prepareCaches(FM.scene, FM.scene.project.fps || 30);
      ex.frames = await frameHashes(times);
      if (FM.exporter && FM.exporter.buildAudioMix) {
        var mix = await FM.exporter.buildAudioMix(FM.scene, 0, P.duration);
        var buf = mix && mix.audioBuffer;
        if (!buf) ex.audio = { none: true, mix: mix === null ? 'null' : typeof mix };
        else {
          /* The mix's SHAPE, every 0.1 s: RMS and peak to 1/1000 per channel, and its length. Not a hash of the samples:
             measured 1 Oct, two runs of the same build mixed the same project to different 16-bit samples (the hash of
             the samples differed) while every window's RMS and peak agreed to 1/1000 — and a real change (a volume, a fade,
             a clip moved by a frame) moves the windows it touches by more than that. */
          var ch = [], win = Math.round(buf.sampleRate / 10), maxd = 0;
          for (var c = 0; c < buf.numberOfChannels; c++) {
            var f = buf.getChannelData(c), shape = [];
            for (var s0 = 0; s0 < f.length; s0 += win) {
              var e = Math.min(f.length, s0 + win), sq = 0, pk = 0;
              for (var k = s0; k < e; k++) { var v = f[k]; sq += v * v; if (Math.abs(v) > pk) pk = Math.abs(v); }
              shape.push(Math.round(Math.sqrt(sq / Math.max(1, e - s0)) * 1000) + '/' + Math.round(pk * 1000));
            }
            ch.push(shape.join(' '));
          }
          ex.audio = { len: buf.length, rate: buf.sampleRate, ch: ch };
        }
      }
    } catch (e) { ex.err = String(e && e.message || e); }
    rec.push({ name: 'export', err: ex.err, state: { exportFrames: ex.frames, exportAudio: ex.audio } });
  }

  /* ═══ FU3: every key the window keydown handler answers (js/app.js), with nothing selected and with one clip

  var KEYS = [

  /* Back to the fixture copy exactly as saved: reopen it from disk (no re-id, its media hydrated). */

  /* ═══ FU4: Full in a live session (DESIGN §0.4.5 FU4; §21 F9). The app is the host, a plain engine guest is the friend,
     on the in-page loopback link. FU2's script runs; what goes on the wire is recorded per step — every batch's ops,
     canonicalised, UNMASKED (the tool masks them with FU_INVISIBLE and nothing else) — and the guest's document at the
     end. Presence the host sends is recorded too. ═══════════════════════════════════════════════════════════════════ */
  async function FU4() {
    await freshCopy('FU4');
    var s = startSession(false);
    var out = DUMP.fu4 = { steps: [], guestDoc: null, err: '' };
    try {
      var pump = function () { try { s.S.tick('full'); } catch (e) {} try { s.loop.settle(); } catch (e) {} };
      pump(); s.sent.length = 0;
      var rec = []; rec.noFrames = true;
      await runFU2(fu2Steps(), rec, async function () {
        pump();
        var msgs = s.sent.splice(0);
        return msgs.map(function (m) {
          var msg = m.msg || {};
          if (m.ch === 'pres' || msg.t === 'pr' || msg.t === 'PR') {
            var p = clone(msg); ['at', 'n', 'ts', 'now', 'seq'].forEach(function (k) { delete p[k]; });
            return { ch: m.ch, t: msg.t, pres: canon(p, FM.scene.layers) };
          }
          if (msg.t === 'b') return { ch: m.ch, t: 'b', ops: canon(msg.ops || [], FM.scene.layers) };
          return { ch: m.ch, t: msg.t };
        });
      });
      out.steps = rec.map(function (r) { return { name: r.name, err: r.err, wire: r.extra, toasts: r.state.toasts }; });
      out.guestDoc = canon(clone({ project: s.gdoc.project, layers: s.gdoc.layers }), s.gdoc.layers);
    } catch (e) { out.err = String(e && e.message || e); }
    finally { await endSession(); }
  }

  /* ═══ FU5: documents. Each fixture document through the sanitiser, then the import door (applyScene), a save and an
     open (load) — the bytes at each stage. SCHEMA_REV / SCHEMA_FP are recorded under their own names (N1: the tool masks
     them by name, nothing else). ═══════════════════════════════════════════════════════════════════════════════════ */
  function kitchenDoc() {
    var kf = function (a, b) { return { kf: [{ t: a, v: 0, e: 'linear' }, { t: b, v: 1, e: 'easeIn' }] }; };
    var L = FM.makeLayer('text', { name: 'Kitchen', text: 'Ab', x: 50, y: 50 });

    L.effects = [{ type: 'blur', enabled: true, params: { radius: kf(2, 3) } }];
    L.audioFx = [{ type: 'reverb', enabled: true, params: { mix: kf(1, 5) } }];
    L.masks = [{ id: 'kmask', mode: 'add', path: { kf: [{ t: 1, v: [[0, 0], [8, 0], [8, 8]], e: 'linear' }, { t: 2, v: [[0, 0], [9, 0], [9, 9]], e: 'linear' }] } }];
    L.captions = [{ start: 0, end: 2, text: 'one', effects: [{ type: 'blur', enabled: true, params: { radius: kf(1.5, 2.5) } }] }, { start: 2, end: 4, text: 'two' }];
    var S = FM.makeLayer('shape', { name: 'Box', shape: 'rect', x: 10, y: 10, shapeW: 20, shapeH: 20, fill: '#123456' });
    S.id = 'kitchen_2'; S.parent = 'kitchen_1';

  /* ═══ FU6: the cog, his one sanctioned change (DESIGN §0.4.5 FU6; COG-DESIGN §6.4). Every element of #canvas-dialog
     other than #cv-editor, Canvas open and Friends open, at every size; then what Canvas and Friends DO. ═════════════ */
  var FU6_SIZES = [[440, 956], [1280, 800], [1366, 650], [1440, 900], [768, 1024], [720, 800], [956, 440], [932, 430], [844, 390], [1024, 600], [380, 800], [380, 667], [375, 553], [320, 568]];
  async function atSize(wd, ht, fn) {
    frame.style.width = wd + 'px'; frame.style.height = ht + 'px';
    w.dispatchEvent(new w.Event('resize')); await settle(250);
    try { return await fn(); }
    finally { frame.style.width = W + 'px'; frame.style.height = H + 'px'; w.dispatchEvent(new w.Event('resize')); await settle(200); }
  }
  function cogButton() { return firstVisible(['btn-settings', 'm-settings']); }
  function dlgUp() { var d = D.getElementById('canvas-dialog'); return !!(d && !d.classList.contains('hidden')); }
  /* Where the cog is, as data: on the phone pass, widening the frame is a phone turned sideways with the app open, and
     what Full shows then — including no cog at all — is Full's behaviour to record, not the probe's error. */
  function cogWhere() {

    }
    try { w.localStorage.removeItem('fm.cvPair'); } catch (e) {}

  /* ═══ BOOT ═══════════════════════════════════════════════════════════════════════════════════════════════════════ */
  async function main() {
    /* Asked of the driver BEFORE the app frame exists (tests/_cdp.py answers): the phone pass's touch emulation, and a
       seeded Math.random installed in the app frame before any of the app's own scripts run — so the draws it makes at
       boot (which drop-hint variant Home shows, the first shape hue) are the same on every run of the same build. */
    window.__fmWantSetup = {
      phone: PHONE,
      init: '(function () { if (window === window.top) return; var a = 0x980; Math.random = function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; ' +
            't = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();'
    };
    var su = await until('the driver to set the page up (run this through tools/full-unchanged.sh)', function () { return window.__fmSetupDone; }, 20000);
    if (su !== 1) throw new Error('setup: ' + su);
    try { localStorage.setItem('fm.test.seedProject', '1'); } catch (e) {}   // the same boot tests/run.html gives the app (queue 936)
    step('loading the app');
    var loaded = new Promise(function (r) { frame.addEventListener('load', r, { once: true }); });
    frame.src = '../index.html';
    await loaded;
    w = frame.contentWindow; D = w.document; FM = w.FM;
    var CORE = ['makeLayer', 'renderScene', 'newScene', 'layerById', 'refreshAll', 'scene', 'projects', 'storage', 'history'];
    var missing = CORE.filter(function (k) { return !FM || FM[k] === undefined; });
    if (missing.length) throw new Error('THE APP DID NOT LOAD IN THE PROBE FRAME — FM is missing ' + missing.join(', '));
    w.addEventListener('pagehide', function () { DUMP.errors.push('THE APP FRAME NAVIGATED during: ' + DUMP.step); });
    await until('the splash to go', function () { return !D.getElementById('splash'); }, 15000);
    seedRandom(0x980);
    await loadPalette();
    var st = D.createElement('style'); st.id = 'fu-probe-caret'; st.textContent = '*, *::before, *::after { caret-color: transparent !important; }';
    D.head.appendChild(st);
    var toast = D.getElementById('toast');
    if (toast) new w.MutationObserver(function () {
      if (!toast.classList.contains('hidden') && toast.textContent) noteToast(toast.textContent.trim());
    }).observe(toast, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    APP_VERSION = String((D.querySelector('.ver') || {}).textContent || '').trim();
    DUMP.app = { version: APP_VERSION, inner: [w.innerWidth, w.innerHeight], hoverNone: w.matchMedia('(hover: none)').matches, phoneMq: w.matchMedia('(max-width: 700px)').matches };
    if (w.innerWidth !== W || w.innerHeight !== H) throw new Error('the app frame is ' + w.innerWidth + '×' + w.innerHeight + ', not ' + W + '×' + H);
    if (PHONE && !DUMP.app.hoverNone) throw new Error('the phone pass is not a phone: (hover: none) does not match inside the app frame');
    await settle(400);
    step('FU1 home');
    if (GROUPS.indexOf('FU1') >= 0) await screen('fu1-home', null, { wait: 600 });
    await buildFixture();
    var plan = { FU1: FU1, FU2: FU2, FU6: FU6, FU3: FU3, FU4: FU4, FU5: FU5, FU7: FU7 };
    for (var i = 0; i < GROUPS.length; i++) {
      try { await plan[GROUPS[i]](); }
      catch (e) { DUMP.errors.push(GROUPS[i] + ' stopped at "' + DUMP.step + '": ' + (e && e.message || e)); closeTransient(); await endSession(); }
    }
    step('done');
  }
  main().then(function () { done(true); }, function (e) {
    DUMP.errors.push('the probe stopped at "' + DUMP.step + '": ' + (e && e.message || e));
    done(false, (e && e.message) || String(e));
  });
})();
</script>
