<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>probe3</title>
<style>html,body{margin:0;background:#000}iframe{border:0;display:block}pre{color:#0f0;font:11px monospace;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<pre id="out">PENDING</pre>
<script>
var q = new URLSearchParams(location.search);
var W = +(q.get('w')||380), H = +(q.get('h')||800);
var f = document.getElementById('f'); f.style.width=W+'px'; f.style.height=H+'px';
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function until(fn,ms){var t0=Date.now();while(Date.now()-t0<(ms||15000)){try{if(fn())return true;}catch(e){}await sleep(60);}return false;}
var R={}; function say(o){document.getElementById('out').textContent=JSON.stringify(o,null,1);}

f.addEventListener('load', function(){
  var d=f.contentDocument, w=f.contentWindow;
  (async function(){
    if(!(await until(()=>w.FM&&w.FM.scene&&w.FM.home,20000))) return say({error:'no FM'});
    var st=d.createElement('style'); st.textContent='*,*::before,*::after{animation:none!important;transition:none!important}'; d.head.appendChild(st);
    await sleep(300);
    var FM=w.FM;
    try {
      var card=d.querySelector('.hm-card'); if(card){card.click(); await until(()=>!FM.home.isOpen(),15000);} await sleep(800);
      if (FM.scene.layers.length<1){
        FM.scene.layers.push(FM.makeLayer('text',{name:'Title',text:'Your Big Idea',x:540,y:600,size:96}));
        FM.scene.layers.push(FM.makeLayer('shape',{shape:'circle',name:'Circle',x:400,y:1100,shapeW:400,shapeH:400,fill:'#5ac7ed'}));
        FM.refreshAll();
      }
      await sleep(500);
      R.project = FM.scene.project.width+'x'+FM.scene.project.height+' @'+FM.scene.project.fps+'fps';
      R.layerCount = FM.scene.layers.length;
      R.hasRenderScene = typeof FM.renderScene === 'function';

      // --- ISOLATED preview scene: one clone of the selected layer + a preset effect, rendered
      //     into a 380-square canvas, exactly what the Preset preview player would do. ---
      var L = JSON.parse(JSON.stringify(FM.scene.layers[0], FM.jsonReplacer));
      var preset = (FM.EFFECT_PRESETS||[])[0];
      var inst = preset && FM.effectPresets.makeInstance(preset, 0);
      L.effects = inst ? [inst] : [];
      var P = FM.scene.project;
      var mini = { project: { width: P.width, height: P.height, fps: P.fps, duration: 5, background: P.background||'#000' }, layers: [L] };

      // Render one frame and fingerprint it: proves the isolated-preview-scene approach works,
      // and that the preset actually CHANGES the picture (a preview that ignores the preset is
      // worse than no preview).
      function shot(size, scene, t){
        var c=d.createElement('canvas'); c.width=size; c.height=size;
        var g=c.getContext('2d', {willReadFrequently:true});
        g.setTransform(1,0,0,1,0,0);
        FM.renderScene(g, scene, t);
        var px=g.getImageData(0,0,size,size).data;
        var nonBlank=0, sum=0, h=0;
        for(var i=0;i<px.length;i+=4){ if(px[i+3]>8 && (px[i]|px[i+1]|px[i+2])) nonBlank++; sum+=px[i]+px[i+1]+px[i+2]; h=(h*31 + px[i]+px[i+1]*3+px[i+2]*7)|0; }
        return { size:size, t:t, litPx:nonBlank, litPct:+(100*nonBlank/(size*size)).toFixed(1), meanLuma:+(sum/(px.length/4)/3).toFixed(1), hash:h };
      }
      R.presetUsed = preset ? (preset.name+' ('+preset.fx+')') : null;
      var noFx = JSON.parse(JSON.stringify(mini)); noFx.layers[0].effects=[];
      R.frame_noPreset   = shot(380, noFx, 0.2);
      R.frame_withPreset = shot(380, mini, 0.2);
      R.previewDiffers = R.frame_noPreset.hash !== R.frame_withPreset.hash;
      R.frame_680       = shot(680, mini, 0.2);

      var heavy = (FM.EFFECT_PRESETS||[]).find(function(p){return p.fx==='glow';});
      if (heavy){
        var L2=JSON.parse(JSON.stringify(FM.scene.layers[0], FM.jsonReplacer));
        L2.effects=[FM.effectPresets.makeInstance(heavy,0)];
        R.heavyPreset = heavy.name+' ('+heavy.fx+')';
        R.frame_heavy = shot(380, {project:mini.project, layers:[L2]}, 0.4);
      }
      // A square preview of a 1080x1920 project: what fraction of the square is actually the frame?
      R.squareFit = { project: P.width+'x'+P.height, aspect:+(P.width/P.height).toFixed(3),
        letterboxedFrameInSquare: Math.round(380*(P.width/P.height)) + 'x380 inside 380x380',
        wastedPct: +(100*(1-(P.width/P.height))).toFixed(1) };
      say(R);
    } catch(e){ R.fatal=String(e&&e.stack||e); say(R); }
  })();
});
</script>
</body>
</html>
