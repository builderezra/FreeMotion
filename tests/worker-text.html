<!doctype html>
<meta charset="utf-8"><title>FreeMotion #47: captured text and fonts</title>
<style>body{background:#111;color:#eee;font:15px system-ui;margin:24px}pre{white-space:pre-wrap}iframe{position:fixed;left:-10000px;width:900px;height:760px}</style>
<h1>Text and fonts in background exports</h1><pre id="result">Loading…</pre><iframe id="app"></iframe>
<script>
(async function(){
  const checks=[],frame=document.getElementById('app'),output=document.getElementById('result');
  const assert=(ok,message)=>{if(!ok)throw new Error(message);};
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function waitFor(fn,message){const end=performance.now()+10000;while(performance.now()<end){if(fn())return;await sleep(20);}throw new Error(message);}
  async function decodedFrame(blob, width, height, time=.05) {
    const video=document.createElement('video'),url=URL.createObjectURL(blob);
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    try {
      video.muted=true;video.preload='auto';video.src=url;video.load();
      await waitFor(()=>video.readyState>=2||video.error,'Snapshot MP4 never decoded');
      assert(!video.error && video.videoWidth===width && video.videoHeight===height,'Snapshot MP4 dimensions/decoder differ');
      video.currentTime=time;
      await waitFor(()=>!video.seeking&&video.readyState>=2,'Snapshot MP4 seek never finished');
      const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0);
      return ctx.getImageData(0,0,width,height).data;
    }finally{video.removeAttribute('src');video.load();URL.revokeObjectURL(url);}
  }

  function rawPixels(source){const c=document.createElement('canvas');c.width=240;c.height=160;const ctx=c.getContext('2d');ctx.drawImage(source,0,0);return ctx.getImageData(0,0,240,160).data;}
  function error(a,b){let total=0,max=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);total+=d;max=Math.max(max,d);}return {mean:total/a.length,max};}
  async function digest(file){const hash=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');}
  try{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.style.width=Math.min(900,innerWidth)+'px';frame.src='../index.html';await loaded;
    const w=frame.contentWindow,FM=w.FM,NativeWorker=w.Worker,realRender=FM.renderScene,realCapture=FM.exportWorker.capture;
    const realSupport=w.VideoEncoder.isConfigSupported,realSignature=FM.exportResume.signature,originalMedia=FM.media;
    const fontBytes=await (await fetch('fixtures/fonts/LiberationSans-Regular.ttf')).arrayBuffer();
    const fontFile=new w.File([fontBytes],'LiberationSans-Regular.ttf',{type:'font/ttf'});
    const imported=await FM.fonts.import(fontFile);assert(imported,'Custom font fixture did not import');
    const expectedHash=await digest(fontFile);
    let mode='worker',jobs=[],raw=null,activeCapture=null,signed=null;
    FM.exportWorker.capture=function(...args){activeCapture=realCapture.apply(this,args);return activeCapture;};
    FM.exportResume.signature=function(args){signed=args;return realSignature(args);};
    w.Worker=class extends NativeWorker{
      constructor(...args){if(mode==='main')throw new Error('TEXT_STARTUP_FALLBACK');super(...args);this.job={terminated:0};jobs.push(this.job);
        this.addEventListener('message',e=>{if(e.data.bitmap&&!raw)raw=rawPixels(e.data.bitmap);});}
      terminate(){this.job.terminated++;return super.terminate();}
    };
    FM.renderScene=function(ctx,scene,time){const result=realRender.call(this,ctx,scene,time);if(FM._exporting&&activeCapture&&scene===activeCapture.document&&!raw)raw=ctx.getImageData(0,0,240,160).data;return result;};
    try{
      for(const backend of ['worker','main']){
        mode=backend;raw=null;signed=null;activeCapture=null;
        const scene=FM.newScene();Object.assign(scene.project,{width:240,height:160,fps:10,duration:1,background:'#102030',markers:[]});
        const a=FM.makeLayer('text',{name:'Custom type',x:120,y:47,duration:1}),b=FM.makeLayer('text',{name:'System type',x:120,y:118,duration:1});
        Object.assign(a,{text:'Free Motion wraps',fontFamily:imported.css,fontSize:27,bold:true,italic:true,letterSpacing:.7,wrapWidth:195,lineHeight:1.2,color:'#f3cd74'});
        a.transform.rotation=-5;a.transform.x={kf:[{t:0,v:120},{t:1,v:145}]};
        Object.assign(b,{text:'Ready to create',fontFamily:'Georgia, serif',fontSize:21,bold:true,align:'left',letterSpacing:1.1,wrapWidth:210,lineHeight:1.15,color:'#8ccfff'});
        b.transform.rotation=7;b.transform.opacity=.85;b.effects=[{type:'gamma',params:{gamma:1.3}}];
        scene.layers=[a,b];FM.scene=scene;FM.time=0;FM.isolate=null;FM._dragOrderIds=null;FM._exportTransparent=false;
        assert(FM.exportWorker.eligible(scene),'Ordinary system and imported text were not admitted');
        // FontFaceSet belongs to the app document; an outer canvas would measure fallback glyphs.
        const c=w.document.createElement('canvas');c.width=240;c.height=160;const ctx=c.getContext('2d');
        FM._exporting=true;realRender(ctx,scene,0);FM._exporting=false;const expected=ctx.getImageData(0,0,240,160).data;
        let entered=false,release,ready;const gate=new Promise(resolve=>{release=resolve;}),before=jobs.length;
        w.VideoEncoder.isConfigSupported=async function(config){if(!entered){entered=true;await gate;}return realSupport.call(this,config);};
        try{
          const running=FM.exporter.run({bitrate:500000,onReady:async result=>{ready=result;}});
          await waitFor(()=>entered,'Text export never reached codec setup');
          a.text='EDITED LIVE';a.fontFamily='Courier New, monospace';a.transform.x=130;release();await running;
          assert(ready&&raw,'Text export did not deliver its frame/file');
          const parity=error(raw,expected);
          if(parity.max){const actual=document.createElement('canvas');actual.width=240;actual.height=160;actual.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(raw),240,160),0,0);window.__workerProbeImages={page:c.toDataURL(),worker:actual.toDataURL()};}
          assert(parity.max===0,'Captured text pixels differ from native font preview: '+JSON.stringify(parity));
          const decoded=await decodedFrame(ready.blob,240,160),encodedError=error(decoded,expected);
          assert(encodedError.mean<8,'Encoded MP4 did not retain its initial text: '+JSON.stringify(encodedError));
          assert(FM.scene===scene&&FM.media===originalMedia&&a.text==='EDITED LIVE'&&a.fontFamily==='Courier New, monospace'&&a.transform.x===130,'Export undid the live text edit');
          assert(signed.renderer.includes(expectedHash),'Resume signature did not retain original font content');
          assert(jobs.length===before+(backend==='worker'?1:0),'Incorrect renderer selected');
          checks.push(backend+': system + imported fonts retain wrapping, bold/italic, spacing and transforms through live edits and include the original font hash');
        }finally{release();w.VideoEncoder.isConfigSupported=realSupport;FM.media=originalMedia;await FM.exportResume.clear();}
      }
      assert(jobs.every(job=>job.terminated===1),'Text export leaked a Worker');window.__workerCanvasResult={ok:true,checks};
    }finally{await FM.fonts.remove(imported.id);w.Worker=NativeWorker;FM.renderScene=realRender;FM.exportWorker.capture=realCapture;FM.exportResume.signature=realSignature;w.VideoEncoder.isConfigSupported=realSupport;FM.media=originalMedia;FM._exporting=false;FM._exportCancel=false;}
  }catch(e){window.__workerCanvasResult={ok:false,error:e.stack||String(e),checks};}
  output.textContent=JSON.stringify(window.__workerCanvasResult,null,2);
})();
</script>
