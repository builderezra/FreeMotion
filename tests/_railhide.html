<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Does the canvas rail stand down for the effects browser? (queue 447)</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:380px;height:820px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:390px;top:0;width:1000px;color:#cfe;font:11px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
/* Queue 447. The rail is #view-bar. The question is only whether it is on screen while the browser is
   open — and, just as importantly, whether it comes BACK when the browser closes. */
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.fxBrowser)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), out=document.getElementById('out'), log=[];
function say(s){log.push(s); out.textContent=log.join('\n');}
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var W=f.contentWindow, d=f.contentDocument;
  var sp=d.getElementById('splash'); if(sp) sp.remove(); d.documentElement.classList.remove('splash-on');
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(700);
  say('CSS :has() supported here: '+(W.CSS&&W.CSS.supports?W.CSS.supports('selector(body:has(div))'):'?'));
  FM.scene.layers.length=0;
  var L=FM.makeLayer('shape',{name:'S',shape:'rect',x:540,y:960,shapeW:400,shapeH:400,fill:'#3a7bd5'});
  L.start=0;L.duration=4;FM.scene.layers.push(L);
  FM.refreshAll(); FM.selectLayer(L.id); await sleep(300);
  var rail=d.getElementById('view-bar');
  function railOn(){ if(!rail) return 'no #view-bar'; var cs=W.getComputedStyle(rail); var r=rail.getBoundingClientRect();
    return cs.display+' '+(r.width>2&&r.height>2?'ON SCREEN ('+r.width.toFixed(0)+'x'+r.height.toFixed(0)+')':'not drawn'); }
  // the rail only shows when it has been toggled on — open it first
  var fit=d.getElementById('btn-amfit'); if(fit) fit.click();
  await sleep(400);
  say('rail after opening it:        '+railOn());
  FM.fxBrowser.open(L); await sleep(700);
  say('rail with the browser OPEN:   '+railOn());
  FM.fxBrowser.close(); await sleep(500);
  say('rail after the browser CLOSES:'+railOn()+'   ← must be back, or the buttons "disappeared"');
  document.title='ready';
 }).catch(function(e){say('ERR '+e.message+'\n'+e.stack);document.title='ERR';});
});
</script></body></html>
