<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>screen harness</title>
<style>
  html, body { margin: 0; background: #05070b; }
  iframe { border: 0; display: block; }
  #err { position: fixed; left: 0; bottom: 0; font: 12px monospace; color: #ff8; background: #300; padding: 4px 8px; }
</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<div id="err" style="display:none"></div>
<script>
/* Dev-only. Puts the REAL app into a named screen at a named size so it can be shot headlessly and
   looked at. Not linked from the app, not shipped.
     ?do=<recipe>&w=380&h=800
   Runs against a throwaway Chrome profile, so the recipes add their own content freely.
   Animations are killed so two captures of the same screen are byte-comparable — a paused animation
   stops wherever it happens to be, which already once looked exactly like a real rendering bug. */
var q = new URLSearchParams(location.search);
var W = +(q.get('w') || 1280), H = +(q.get('h') || 860), DO = q.get('do') || 'home';
var f = document.getElementById('f');
f.style.width = W + 'px'; f.style.height = H + 'px';

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function until(fn, ms) {
  var t0 = Date.now();
  while (Date.now() - t0 < (ms || 12000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); }
  return false;
}

var RECIPES = {
  async home(W2) {},
  async 'home-templates'(W2, d) { d.querySelector('.hm-tab[data-tab="templates"]').click(); await sleep(400); },
  async 'home-elements'(W2, d) { d.querySelector('.hm-tab[data-tab="elements"]').click(); await sleep(400); },
  async 'home-search'(W2, d) { d.getElementById('hm-search-btn').click(); await sleep(400); },
  async editor(W2, d, FM) { await openEditor(d, FM); },
  async 'editor-selected'(W2, d, FM) {
    await openEditor(d, FM);
    FM.selectLayer(FM.scene.layers[0].id); await sleep(500);
  },
  async 'add-menu'(W2, d, FM) { await openEditor(d, FM); FM.selectLayer(null); await sleep(600); },
  // Phone: the add SHEET (a different component from the desktop panel) — opened via the + FAB.
  async 'add-sheet'(W2, d, FM) {
    await openEditor(d, FM); FM.selectLayer(null); await sleep(400);
    const fab = d.getElementById('add-fab'); if (!fab) throw new Error('no #add-fab at this width');
    fab.click(); await sleep(700);
  },
  async 'add-menu-shapes'(W2, d, FM) {
    await openEditor(d, FM); FM.selectLayer(null); await sleep(500);
    var t = d.querySelector('.addmenu-tab[data-key="shape"]'); if (t) t.click(); await sleep(400);
  },
  async 'fx-browser'(W2, d, FM) {
    await openEditor(d, FM);
    FM.selectLayer(FM.scene.layers[0].id); await sleep(400);
    if (FM.fxBrowser && FM.fxBrowser.open) FM.fxBrowser.open(); await sleep(700);
  },
  async 'export-dialog'(W2, d, FM) { await openEditor(d, FM); FM.showExportDialog(); await sleep(500); },
  async settings(W2, d, FM) { await openEditor(d, FM); if (FM.settings && FM.settings.open) FM.settings.open(); await sleep(600); },
  // Freehand: enter the tool and draw a real arc through the overlay, so the capture shows an actual
  // stroke rather than an empty canvas in drawing mode.
  async freehand(W2, d, FM) {
    await openEditor(d, FM);
    FM.selectLayer(null); await sleep(300);
    FM.startDraw('freehand'); await sleep(700);
    const ov = d.getElementById('draw-overlay');
    if (!ov) throw new Error('no #draw-overlay');
    const r = ov.getBoundingClientRect();
    if (!r.width) throw new Error('draw overlay is ' + Math.round(r.width) + 'x' + Math.round(r.height));
    const W = f.contentWindow;
    const ev = (type, x, y) => ov.dispatchEvent(new W.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons: 1 }));
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const sx = Math.min(150, r.width * 0.32), sy = Math.min(120, r.height * 0.26);
    ev('pointerdown', cx - sx, cy + sy);
    // A HUMAN stroke, not a formula: sampled densely with hand tremor on top. A clean sine curve has
    // nothing to smooth, so it cannot show whether smoothing works — the first version of this recipe
    // drew one and the before/after images were identical.
    let seed = 12345;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff - 0.5; };
    for (let i = 1; i <= 120; i++) {
      const t = i / 120;
      const jx = rnd() * 5.5, jy = rnd() * 5.5;
      ev('pointermove', cx - sx + 2 * sx * t + jx, cy + sy - Math.sin(t * Math.PI) * 2 * sy + jy);
      await sleep(3);
    }
    ev('pointerup', cx + sx, cy + sy);
    await sleep(800);
  },
  // A wrapped text layer, SELECTED, so the shot shows the wrap handles sitting on the column border.
  async 'text-wrap'(W2, d, FM) {
    await openEditor(d, FM);
    FM.scene.layers.length = 0;
    const t = FM.makeLayer('text', {
      name: 'Wrapped', text: 'Drag the side handles to decide where this text wraps instead of typing newlines',
      x: FM.scene.project.width / 2, y: FM.scene.project.height * 0.42, fontSize: 78, wrapWidth: 760
    });
    FM.scene.layers.push(t);
    FM.refreshAll();
    await sleep(300);
    FM.selectLayer(t.id);
    await sleep(700);
  },
  // The focused text editor, on a phone. `kb` fakes a software keyboard by shrinking the visual
  // viewport, which is the only way to see the layout the bug is about — headless Chrome has no
  // keyboard, so without this every capture shows the easy, keyboard-less case.
  async 'text-edit'(W2, d, FM) {
    await openEditor(d, FM);
    FM.scene.layers.length = 0;
    const t = FM.makeLayer('text', { name: 'Caption', text: 'Type here', x: FM.scene.project.width / 2, y: FM.scene.project.height * 0.4, fontSize: 90 });
    FM.scene.layers.push(t); FM.refreshAll(); await sleep(300);
    FM.textEdit.start(t.id); await sleep(500);
    const kb = +(q.get('kb') || 0);
    if (kb) { fakeKeyboard(f.contentWindow, kb); await sleep(400); }
    const popName = q.get('pop');
    if (popName) { const b = d.querySelector('.te-' + popName); if (!b) throw new Error('no .te-' + popName + ' button'); b.click(); await sleep(500); }
  },
  // Keyframes in both states. ?cat=home leaves nothing focused (every diamond an inert outline);
  // ?cat=transform opens Move & Transform so the position keys arm and the opacity keys do not.
  async 'keyframes'(W2, d, FM) {
    await openEditor(d, FM);
    FM.scene.layers.length = 0;
    const L = FM.makeLayer('shape', { shape: 'star', name: 'Star', x: FM.scene.project.width * 0.3, y: FM.scene.project.height * 0.5, shapeW: 300, shapeH: 300, fill: '#7a5cff' });
    L.transform.x = { kf: [{ t: 0, v: 300, e: 'smooth' }, { t: 1.6, v: 800, e: 'smooth' }, { t: 3.2, v: 300, e: 'linear' }] };
    L.transform.opacity = { kf: [{ t: 0.6, v: 1, e: 'hold' }, { t: 2.4, v: 0.2, e: 'hold' }] };
    FM.scene.layers.push(L);
    FM.refreshAll(); await sleep(300);
    FM.selectLayer(L.id); await sleep(300);
    FM.inspector.openCategory(q.get('cat') || 'home');
    if ((q.get('cat') || '') === 'transform') FM._mtMode = 'move';
    FM.timeline.rebuild();
    FM.time = 0; FM.timeline.updatePlayhead();
    await sleep(500);
  },
  async 'freehand-drawn'(W2, d, FM) { await RECIPES.freehand(W2, d, FM); const done = d.querySelector('#draw-bar button'); if (done) done.click(); await sleep(900); },
};

// Shrink the iframe's visual viewport by `px` and fire the events a real keyboard fires. The
// property is read-only, so the object is replaced wholesale on the iframe's window.
function fakeKeyboard(W, px) {
  const vv = W.visualViewport;
  const fake = {
    height: (vv ? vv.height : W.innerHeight) - px,
    width: vv ? vv.width : W.innerWidth,
    offsetTop: 0, offsetLeft: 0, pageTop: 0, pageLeft: 0, scale: 1,
    addEventListener() {}, removeEventListener() {},
  };
  try { Object.defineProperty(W, 'visualViewport', { value: fake, configurable: true }); } catch (e) { return false; }
  W.dispatchEvent(new W.Event('resize'));
  return true;
}

async function openEditor(d, FM) {
  var card = d.querySelector('.hm-card');
  if (card) { card.click(); await until(function () { return !FM.home.isOpen(); }, 12000); }
  await sleep(700);
  // A believable working document: an empty project shows an empty timeline and an empty inspector,
  // which tells you nothing about how the layout holds up.
  if (FM.scene.layers.length < 3) {
    FM.scene.layers.length = 0;
    FM.scene.layers.push(FM.makeLayer('text', { name: 'Title', text: 'Your Big Idea', x: FM.scene.project.width / 2, y: FM.scene.project.height * 0.32, size: 96 }));
    FM.scene.layers.push(FM.makeLayer('shape', { shape: 'circle', name: 'Circle', x: FM.scene.project.width * 0.34, y: FM.scene.project.height * 0.62, shapeW: 260, shapeH: 260, fill: '#5ac7ed' }));
    FM.scene.layers.push(FM.makeLayer('shape', { shape: 'star', name: 'Star', x: FM.scene.project.width * 0.68, y: FM.scene.project.height * 0.66, shapeW: 220, shapeH: 220, fill: '#7a5cff' }));
    FM.scene.layers.push(FM.makeLayer('shape', { shape: 'rect', name: 'Bar', x: FM.scene.project.width / 2, y: FM.scene.project.height * 0.86, shapeW: 520, shapeH: 90, fill: '#29d9bb' }));
    FM.refreshAll();
  }
  await sleep(600);
}

f.addEventListener('load', function () {
  var d = f.contentDocument, w = f.contentWindow;
  (async function () {
    var ok = await until(function () { return w.FM && w.FM.scene && w.FM.home; }, 15000);
    if (!ok) return fail('FM never initialised');
    var st = d.createElement('style');
    st.textContent = '*,*::before,*::after{animation:none!important;transition:none!important}' +
                     '#home-screen.hm-preintro > *{opacity:1!important}';
    d.head.appendChild(st);
    await sleep(500);
    var r = RECIPES[DO];
    if (!r) return fail('unknown recipe: ' + DO);
    try { await r(W, d, w.FM); } catch (e) { return fail(DO + ' → ' + (e && e.message)); }
    await sleep(500);
  })();
});
function fail(m) { var e = document.getElementById('err'); e.style.display = ''; e.textContent = 'HARNESS: ' + m; }
</script>
</body>
</html>
