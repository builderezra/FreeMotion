<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>#128 — how long is the dead wait before a project open animates?</title>
<style>html,body{margin:0;background:#05070b;color:#cfd6e4;font:12.5px/1.55 ui-monospace,Menlo,monospace}
iframe{position:fixed;left:-10000px;top:0;width:390px;height:800px;border:0}
#out{padding:12px;white-space:pre}</style></head><body>
<iframe id="app" src="index.html"></iframe><div id="out">measuring…</div>
<script>
/* Ezra (#128): "the animation when opening a project feels janky, the fix is make it so the animation
   of the project layer moving to the left happens instantly, so it feels responsive… then smoothly
   the project should swoop in too."

   He has prescribed a fix, which is a reason to be MORE careful rather than less: if the card already
   starts moving on the first frame then the jank is elsewhere and reordering the code would fix
   nothing. js/home.js openProject() reads:

       if (id !== FM.projects.currentId()) await FM.projects.open(id);
       if (!keepOpen) FM.home.close({ push: true, lead: lead });

   so the card provably cannot move until open() has RESOLVED — that part is arithmetic, not a guess.
   The open number is therefore the whole question, and it is what this measures. Driving the real
   gesture layer would add a pile of brittleness for a number this already answers. */
(function () {
  var out = document.getElementById('out'), fr = document.getElementById('app'), L = [];
  function done(){ out.textContent = L.join('\n'); window.__done = true; }
  fr.addEventListener('load', function () {
    var w = fr.contentWindow, tries = 0;
    (function wait() {
      if (++tries > 300) { L.push('FM never initialised'); return done(); }
      if (!w.FM || !w.FM.projects || !w.FM.makeLayer || !w.FM.storage) return setTimeout(wait, 50);
      setTimeout(function () { go(w); }, 500);
    })();
  });

  async function go(w) {
    var FM = w.FM, made = [];
    try {
      var before = FM.projects.list().length;
      for (var n = 0; n < 2; n++) {
        var id = await FM.projects.create({ name: 'JankProbe ' + n, width: 1080, height: 1920 });
        made.push(id);
        // Enough content that loading is worth timing — an empty project would flatter the result.
        FM.scene.layers = [
          FM.makeLayer('shape', { name: 'a', shape: 'rect',  x: 300, y: 300, shapeW: 400, shapeH: 300, fill: '#e33', start: 0, duration: 4 }),
          FM.makeLayer('text',  { name: 'b', text: 'hello',  x: 300, y: 700, start: 0, duration: 4 }),
          FM.makeLayer('shape', { name: 'c', shape: 'star',  x: 500, y: 1100, shapeW: 300, shapeH: 300, fill: '#3ce', start: 0, duration: 4 }),
          FM.makeLayer('shape', { name: 'd', shape: 'heart', x: 500, y: 1500, shapeW: 300, shapeH: 300, fill: '#fc0', start: 0, duration: 4 }),
        ];
        /* A REAL MEDIA CLIP in one of the two, because that is what his projects have and vectors
           alone flatter the number badly: the first pass of this probe used four shapes and reported
           a 16ms open, which would have "proved" there is no jank to fix. Media has to be decoded and
           pulled back out of IndexedDB on open — that is where the code's own "1200ms open" comment
           came from. */
        if (n === 1) {
          var blob = await fetch('tests/_fixtures/vad/clean.wav').then(function (r) { return r.blob(); });
          var file = new w.File([blob], 'probe-audio.wav', { type: 'audio/wav' });
          var rec = await FM.loadVideoFile(file);
          FM.addMediaLayer(rec);
        }
        await FM.storage.save();
      }
      L.push('probe projects: ' + made.length + '  (library had ' + before + ' before)');
      L.push('');

      // The real case: switching from one project to another, three times each way.
      var runs = [];
      for (var i = 0; i < 6; i++) {
        var target = made[i % 2];
        if (target === FM.projects.currentId()) target = made[(i + 1) % 2];
        var t0 = performance.now();
        await FM.projects.open(target);
        runs.push(performance.now() - t0);
        await new Promise(function (r) { setTimeout(r, 250); });   // let it settle between runs
      }
      var sorted = runs.slice().sort(function (a, b) { return a - b; });
      L.push('FM.projects.open() — the await that blocks the animation:');
      runs.forEach(function (r, i) { L.push('   run ' + (i + 1) + '   ' + r.toFixed(0) + ' ms'); });
      L.push('   median  ' + sorted[Math.floor(sorted.length / 2)].toFixed(0) + ' ms      worst ' + sorted[sorted.length - 1].toFixed(0) + ' ms');
      L.push('');
      L.push('The card cannot begin moving until that resolves — js/home.js awaits it, THEN calls');
      L.push('home.close({push}). So this number IS the dead time between finger and first movement.');
      L.push('Under ~50ms and there is no jank here to fix and the cause is elsewhere. Hundreds of ms');
      L.push('is exactly what he is describing.');

      /* SECOND HALF, added once the first half came back at 28ms: if the wait before the animation is
         only a frame or two, then "janky" is not a late start — it is the animation itself STUTTERING.
         The first frames of the push are the most expensive moment in the app: #app becomes visible
         and the editor lays out, sizes its canvas, builds the timeline and paints a frame for the
         first time, all while a 280ms transform animation is supposed to be running. One 200ms frame
         inside a 280ms animation is a visible lurch, and it would feel exactly like what he describes.
         So: watch frame-to-frame time across a real open, and report the worst one. */
      var frames = [], last = 0, watching = true;
      function tick(ts) { if (last) frames.push(ts - last); last = ts; if (watching) w.requestAnimationFrame(tick); }
      w.requestAnimationFrame(tick);
      await new Promise(function (r) { setTimeout(r, 300); });    // baseline, idle on home
      var idle = frames.slice().sort(function (a, b) { return b - a; })[0] || 0;
      frames.length = 0;

      FM.home.open();
      await new Promise(function (r) { setTimeout(r, 600); });
      frames.length = 0;
      if (FM.home._pushAllowed) FM.home._pushAllowed = function () { return true; };   // the frame is 390px but the window is not
      var pid = made[1];
      var pt0 = performance.now();
      await FM.projects.open(pid);
      FM.home.close({ push: true });
      await new Promise(function (r) { setTimeout(r, 900); });
      watching = false;
      var total = performance.now() - pt0;
      var worst = frames.slice().sort(function (a, b) { return b - a; });
      var longFrames = frames.filter(function (f) { return f > 50; }).length;
      L.push('');
      L.push('frame times across a real open + push (' + total.toFixed(0) + ' ms of wall clock):');
      L.push('   frames            ' + frames.length);
      L.push('   worst frame       ' + (worst[0] || 0).toFixed(0) + ' ms      (idle baseline worst ' + idle.toFixed(0) + ' ms)');
      L.push('   2nd / 3rd worst   ' + (worst[1] || 0).toFixed(0) + ' / ' + (worst[2] || 0).toFixed(0) + ' ms');
      L.push('   frames over 50ms  ' + longFrames + '   <-- each one of these is a visible hitch');
    } catch (e) {
      L.push('THREW: ' + (e && e.message || e));
      L.push((e && e.stack || '').split('\n').slice(0, 5).join('\n'));
    }
    // A probe must never leave projects behind in his library.
    try {
      for (var k = 0; k < made.length; k++) { try { await FM.projects.remove(made[k]); } catch (e) {} }
      L.push('');
      L.push('cleaned up; library now has ' + FM.projects.list().length + ' project(s)');
    } catch (e) { L.push('CLEANUP FAILED: ' + e); }
    done();
  }
})();
</script></body></html>
