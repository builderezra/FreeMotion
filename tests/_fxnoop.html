<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Do the picked effects change any pixels? (queue 389)</title></head>
<body style="margin:0;background:#081116;color:#d8e6ee;font:12px/1.45 ui-monospace,monospace">
<iframe id="app" src="../index.html" style="width:420px;height:820px;border:0;position:absolute;left:-9999px"></iframe>
<pre id="out" style="padding:10px;white-space:pre-wrap">measuring…</pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.fxRegistry&&w.FM.renderScene)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app'), out=document.getElementById('out');
f.addEventListener('load',function(){var w=f.contentWindow,d=f.contentDocument;
 waitFM(w).then(async function(FM){
  await sleep(400);
  var P={width:240,height:240,fps:30,duration:6};
  function scene(fx){
    var L=FM.makeLayer('shape',{name:'V',shape:'rect',x:120,y:120,shapeW:170,shapeH:170,fill:'#8fd4ff'});
    L.start=0;L.duration=6;L.effects=fx?[fx]:[];
    return {project:P,layers:[L]};
  }
  function shot(sc,t){
    var c=d.createElement('canvas');c.width=P.width;c.height=P.height;
    var g=c.getContext('2d',{willReadFrequently:true});
    g.setTransform(1,0,0,1,0,0);
    FM.renderScene(g,sc,t);
    return g.getImageData(0,0,P.width,P.height).data;
  }
  function diff(a,b){var n=0;for(var i=0;i<a.length;i+=4){if(Math.abs(a[i]-b[i])>6||Math.abs(a[i+1]-b[i+1])>6||Math.abs(a[i+2]-b[i+2])>6||Math.abs(a[i+3]-b[i+3])>6)n++;}return n;}
  var base=shot(scene(null),1.0);
  var cats=FM.FX_CATEGORIES||[];
  var colour=cats.filter(function(c){return /colou?r/i.test(c.label)||/colou?r/i.test(c.key);})[0];
  var lines=['categories: '+cats.map(function(c){return c.key+'/'+c.label;}).join('  ')];
  lines.push('');
  if(!colour){ lines.push('no colour-ish category found'); }
  else {
    var list=FM.fxRegistry.byCategory(colour.key);
    lines.push('CATEGORY '+colour.label+' ('+colour.key+') — '+list.length+' effects, default params, 240x240, t=1.0');
    var dead=[];
    list.forEach(function(e){
      var inst=FM.fxRegistry.makeInstance(e.type);
      var n=0; try{ n=diff(base, shot(scene(inst),1.0)); }catch(err){ n=-1; }
      var pct=(n*100/(P.width*P.height)).toFixed(1);
      if(n<=0) dead.push(e.type);
      lines.push('  '+(e.type+'').padEnd(20)+(e.label||'').padEnd(24)+' changed px '+String(n).padStart(6)+'  ('+pct+'%)');
    });
    lines.push('');
    lines.push('NO-OP AT DEFAULTS: '+(dead.length?dead.join(', '):'(none)'));
    lines.push('that is '+dead.length+' of '+list.length);
  }
  out.textContent=lines.join('\n');
  document.title='ready';
 }).catch(function(e){out.textContent='ERR '+e.message;document.title='ERR';});
});
</script></body></html>
