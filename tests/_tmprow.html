<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>t</title></head>
<body style="margin:0;background:#000">
<iframe id="app" src="../index.html" style="width:1280px;height:760px;border:0;display:block"></iframe>
<pre id="out" style="position:fixed;left:0;top:0;width:1280px;color:#cfe;font:12px ui-monospace;background:#06121a;padding:8px;white-space:pre-wrap;z-index:9"></pre>
<script>
function waitFM(w){return new Promise(function(r,j){var n=0;(function p(){if(w.FM&&w.FM.scene&&w.FM.timeline)return r(w.FM);if(n++>400)return j(new Error('no FM'));setTimeout(p,50);})();});}
function sleep(m){return new Promise(function(r){setTimeout(r,m);});}
var f=document.getElementById('app');
f.addEventListener('load',function(){
 waitFM(f.contentWindow).then(async function(FM){
  var W=f.contentWindow, d=f.contentDocument;
  if(FM.home&&FM.home.isOpen&&FM.home.isOpen())FM.home.close(); await sleep(400);
  d.body.classList.add('layout-studio');
  FM.scene.layers.length=0;
  var L=FM.makeLayer('shape',{name:'Shape 1',shape:'rect',x:540,y:700,shapeW:420,shapeH:220,fill:'#3a7bd5'});
  L.start=0;L.duration=4;FM.scene.layers.push(L);
  FM.refreshAll(); FM.timeline.rebuild(); FM.selectLayer(L.id); FM.refreshAll(); await sleep(600);
  var t=d.getElementById('transport'), o=[];
  var tr=t.getBoundingClientRect();
  o.push('#transport ['+tr.left.toFixed(0)+'-'+tr.right.toFixed(0)+']  y '+tr.top.toFixed(0)+'-'+tr.bottom.toFixed(0)+'  cols '+W.getComputedStyle(t).gridTemplateColumns);
  [].forEach.call(t.children,function(c){
    var r=c.getBoundingClientRect(), cs=W.getComputedStyle(c);
    o.push('  '+(c.id?'#'+c.id:c.tagName.toLowerCase()+'.'+(c.className||'').toString().trim().split(/\s+/)[0])
      +'  x '+r.left.toFixed(0)+'-'+r.right.toFixed(0)+'  w '+r.width.toFixed(0)+'  col '+cs.gridColumn+'  kids '+c.children.length
      +'  ['+[].map.call(c.children,function(k){return (k.id||k.className||'?')+(W.getComputedStyle(k).display==='none'?'(hidden)':'');}).join(' ')+']');
  });
  var sel=d.getElementById('t-sel');
  if(sel){var cs=W.getComputedStyle(sel);o.push('#t-sel bg='+cs.background.slice(0,60)+'  border='+cs.border+'  radius='+cs.borderRadius+'  pad='+cs.padding);}
  document.getElementById('out').textContent=o.join('\n');
  document.title='ready';
 }).catch(function(e){document.getElementById('out').textContent='ERR '+e.message;document.title='ERR';});
});
</script></body></html>
