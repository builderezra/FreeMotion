<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letterbox byte-identity sweep</title>
<style>
  html, body { margin: 0; background: #05070b; color: #cfd6e4;
               font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #out { padding: 8px 12px; white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<div id="out">booting…</div>

<script src="../js/settings.js"></script>
<script src="../js/scene.js"></script>
<script src="../js/eases.js"></script>
<script src="../js/masks.js"></script>
<script src="../js/behaviors.js"></script>
<script src="../js/media.js"></script>
<script src="../js/blend-modes.js"></script>
<script src="../js/compositor.js"></script>
<script src="../js/fx-registry.js"></script>
<script>
/* ============================================================================================
 * FreeMotion — LETTERBOX BYTE-IDENTITY sweep.  Dev-only; not shipped, not linked from the app.
 *
 * WHY THIS EXISTS
 *   The bounded-frame change alters where two effects paint. The promise attached to it is that
 *   NOTHING ELSE MOVES: a project already saved with a full-frame Letterbox must render exactly
 *   as it did, and no other effect may shift by a single byte. That promise is worth only as
 *   much as the measurement behind it, so this page renders a fixed matrix of configurations and
 *   prints a per-config checksum. Run it against both trees and diff the output; the configs
 *   that differ are the change's real blast radius, and every one of them has to be a config the
 *   change was MEANT to alter.
 *
 *   The matrix deliberately includes controls (blur, vignette, glow — effects the change does not
 *   touch) so that "everything matched" cannot be produced by a harness that silently rendered
 *   nothing. If the controls do not appear in the output, the run is void.
 *
 * DETERMINISM
 *   Every config renders at t = 0 with no media, so the only inputs are the scene and the code.
 *   The checksum is a plain FNV-1a over the RGBA bytes — collisions are irrelevant here, since
 *   the two runs render the same configs in the same order and are compared pairwise.
 * ============================================================================================ */
(function () {
  var W = 320, H = 240;
  function offscreen(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function shot(layers, rs) {
    var c = offscreen(Math.round(W * rs), Math.round(H * rs));
    c.__fmRS = rs; c.__fmOX = 0; c.__fmOY = 0;
    var g = c.getContext('2d', { willReadFrequently: true });
    FM.renderScene(g, { project: { width: W, height: H, fps: 30, duration: 5, background: null }, layers: layers }, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var hsh = 2166136261;
    for (var i = 0; i < d.length; i++) { hsh ^= d[i]; hsh = (hsh * 16777619) >>> 0; }
    return hsh.toString(16);
  }
  function rect(name, w, h, y, fx) {
    var L = FM.makeLayer('shape', { shape: 'rect', name: name, x: 160, y: y, shapeW: w, shapeH: h, fill: '#0000ff' });
    L.effects = fx ? [fx] : [];
    return L;
  }
  function below() {
    return FM.makeLayer('shape', { shape: 'rect', name: 'below', x: 160, y: 120, shapeW: W, shapeH: H, fill: '#00ff00' });
  }
  // name, width, height, y — the subjects. "full" is the backward-compatibility case that must not move.
  var SUBJ = [
    ['full',      W,   H,   120],
    ['inset2',    W-4, H-4, 120],
    ['inset8',    W-16,H-16,120],
    ['big',       300, 220, 120],
    ['mid',       200, 120, 120],
    ['small',     40,  40,  120],
    ['wide',      280, 30,  120],
    ['tall',      30,  200, 120],
    ['hair1odd',  200, 1,   121.5],
    ['hair1even', 200, 1,   120],
    ['hair2',     200, 2,   123],
    ['hair3',     200, 3,   123.5]
  ];
  var FXS = [
    ['none',        null],
    ['letterbox14', { type: 'letterbox', enabled: true, params: { size: 14 } }],
    ['letterbox30', { type: 'letterbox', enabled: true, params: { size: 30 } }],
    ['border10',    { type: 'border', enabled: true, params: { width: 10, color: '#ffffff' } }],
    ['border3',     { type: 'border', enabled: true, params: { width: 3, color: '#ff0000' } }],
    // CONTROLS — untouched by the bounded-frame change. If these ever differ, the change leaked.
    ['blur',        { type: 'blur', enabled: true, params: { radius: 6 } }],
    ['vignette',    { type: 'vignette', enabled: true, params: { amount: 0.6 } }],
    ['lightglow',   { type: 'lightglow', enabled: true, params: { amount: 0.6 } }]
  ];
  var lines = [];
  SUBJ.forEach(function (s) {
    FXS.forEach(function (f) {
      [1, 0.5, 0.35].forEach(function (rs) {
        var key = s[0] + '|' + f[0] + '|' + rs;
        var solo, stack;
        try { solo = shot([rect(s[0], s[1], s[2], s[3], f[1])], rs); } catch (e) { solo = 'ERR:' + e.message; }
        try { stack = shot([rect(s[0], s[1], s[2], s[3], f[1]), below()], rs); } catch (e) { stack = 'ERR:' + e.message; }
        lines.push(key + ' solo=' + solo + ' stack=' + stack);
      });
    });
  });
  document.getElementById('out').textContent = lines.join('\n');
  window.__done = true;
})();
</script>
</body>
</html>
