<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutorials prototype (layout A)</title><style>
:root{--bg:#0e1320;--stage:#131b26;--panel:#161c28;--panel-2:#1e2533;--panel-3:#283143;--line:#2b3547;--line-soft:#1f2734;--text:#eef2f8;--text-dim:#8b96a8;--text-faint:#59647a;--accent:#29d9bb;--accent-2:#18b89c;--am-green:#1ed760;--accent-soft:rgba(41,217,187,.15);--kf:#ffce4a;--good:#4cd497;--radius:10px;--radius-sm:7px;--warn:#d9a05b}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.bar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.bar .t{flex:1;font-weight:700;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--panel-2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:7px;padding:10px 14px}.tab{flex:1;text-align:center;padding:9px 4px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font-size:12.5px}.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.search{margin:0 14px 12px;height:40px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:0 16px;font:inherit;width:calc(100% - 28px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 24px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:12px;padding:0 18px 28px}.tabs,.search{max-width:520px}}
.tc{display:flex;flex-direction:column;position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0;font:inherit}
.tc .th{flex:none;height:84px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:rgba(255,255,255,.92)}
.tc .b{padding:8px 10px}.tc .n{font-weight:600;font-size:13px;line-height:1.25}.tc .m{color:var(--text-dim);font-size:11.5px;margin-top:3px}
.g0{background:linear-gradient(135deg,#2e7d6e,#1e4f6b)}.g1{background:linear-gradient(135deg,#6b4fa8,#2d3f7a)}.g2{background:linear-gradient(135deg,#a8683f,#7a2f4e)}.g3{background:linear-gradient(135deg,#3f7aa8,#2d6b4f)}.g4{background:linear-gradient(135deg,#a89a3f,#6b5a2d)}
.ribbon{position:absolute;top:8px;left:8px;background:var(--accent);color:#04201c;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px}
.empty{padding:40px 24px;text-align:center;color:var(--text-dim)}
.reader{max-width:700px;margin:0 auto;padding:16px 18px 96px}
.tt{font-size:21px;line-height:1.25;margin:0 0 8px}.intro{color:var(--text-dim);margin:0 0 14px}
.steps{list-style:none;counter-reset:s;margin:0 0 14px;padding:0}.steps li{counter-increment:s;position:relative;padding-left:36px;margin:0 0 11px;min-height:26px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.reader strong{color:#fff}.reader p{margin:0 0 12px}
.callout{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}.callout .lab{font-weight:800;margin-right:6px}.callout .lab::after{content:":"}
.callout.tip{background:rgba(255,206,74,.1);border:1px solid rgba(255,206,74,.35)}.callout.note{background:rgba(41,217,187,.08);border:1px solid rgba(41,217,187,.3)}
.callout.warn{background:rgba(217,160,91,.12);border:1px solid rgba(217,160,91,.4)}.callout.desk{background:var(--panel-2);border:1px solid var(--line)}
.pn{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:2}
.btn{height:40px;padding:0 18px;border-radius:99px;background:var(--accent);color:#04201c;font-weight:700;border:0;font:inherit;font-weight:700;cursor:pointer;flex:1;max-width:240px}.btn.g{background:var(--panel-3);color:var(--text)}.btn[disabled]{opacity:.35}
</style></head><body>
<div id="app"></div>
<script src="md.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), list = [], cache = {};
  function el(tag, cls, parent, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
  function get(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.text(); }); }
  function bar(title, back) {
    var b = el('div', 'bar', app);
    if (back) { var i = el('button', 'ib', b, '←'); i.setAttribute('aria-label', 'Back'); i.onclick = function () { location.hash = ''; }; }
    el('div', 't', b, title); return b;
  }
  function showList(q) {
    app.textContent = ''; bar('Tutorials');
    var t = el('div', 'tabs', app); ['Projects', 'Templates', 'Elements', 'Tutorials'].forEach(function (n) { el('div', 'tab' + (n === 'Tutorials' ? ' on' : ''), t, n); });
    var s = el('input', 'search', app); s.type = 'search'; s.placeholder = 'Search tutorials'; s.value = q || '';
    var grid = el('div', 'grid', app), gi = { Start: 0, Look: 1, Move: 2, Make: 3, 'Share and manage': 4 };
    function fill() {
      grid.textContent = ''; var n = 0, v = s.value.trim().toLowerCase();
      list.forEach(function (it, idx) {
        if (v && (it.title + ' ' + it.group).toLowerCase().indexOf(v) < 0) return;
        n++; var c = el('button', 'tc', grid); c.onclick = function () { location.hash = '#/' + it.file.slice(0, 2); };
        var th = el('div', 'th g' + gi[it.group], c, String(idx + 1)); if (idx === 0) el('span', 'ribbon', th, 'Start here');
        var b = el('div', 'b', c); el('div', 'n', b, it.title); el('div', 'm', b, it.group);
      });
      if (!n) { var e = el('div', 'empty', grid, 'No tutorial matches “' + s.value + '”.'); e.style.gridColumn = '1/-1'; }
    }
    s.oninput = fill; fill();
  }
  function showOne(num) {
    var idx = list.findIndex(function (it) { return it.file.slice(0, 2) === num; });
    if (idx < 0) return showList();
    var it = list[idx]; app.textContent = ''; bar('Tutorial ' + (idx + 1) + ' of ' + list.length, true);
    var root = el('div', 'reader', app); el('p', 'intro', root, 'Loading…');
    (cache[it.file] ? Promise.resolve(cache[it.file]) : get('tutorials/' + it.file)).then(function (src) {
      cache[it.file] = src; window.TutorialMd.render(src, root);
    }).catch(function () { root.textContent = ''; el('div', 'empty', root, "Couldn't load this tutorial. Check your connection."); });
    var pn = el('div', 'pn', app), pv = el('button', 'btn g', pn, '← Previous'), nx = el('button', 'btn', pn, 'Next →');
    pv.disabled = idx === 0; nx.disabled = idx === list.length - 1;
    pv.onclick = function () { location.hash = '#/' + list[idx - 1].file.slice(0, 2); };
    nx.onclick = function () { location.hash = '#/' + list[idx + 1].file.slice(0, 2); };
    window.scrollTo(0, 0);
  }
  function route() { var m = /^#\/(\d\d)$/.exec(location.hash); if (m) showOne(m[1]); else showList(); }
  get('tutorials/index.json').then(function (t) { list = JSON.parse(t); route(); window.addEventListener('hashchange', route); })
    .catch(function () { el('div', 'empty', app, "Couldn't load tutorials. Check your connection."); });
})();
</script></body></html>
